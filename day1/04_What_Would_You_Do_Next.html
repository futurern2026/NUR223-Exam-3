<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What Would You Do Next?</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f2f7;color:#25212a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}header{background:#43245f;color:#fff;padding:18px;position:sticky;top:0;z-index:5}.wrap,main{max-width:900px;margin:auto}h1{margin:0 0 5px}.sub{opacity:.9;font-size:13px}main{padding:14px}.card,.panel{background:#fff;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 3px 14px #0001}button{border:1px solid #d3ccd8;background:#fff;border-radius:9px;padding:11px;margin:5px;font-size:15px}button:hover{background:#f1eaf5}.primary{background:#43245f;color:#fff}.correct{background:#e5f4e8!important;border-color:#559164!important}.wrong{background:#fde8e8!important;border-color:#b95a5a!important}.feedback{margin-top:12px;padding:12px;border-radius:9px;background:#f3eef6;line-height:1.5}.hidden{display:none}.score{font-weight:750}.choice{display:block;width:100%;text-align:left}.big{font-size:22px;font-weight:750;line-height:1.4}.tag{font-size:12px;font-weight:800;text-transform:uppercase;color:#76518d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.drop{min-height:120px;border:2px dashed #c9bfd0;border-radius:12px;padding:10px}.item{background:#fff;border:1px solid #d8d0dd;border-radius:9px;padding:10px;margin:7px 0;cursor:pointer}.selected{outline:3px solid #8b68a0}.order{padding:10px;border:1px solid #ddd;border-radius:9px;margin:7px 0;background:#fff}.small{font-size:12px;color:#666}a{color:#43245f}</style><style id="study-site-nav-css">.study-site-nav{position:fixed;right:14px;bottom:14px;z-index:99999;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.study-site-nav a{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;text-decoration:none;background:#172033;color:#fff!important;border:1px solid #ffffff38;border-radius:999px;padding:9px 12px;font-size:13px;font-weight:800;box-shadow:0 4px 14px #0003}.study-site-nav a:first-child{background:#3448c5}@media(max-width:520px){.study-site-nav{left:10px;right:10px;bottom:10px}.study-site-nav a{flex:1;text-align:center}}</style></head><body><header><div class="wrap"><h1>What Would You Do Next?</h1><div class="sub">Evolving nursing-priority decisions</div></div></header><main><div class="panel score" id="score"></div><div id="game"></div><button class="primary" onclick="next()">Next</button></main><script>const Q=[{"topic": "TBI", "q": "A client arrives after a head-on collision. The client is breathing spontaneously, and cervical injury has not been ruled out. What should the nurse do next?", "o": ["Maintain cervical-spine stabilization", "Flex the neck to assess pain", "Remove stabilization for range-of-motion testing", "Sit the client upright and rotate the head"], "a": 0, "r": "Head trauma can coexist with cervical-spine injury. Maintain stabilization until cervical injury is ruled out."}, {"topic": "TBI", "q": "Thirty minutes later, the client's oxygen saturation falls from 97% to 86%. What should the nurse prioritize next?", "o": ["Address oxygenation", "Wait for the next GCS", "Encourage oral fluids", "Dim the lights only"], "a": 0, "r": "Hypoxia can produce secondary brain injury. Airway and oxygenation take priority."}, {"topic": "TBI", "q": "A TBI client's GCS falls from 14 to 11, the right pupil becomes sluggish, and the client vomits. What should the nurse do next?", "o": ["Recognize deterioration and escalate care promptly", "Allow uninterrupted sleep", "Reassess at end of shift", "Document as expected concussion recovery"], "a": 0, "r": "The falling GCS, new pupillary change, and vomiting establish neurologic deterioration."}, {"topic": "Increased ICP", "q": "A client with increased ICP is restless and the head is rotated sharply to the side. What should the nurse do next?", "o": ["Return the head and neck to neutral alignment", "Increase neck flexion", "Lower the head below the heart", "Encourage forceful coughing"], "a": 0, "r": "Neutral alignment supports cerebral venous drainage and avoids an unnecessary contributor to ICP elevation."}, {"topic": "Increased ICP", "q": "A client progresses from confusion to near unresponsiveness and develops posturing. What should the nurse do next?", "o": ["Treat this as late neurologic deterioration and escalate immediately", "Label it an early mild finding", "Wait for headache to develop", "Encourage ambulation"], "a": 0, "r": "Marked LOC decline plus posturing establishes late, ominous deterioration."}, {"topic": "Seizures", "q": "A client begins a tonic-clonic seizure while standing. What should the nurse do next?", "o": ["Ease the client to the floor and protect the head", "Restrain the arms", "Place an object in the mouth", "Keep the client standing"], "a": 0, "r": "Immediate injury prevention is the priority. Do not restrain or place objects in the mouth."}, {"topic": "Seizures", "q": "The seizure has ended. The client is sleepy, confused, breathing spontaneously, and has oral secretions. What should the nurse do next?", "o": ["Maintain side-lying positioning and manage secretions", "Give oral fluids immediately", "Force ambulation", "Apply restraints"], "a": 0, "r": "Postictal care continues airway protection; side-lying promotes drainage while alertness is reduced."}, {"topic": "Seizures", "q": "A generalized seizure has continued for 6 minutes. What should the nurse anticipate next?", "o": ["Emergency treatment for status epilepticus", "Routine discharge teaching", "Only a maintenance dose at the next scheduled time", "No action until 10 minutes"], "a": 0, "r": "A seizure lasting 5 minutes or longer meets the lecture definition of status epilepticus."}, {"topic": "Hydrocephalus", "q": "A child with a VP shunt develops headache, repeated vomiting, and decreasing responsiveness without redness or fever. What should the nurse do next?", "o": ["Treat this as possible shunt obstruction and obtain prompt evaluation", "Reassure the family this is expected", "Assume shunt infection only", "Encourage vigorous activity"], "a": 0, "r": "Return of hydrocephalus symptoms and neurologic decline support shunt obstruction."}, {"topic": "Hydrocephalus", "q": "A child with a VP shunt develops fever plus redness and tenderness along the shunt tract. What should the nurse do next?", "o": ["Promptly evaluate for shunt infection", "Assume normal shunt function", "Treat as uncomplicated concussion", "Delay assessment until vomiting occurs"], "a": 0, "r": "Fever with local redness/tenderness is the PowerPoint pattern for shunt infection."}];let i=0,s=0,a=0;const g=document.getElementById('game'),sc=document.getElementById('score');
function render(){let q=Q[i];g.innerHTML=`<div class="card"><div class="tag">${q.topic}</div><div class="big">${q.q}</div><div id="opts">${q.o.map((x,j)=>`<button class="choice" data-i="${j}">${x}</button>`).join('')}</div><div id="fb"></div></div>`;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>ans(b,+b.dataset.i,q));upd()}
function ans(b,j,q){if(document.querySelector('#fb').innerHTML)return;a++;document.querySelectorAll('.choice').forEach((x,k)=>{x.disabled=true;if(k===q.a)x.classList.add('correct')});if(j===q.a){s++;b.classList.add('correct')}else b.classList.add('wrong');document.querySelector('#fb').innerHTML=`<div class="feedback"><b>${j===q.a?'Correct':'Review'}</b><br>${q.r}</div>`;upd()}
function upd(){sc.textContent=`Score: ${s}/${a} · Item ${i+1}/${Q.length}`}function next(){i=(i+1)%Q.length;render()}render();</script><nav class="study-site-nav" aria-label="Study site navigation"><a href="index.html">← Day1 Home</a><a href="../index.html">Exam 3 Main</a></nav></body></html>
