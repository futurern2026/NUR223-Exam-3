<style>*{box-sizing:border-box}body{margin:0;background:#f6f4f8;color:#25222a;font-family:Arial,sans-serif}header{position:sticky;top:0;z-index:10;background:#43245f;color:#fff;padding:18px}.wrap,main{max-width:1050px;margin:auto}h1{margin:0 0 4px}.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}button,select,input{border:1px solid #c9c3ce;border-radius:8px;padding:9px 11px}.summary,.card{background:#fff;border-radius:12px;padding:15px;margin:12px 0;box-shadow:0 2px 9px #0001}.meta{font-size:12px;font-weight:700;color:#6b4786}.stem{font-size:17px;font-weight:650;line-height:1.45;margin:10px 0}.opt{display:block;width:100%;text-align:left;background:#fff;margin:7px 0;padding:11px;border:1px solid #d2cdd5;border-radius:9px}.sel{background:#eee5f5!important;border-color:#765099!important}.right{background:#e7f5ea!important;border-color:#5b9e6c!important}.wrong{background:#fff0ee!important;border-color:#c8756e!important}.check{background:#43245f;color:#fff}.feedback{display:none;margin-top:10px;padding:12px;border-radius:9px;background:#f3f3f5;line-height:1.55}.show{display:block}.src{font-size:12px;color:#666;margin-top:8px}</style><style id="study-site-nav-css">.study-site-nav{position:fixed;right:14px;bottom:14px;z-index:99999;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.study-site-nav a{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;text-decoration:none;background:#172033;color:#fff!important;border:1px solid #ffffff38;border-radius:999px;padding:9px 12px;font-size:13px;font-weight:800;box-shadow:0 4px 14px #0003}.study-site-nav a:first-child{background:#3448c5}@media(max-width:520px){.study-site-nav{left:10px;right:10px;bottom:10px}.study-site-nav a{flex:1;text-align:center}}</style></head><body>
<header><div class="wrap"><h1>NUR 223 Exam 3 — Day 1</h1><div>Quality-first clinical reasoning bank · PowerPoint content boundary · severity/timing aligned</div><div class="tools"><select id="topic"><option value="all">All topics</option></select><select id="type"><option value="all">All types</option><option value="mcq">Multiple Choice</option><option value="sata">Select All That Apply</option></select><input id="search" placeholder="Search questions"><button onclick="miss()">Review Missed</button><button onclick="shuffleQ()">Shuffle</button><button onclick="resetQ()">Reset</button></div></div></header>
<main><div class="summary" id="sum"></div><div id="quiz"></div></main><script>
const DATA=[{"topic": "Neurologic Assessment", "page": 7, "type": "mcq", "question": "A client arrives with sudden confusion and unilateral weakness. The family says the client was normal earlier today. Which question is most important for the nurse to ask first?", "options": ["When was the client last known to be at the usual neurologic baseline?", "What did the client eat for breakfast?", "When was the client's last bowel movement?", "How many hours does the client usually sleep?"], "correct": ["When was the client last known to be at the usual neurologic baseline?"], "rationale": "Onset and last-known-well time establish when an acute neurologic change began. The other questions can be part of a broader history, but they do not establish the timing of the neurologic event.", "id": 1}, {"topic": "Neurologic Assessment", "page": 8, "type": "mcq", "question": "A client was alert and oriented 1 hour ago. On reassessment, the client is difficult to arouse and answers questions incorrectly. Which interpretation should guide the nurse's next action?", "options": ["The change from baseline represents neurologic deterioration", "Neurologic findings normally fluctuate this much", "The client can be reassessed at the end of the shift", "The finding is reassuring because the client can still speak"], "correct": ["The change from baseline represents neurologic deterioration"], "rationale": "A decline in level of consciousness from baseline is a significant neurologic change. Serial assessments matter because the trend can reveal deterioration even before other dramatic findings appear.", "id": 2}, {"topic": "Neurologic Assessment", "page": 5, "type": "sata", "question": "The nurse performs a focused neurologic assessment after a client's condition changes. Which assessments should the nurse include? Select all that apply.", "options": ["Pupil size and reaction", "Eye movement", "Facial symmetry", "Speech and swallowing", "Tongue movement", "Abdominal girth"], "correct": ["Pupil size and reaction", "Eye movement", "Facial symmetry", "Speech and swallowing", "Tongue movement"], "rationale": "The focused neurologic assessment in the lecture includes pupils, eye movement, facial symmetry, speech/swallowing, tongue movement, and shoulder strength. Abdominal girth does not assess neurologic function.", "id": 3}, {"topic": "Hydrocephalus", "page": 11, "type": "mcq", "question": "At a follow-up visit, an infant's head circumference has increased rapidly. The nurse also notes a tense fontanel and prominent scalp veins. Which condition do these findings support?", "options": ["Hydrocephalus", "Expected cranial growth", "VP shunt infection", "Postictal recovery"], "correct": ["Hydrocephalus"], "rationale": "Rapid head growth, a bulging or tense fontanel, and prominent scalp veins are characteristic infant findings of hydrocephalus as CSF accumulates.", "id": 4}, {"topic": "Hydrocephalus", "page": 11, "type": "mcq", "question": "An infant being monitored for hydrocephalus becomes increasingly lethargic and begins vomiting. Which interpretation is most appropriate?", "options": ["The infant may be developing worsening intracranial pressure", "The findings show that CSF drainage has improved", "The findings represent normal feeding intolerance only", "The infant is showing expected developmental behavior"], "correct": ["The infant may be developing worsening intracranial pressure"], "rationale": "Vomiting and lethargy or decreased LOC are worsening findings in hydrocephalus. The change in neurologic responsiveness makes this more concerning than an isolated feeding problem.", "id": 5}, {"topic": "Hydrocephalus", "page": 11, "type": "mcq", "question": "The parent of an infant with hydrocephalus asks what the nurse means by 'sunset eyes.' Which finding should the nurse describe?", "options": ["Downward deviation of the eyes", "Unequal pupil size after eye drops", "Rapid side-to-side movement only during sleep", "Complete inability to close the eyelids"], "correct": ["Downward deviation of the eyes"], "rationale": "Sunset eyes describe downward deviation of the eyes and are associated with infant hydrocephalus.", "id": 6}, {"topic": "Hydrocephalus", "page": 12, "type": "mcq", "question": "A child with a VP shunt was playful this morning. The child now reports headache, has vomited twice, and is becoming less responsive. There is no redness or tenderness along the shunt tract. Which complication should the nurse suspect first?", "options": ["VP shunt obstruction", "VP shunt infection", "Expected shunt function", "Normal fatigue after activity"], "correct": ["VP shunt obstruction"], "rationale": "Headache, vomiting, and neurologic decline suggest inadequate CSF diversion and recurrence of hydrocephalus from shunt obstruction. Infection is more strongly suggested by fever and redness or tenderness along the shunt tract.", "id": 7}, {"topic": "Hydrocephalus", "page": 12, "type": "mcq", "question": "A child with a VP shunt develops a fever. The nurse notes redness and tenderness along the shunt tract. Which complication is most consistent with these findings?", "options": ["VP shunt infection", "VP shunt obstruction without infection", "Expected postoperative adaptation", "Improved CSF drainage"], "correct": ["VP shunt infection"], "rationale": "Fever with redness or tenderness along the shunt tract points toward infection. Obstruction more typically causes return of hydrocephalus manifestations such as headache, vomiting, and neurologic decline.", "id": 8}, {"topic": "Hydrocephalus", "page": 12, "type": "mcq", "question": "During discharge teaching, a parent asks how a VP shunt treats hydrocephalus. Which response by the nurse is correct?", "options": ["It diverts excess CSF from the ventricles to the peritoneal cavity", "It permanently stops CSF production", "It records electrical activity of the brain", "It removes a brain tumor blocking CSF flow"], "correct": ["It diverts excess CSF from the ventricles to the peritoneal cavity"], "rationale": "A ventriculoperitoneal shunt provides an alternate pathway for excess CSF, moving it from the cerebral ventricles to the peritoneal cavity.", "id": 9}, {"topic": "Hydrocephalus", "page": 12, "type": "sata", "question": "A parent calls about a child with a VP shunt. Which findings require prompt evaluation for shunt malfunction or infection? Select all that apply.", "options": ["Repeated vomiting", "New headache", "Decreasing level of consciousness", "Fever with redness along the shunt tract", "Improved appetite", "Increased playfulness"], "correct": ["Repeated vomiting", "New headache", "Decreasing level of consciousness", "Fever with redness along the shunt tract"], "rationale": "Vomiting, headache, and neurologic decline can indicate obstruction and return of hydrocephalus. Fever with redness along the shunt tract suggests infection. Improved appetite and playfulness do not suggest deterioration.", "id": 10}, {"topic": "Traumatic Brain Injury", "page": 15, "type": "mcq", "question": "A client is admitted immediately after striking the head on the steering wheel. CT findings include a cerebral contusion. How should the nurse classify the contusion?", "options": ["A primary brain injury caused by the initial impact", "A secondary injury caused by later hypoxia", "A postictal complication", "A manifestation of VP shunt failure"], "correct": ["A primary brain injury caused by the initial impact"], "rationale": "A contusion is produced by the initial traumatic force and is therefore a primary brain injury. Secondary injury develops afterward and includes hypoxia, ischemia, cerebral edema, and increased ICP.", "id": 11}, {"topic": "Traumatic Brain Injury", "page": 15, "type": "mcq", "question": "A client sustained a head injury several hours ago. The initial trauma has already occurred, but the client now develops hypoxia and cerebral edema. How should the nurse interpret these new problems?", "options": ["They are secondary injuries that can extend the original brain damage", "They are primary injuries that occurred only at impact", "They show that the original injury has resolved", "They are expected findings during uncomplicated recovery"], "correct": ["They are secondary injuries that can extend the original brain damage"], "rationale": "Secondary injury develops after the impact. Hypoxia and cerebral edema can further damage vulnerable brain tissue, which is why preventing secondary injury is a major goal of TBI care.", "id": 12}, {"topic": "Traumatic Brain Injury", "page": 16, "type": "mcq", "question": "A client with a recent concussion reports headache, dizziness, and sensitivity to light. Which additional symptom fits the same mild-TBI pattern?", "options": ["Difficulty with memory or concentration", "Progressive jaundice", "Painful urination", "Bilateral dependent edema"], "correct": ["Difficulty with memory or concentration"], "rationale": "Concussion can cause headache, dizziness, nausea, confusion or fogginess, memory and concentration problems, light/noise sensitivity, and balance problems.", "id": 13}, {"topic": "Traumatic Brain Injury", "page": 17, "type": "mcq", "question": "A client with TBI had a GCS score of 14 one hour ago. The score is now 11, the client has vomited, and the right pupil is sluggish. Which action should the nurse take?", "options": ["Recognize neurologic deterioration and escalate care promptly", "Document the findings as expected recovery", "Delay reassessment until the next scheduled vital signs", "Encourage sleep without further neurologic checks"], "correct": ["Recognize neurologic deterioration and escalate care promptly"], "rationale": "The falling GCS, vomiting, and new pupillary abnormality form a pattern of neurologic deterioration. Waiting would delay recognition of potentially worsening ICP or brain injury.", "id": 14}, {"topic": "Traumatic Brain Injury", "page": 17, "type": "mcq", "question": "An unresponsive client arrives after a head-on collision. The client is breathing spontaneously, and cervical spine injury has not been ruled out. Which action is a priority during the initial assessment?", "options": ["Maintain cervical-spine stabilization", "Flex the neck to improve comfort", "Remove stabilization to assess range of motion", "Turn the head side to side to assess pain"], "correct": ["Maintain cervical-spine stabilization"], "rationale": "Head trauma can coexist with cervical-spine injury. Alignment is protected until injury is ruled out because unnecessary movement could worsen spinal cord damage.", "id": 15}, {"topic": "Traumatic Brain Injury", "page": 17, "type": "mcq", "question": "A client with TBI has an oxygen saturation that falls from 97% to 86%. Why should the nurse respond immediately?", "options": ["Hypoxia can cause secondary brain injury", "Low oxygen converts a concussion into a skull fracture", "Hypoxia is expected while the brain heals", "Oxygenation does not affect injured brain tissue"], "correct": ["Hypoxia can cause secondary brain injury"], "rationale": "The injured brain is vulnerable to additional damage when oxygen delivery falls. Maintaining oxygenation helps prevent secondary brain injury.", "id": 16}, {"topic": "Traumatic Brain Injury", "page": 17, "type": "mcq", "question": "A client with TBI becomes hypotensive. Why is this a neurologic concern as well as a circulatory concern?", "options": ["Hypotension can reduce cerebral perfusion and worsen secondary injury", "Hypotension directly causes a primary skull fracture", "Low blood pressure reliably lowers brain metabolic needs", "Hypotension is protective after TBI"], "correct": ["Hypotension can reduce cerebral perfusion and worsen secondary injury"], "rationale": "Adequate arterial pressure supports cerebral perfusion. Hypotension can reduce blood flow to injured brain tissue and contribute to ischemia.", "id": 17}, {"topic": "Traumatic Brain Injury", "page": 17, "type": "sata", "question": "A client with TBI was stable 30 minutes ago. Which new findings indicate neurologic deterioration requiring prompt follow-up? Select all that apply.", "options": ["GCS decreases from 14 to 11", "One pupil becomes sluggish", "New unilateral weakness develops", "The client becomes difficult to arouse", "The client reports less headache", "Orientation improves"], "correct": ["GCS decreases from 14 to 11", "One pupil becomes sluggish", "New unilateral weakness develops", "The client becomes difficult to arouse"], "rationale": "A falling GCS and difficulty with arousal indicate worsening LOC. New pupillary and motor changes can reflect focal or pressure-related deterioration. Less headache and improved orientation suggest improvement.", "id": 18}, {"topic": "Traumatic Brain Injury", "page": 15, "type": "sata", "question": "Which problems can develop after the initial impact and are classified as secondary brain injuries? Select all that apply.", "options": ["Hypoxia", "Ischemia", "Cerebral edema", "Increased intracranial pressure", "Concussion", "Skull fracture"], "correct": ["Hypoxia", "Ischemia", "Cerebral edema", "Increased intracranial pressure"], "rationale": "Hypoxia, ischemia, cerebral edema, and increased ICP develop after the initial trauma and can extend brain damage. Concussion and skull fracture occur with the initial impact and are primary injuries.", "id": 19}, {"topic": "Brain Tumors", "page": 19, "type": "mcq", "question": "A client with lung cancer is found to have a brain mass that represents spread from the lung. How should the nurse classify the brain tumor?", "options": ["Secondary or metastatic brain tumor", "Primary brain tumor", "Concussion", "Hydrocephalus"], "correct": ["Secondary or metastatic brain tumor"], "rationale": "A secondary brain tumor represents metastasis to the brain from another primary site. A primary brain tumor originates within the CNS.", "id": 20}, {"topic": "Brain Tumors", "page": 20, "type": "mcq", "question": "A client with a known brain tumor reports worsening headaches and repeated vomiting and is becoming less alert. Which problem should the nurse consider when interpreting this cluster of findings?", "options": ["Increasing intracranial pressure", "Improved cerebral perfusion", "Resolution of the tumor", "Expected absence-seizure activity"], "correct": ["Increasing intracranial pressure"], "rationale": "Brain tumors can produce increased-ICP manifestations. Worsening headache, vomiting, and decreasing LOC together suggest pressure effects rather than stability.", "id": 21}, {"topic": "Brain Tumors", "page": 20, "type": "mcq", "question": "A client with a brain tumor develops new weakness of the right arm. Why is this finding clinically important?", "options": ["A brain tumor can produce focal neurologic deficits based on the area affected", "Focal weakness confirms the tumor is benign", "Unilateral weakness occurs only after a seizure", "Motor changes are unrelated to brain tumors"], "correct": ["A brain tumor can produce focal neurologic deficits based on the area affected"], "rationale": "Brain tumors can disrupt function in a specific region and cause focal weakness, sensory changes, speech/language changes, visual changes, or balance problems.", "id": 22}, {"topic": "Brain Tumors", "page": 21, "type": "mcq", "question": "A client is being evaluated for a suspected brain tumor. Which diagnostic study should the nurse recognize as providing detailed structural imaging of the brain?", "options": ["MRI", "EEG", "Peak-flow testing", "Skin-prick testing"], "correct": ["MRI"], "rationale": "MRI is used to evaluate brain structures and suspected tumors. EEG evaluates electrical activity rather than tumor anatomy.", "id": 23}, {"topic": "Brain Tumors", "page": 21, "type": "mcq", "question": "Imaging identifies a brain mass, and tissue characterization is needed to guide treatment. Which procedure should the nurse anticipate when indicated?", "options": ["Biopsy with pathology", "EEG only", "Vagal nerve stimulation", "VP shunt placement for every tumor"], "correct": ["Biopsy with pathology"], "rationale": "When indicated, biopsy provides tissue for pathologic examination. Imaging identifies the lesion, while pathology provides tissue-level characterization.", "id": 24}, {"topic": "Brain Tumors", "page": 20, "type": "sata", "question": "A client is being evaluated for a brain tumor. Which findings are consistent with the neurologic effects described in the lecture? Select all that apply.", "options": ["New focal weakness", "Seizure activity", "Speech or language change", "Personality or cognitive change", "Improved coordination", "Consistently increasing alertness"], "correct": ["New focal weakness", "Seizure activity", "Speech or language change", "Personality or cognitive change"], "rationale": "Brain tumors can cause focal weakness, seizures, speech/language changes, sensory or visual changes, balance problems, and personality/cognitive changes. Improved coordination and increasing alertness do not represent deterioration.", "id": 25}, {"topic": "Increased ICP", "page": 24, "type": "mcq", "question": "A client develops cerebral edema after a neurologic injury. According to the Monro-Kellie doctrine, what must initially occur if intracranial pressure is to remain compensated?", "options": ["Another intracranial component must decrease in volume", "The adult skull must expand", "Brain tissue, blood, and CSF must all increase together", "Cerebral perfusion must automatically increase"], "correct": ["Another intracranial component must decrease in volume"], "rationale": "The adult skull is a fixed space containing brain tissue, blood, and CSF. When one component increases, another must initially decrease to compensate. Once compensation is exhausted, ICP rises.", "id": 26}, {"topic": "Increased ICP", "page": 25, "type": "mcq", "question": "A client develops cerebral edema. Which intracranial component has increased?", "options": ["Brain tissue volume", "CSF volume", "Intracranial blood volume", "Skull volume"], "correct": ["Brain tissue volume"], "rationale": "Cerebral edema increases the brain-tissue component within the fixed cranial vault.", "id": 27}, {"topic": "Increased ICP", "page": 25, "type": "mcq", "question": "A client has obstructed CSF flow and develops hydrocephalus. Which intracranial component is increasing?", "options": ["CSF volume", "Brain tissue volume", "Intracranial blood volume", "Skull volume"], "correct": ["CSF volume"], "rationale": "Hydrocephalus results from excess CSF or impaired CSF flow, increasing the CSF component inside the fixed skull.", "id": 28}, {"topic": "Increased ICP", "page": 25, "type": "mcq", "question": "A client develops an intracranial hemorrhage. Which intracranial component is directly increased by the hemorrhage?", "options": ["Blood volume", "CSF volume", "Skull volume", "Brain tissue volume only"], "correct": ["Blood volume"], "rationale": "Intracranial hemorrhage adds blood within the fixed cranial vault, consuming compensatory reserve and potentially increasing ICP.", "id": 29}, {"topic": "Increased ICP", "page": 30, "type": "mcq", "question": "A client at risk for increased ICP was alert and oriented at 0800. At 0830 the client is restless, confused, and slower to respond, but pupils remain reactive and no posturing is present. Which interpretation is most appropriate?", "options": ["These can be early signs of worsening ICP", "These are late findings that occur only after herniation", "These findings rule out neurologic deterioration", "These findings are expected after every neurologic injury"], "correct": ["These can be early signs of worsening ICP"], "rationale": "Change in LOC, restlessness, and confusion can occur early as cerebral function begins to deteriorate. Fixed pupils, posturing, marked LOC decline, and Cushing's triad are later, more ominous findings.", "id": 30}, {"topic": "Increased ICP", "page": 30, "type": "mcq", "question": "A client with known increased ICP has progressed from confusion to near unresponsiveness. The nurse now observes abnormal posturing. Which interpretation is most appropriate?", "options": ["The client is demonstrating late neurologic deterioration", "The client is showing an early mild change only", "The finding indicates improving cerebral perfusion", "The finding is expected and needs no escalation"], "correct": ["The client is demonstrating late neurologic deterioration"], "rationale": "Markedly decreased LOC and abnormal posturing are late, ominous findings. The progression from confusion to near unresponsiveness establishes worsening severity.", "id": 31}, {"topic": "Increased ICP", "page": 30, "type": "mcq", "question": "A client with worsening increased ICP becomes difficult to arouse. The left pupil is now fixed and dilated. Which interpretation should the nurse make?", "options": ["This is a late, ominous neurologic finding", "This is an expected early symptom requiring no action", "This indicates ICP has normalized", "This finding is unrelated to intracranial pressure"], "correct": ["This is a late, ominous neurologic finding"], "rationale": "A fixed, dilated pupil in a client whose LOC is worsening is a late and dangerous sign. The severity cues distinguish it from earlier findings such as headache, nausea, restlessness, or mild confusion.", "id": 32}, {"topic": "Increased ICP", "page": 31, "type": "mcq", "question": "A client with severe increased ICP is increasingly unresponsive. Vital signs change from BP 128/76, HR 88, regular respirations to BP 178/64, HR 48, and irregular respirations. Which pattern should the nurse recognize?", "options": ["Cushing's triad", "Expected postictal recovery", "Early uncomplicated concussion", "VP shunt infection"], "correct": ["Cushing's triad"], "rationale": "Hypertension with widening pulse pressure, bradycardia, and irregular respirations is Cushing's triad. In a client with severe ICP elevation and declining LOC, it is a late, ominous pattern.", "id": 33}, {"topic": "Increased ICP", "page": 31, "type": "mcq", "question": "A client with increased ICP suddenly becomes unresponsive, develops a fixed pupil, abnormal posturing, and worsening irregular respirations. Which complication should the nurse suspect?", "options": ["Brain herniation", "Mild concussion recovery", "Uncomplicated postictal fatigue", "Expected response to rest"], "correct": ["Brain herniation"], "rationale": "Rapid LOC decline with pupil changes, posturing, and respiratory deterioration is a severe pattern associated with brain herniation.", "id": 34}, {"topic": "Increased ICP", "page": 33, "type": "mcq", "question": "A client with increased ICP requires continuous pressure monitoring and therapeutic drainage of CSF. Which device best meets both needs?", "options": ["External ventricular drain", "Intraparenchymal monitor", "EEG electrodes", "Vagal nerve stimulator"], "correct": ["External ventricular drain"], "rationale": "An external ventricular drain can measure ICP and drain CSF. An intraparenchymal monitor measures ICP but cannot provide ventricular CSF drainage.", "id": 35}, {"topic": "Increased ICP", "page": 33, "type": "mcq", "question": "A client requires direct ICP measurement, but the prescribed device will not be used to drain CSF. Which device fits this description?", "options": ["Intraparenchymal monitor", "External ventricular drain", "VP shunt", "EEG"], "correct": ["Intraparenchymal monitor"], "rationale": "An intraparenchymal monitor directly measures ICP but cannot drain CSF. This distinguishes it from an EVD.", "id": 36}, {"topic": "Increased ICP", "page": 35, "type": "mcq", "question": "A client with cerebral edema receives mannitol. Which assessments are most relevant for evaluating therapy and detecting complications?", "options": ["Neurologic status, blood pressure, intake/output, renal function, and osmolality", "Bowel sounds, visual acuity, and skin color only", "Hearing, dental status, and grip preference only", "Calf circumference and bowel pattern only"], "correct": ["Neurologic status, blood pressure, intake/output, renal function, and osmolality"], "rationale": "Mannitol is hyperosmolar therapy. Neurologic assessment evaluates response, while BP, fluid balance, renal function, and osmolality help monitor the physiologic effects of osmotic fluid shifts.", "id": 37}, {"topic": "Increased ICP", "page": 35, "type": "mcq", "question": "A client with cerebral edema is receiving hypertonic saline. Which laboratory value is especially important to trend along with osmolality and fluid balance?", "options": ["Serum sodium", "Hemoglobin A1c", "Serum amylase", "Bilirubin"], "correct": ["Serum sodium"], "rationale": "Hypertonic saline directly affects sodium concentration and osmolality. Sodium, osmolality, fluid balance, renal function, blood pressure, and neurologic status help evaluate safety and response.", "id": 38}, {"topic": "Increased ICP", "page": 38, "type": "mcq", "question": "A client with increased ICP is positioned with the head of the bed elevated as ordered. Which additional positioning action best supports cerebral venous drainage?", "options": ["Keep the head and neck in neutral alignment", "Flex the neck toward the chest", "Rotate the head sharply to one side", "Flex the hips as far as possible"], "correct": ["Keep the head and neck in neutral alignment"], "rationale": "Neutral head and neck alignment supports cerebral venous drainage. Excessive flexion or rotation can impede venous outflow and contribute to avoidable ICP elevation.", "id": 39}, {"topic": "Increased ICP", "page": 38, "type": "mcq", "question": "A client with increased ICP becomes agitated and reports severe pain. Why should the nurse address these problems as part of ICP management?", "options": ["Pain and agitation can contribute to avoidable ICP elevations", "Pain always lowers cerebral metabolic demand", "Agitation improves cerebral venous drainage", "Pain and agitation do not affect neurologic management"], "correct": ["Pain and agitation can contribute to avoidable ICP elevations"], "rationale": "Pain and agitation create physiologic stress and can contribute to ICP spikes. Controlling them is part of limiting avoidable increases in intracranial pressure.", "id": 40}, {"topic": "Increased ICP", "page": 38, "type": "mcq", "question": "A client with increased ICP develops a fever. Why is treatment of the fever included in the neurologic plan of care?", "options": ["Fever increases metabolic demand and adds physiologic stress to the injured brain", "Fever reliably lowers ICP without treatment", "Fever confirms the client is postictal", "Fever improves cerebral oxygen balance"], "correct": ["Fever increases metabolic demand and adds physiologic stress to the injured brain"], "rationale": "Fever increases metabolic demand. Treating it reduces avoidable physiologic stress in a brain already vulnerable to impaired perfusion and increased ICP.", "id": 41}, {"topic": "Increased ICP", "page": 27, "type": "mcq", "question": "A client's blood pressure is 150/72 mm Hg. Using MAP = (SBP + 2 × DBP) ÷ 3, which MAP should the nurse calculate?", "options": ["98 mm Hg", "111 mm Hg", "78 mm Hg", "72 mm Hg"], "correct": ["98 mm Hg"], "rationale": "MAP = (150 + 2 × 72) ÷ 3 = 294 ÷ 3 = 98 mm Hg.", "id": 42}, {"topic": "Increased ICP", "page": 28, "type": "mcq", "question": "A client's MAP is 92 mm Hg and ICP is 18 mm Hg. Using CPP = MAP − ICP, which CPP should the nurse calculate?", "options": ["74 mm Hg", "110 mm Hg", "92 mm Hg", "18 mm Hg"], "correct": ["74 mm Hg"], "rationale": "CPP = MAP − ICP = 92 − 18 = 74 mm Hg. The formula shows how rising ICP or falling MAP can reduce the pressure available to perfuse the brain.", "id": 43}, {"topic": "Increased ICP", "page": 30, "type": "sata", "question": "A client with a neurologic injury is beginning to deteriorate but does not yet have late signs of herniation. Which findings are consistent with early or worsening increased ICP? Select all that apply.", "options": ["New restlessness", "Increasing confusion", "Headache", "Nausea and vomiting", "Fixed dilated pupil with posturing", "Cushing's triad"], "correct": ["New restlessness", "Increasing confusion", "Headache", "Nausea and vomiting"], "rationale": "Restlessness, confusion/LOC change, headache, and nausea or vomiting can occur earlier in worsening ICP. A fixed dilated pupil with posturing and Cushing's triad are later, more ominous findings.", "id": 44}, {"topic": "Increased ICP", "page": 30, "type": "sata", "question": "A client with increased ICP has progressed to marked neurologic deterioration. Which findings should the nurse recognize as late or ominous? Select all that apply.", "options": ["Marked decrease in level of consciousness", "Fixed or dilated pupil", "Abnormal posturing", "Irregular respirations", "Mild isolated headache", "Mild nausea with full orientation"], "correct": ["Marked decrease in level of consciousness", "Fixed or dilated pupil", "Abnormal posturing", "Irregular respirations"], "rationale": "Marked LOC decline, fixed/dilated pupils, posturing, and respiratory changes are late, ominous findings. Mild headache or nausea can occur earlier and do not establish the same degree of deterioration.", "id": 45}, {"topic": "Increased ICP", "page": 38, "type": "sata", "question": "The nurse plans care for a client with increased ICP. Which interventions help limit avoidable increases in ICP or support cerebral venous drainage? Select all that apply.", "options": ["Elevate the head of the bed as ordered", "Keep the head and neck neutral", "Control pain and agitation", "Treat fever", "Flex the neck sharply", "Provide frequent unnecessary stimulation"], "correct": ["Elevate the head of the bed as ordered", "Keep the head and neck neutral", "Control pain and agitation", "Treat fever"], "rationale": "Head elevation and neutral alignment support venous drainage. Controlling pain/agitation and treating fever reduce avoidable physiologic stress. Sharp neck flexion can impede drainage, and unnecessary stimulation can contribute to agitation.", "id": 46}, {"topic": "Seizures", "page": 47, "type": "mcq", "question": "A client reports a strange smell and an unusual sensation immediately before the observable seizure begins. Which seizure phase should the nurse associate with this experience?", "options": ["Early ictal phase or aura", "Postictal phase", "Recovery after status epilepticus", "Late increased-ICP phase"], "correct": ["Early ictal phase or aura"], "rationale": "An aura occurs in the early ictal phase and can precede more obvious seizure manifestations. The postictal phase occurs after seizure activity ends.", "id": 47}, {"topic": "Seizures", "page": 47, "type": "mcq", "question": "A client suddenly loses consciousness, becomes rigid, and then develops rhythmic jerking of the extremities. Which seizure type best matches this description?", "options": ["Generalized tonic-clonic seizure", "Atonic seizure", "Absence seizure", "Myoclonic seizure"], "correct": ["Generalized tonic-clonic seizure"], "rationale": "Tonic-clonic seizures include tonic stiffening followed by clonic rhythmic jerking, usually with loss of consciousness.", "id": 48}, {"topic": "Seizures", "page": 47, "type": "mcq", "question": "A client suddenly loses muscle tone and drops to the floor without tonic stiffening and rhythmic jerking. Which seizure type should the nurse suspect?", "options": ["Atonic seizure", "Tonic-clonic seizure", "Absence seizure", "Myoclonic seizure"], "correct": ["Atonic seizure"], "rationale": "Atonic seizures cause sudden loss of muscle tone, which can result in a fall.", "id": 49}, {"topic": "Seizures", "page": 47, "type": "mcq", "question": "A client has several brief, shock-like jerks of the arms but remains aware. Which seizure type is most consistent with this presentation?", "options": ["Myoclonic seizure", "Atonic seizure", "Tonic-clonic seizure", "Absence seizure"], "correct": ["Myoclonic seizure"], "rationale": "Myoclonic seizures produce brief muscle jerks or contractions. This differs from sudden loss of tone in atonic seizures.", "id": 50}, {"topic": "Seizures", "page": 47, "type": "mcq", "question": "A school-age client briefly stops responding and stares for several seconds, then immediately resumes the previous activity. Which seizure type is most consistent with this description?", "options": ["Absence seizure", "Tonic-clonic seizure", "Atonic seizure", "Myoclonic seizure"], "correct": ["Absence seizure"], "rationale": "Absence seizures are characterized by a brief alteration or loss of awareness without the motor pattern of a tonic-clonic seizure.", "id": 51}, {"topic": "Seizures", "page": 47, "type": "mcq", "question": "A client's seizure begins with abnormal movement confined to one arm before other manifestations occur. Which classification should the nurse recognize?", "options": ["Focal seizure", "Absence seizure", "Atonic seizure", "Generalized tonic-clonic seizure from onset"], "correct": ["Focal seizure"], "rationale": "Focal seizures begin in one cerebral hemisphere, so manifestations can initially involve a specific body area or function.", "id": 52}, {"topic": "Seizures", "page": 49, "type": "mcq", "question": "A client has continuous generalized seizure activity that has lasted 6 minutes. Which condition should the nurse identify?", "options": ["Status epilepticus", "Expected postictal state", "Aura", "Uncomplicated concussion"], "correct": ["Status epilepticus"], "rationale": "Status epilepticus is seizure activity lasting 5 minutes or longer, or repeated seizures without recovery. It is a neurologic emergency.", "id": 53}, {"topic": "Seizures", "page": 49, "type": "mcq", "question": "A client has three seizures in succession and does not regain consciousness between episodes. Which complication should the nurse suspect?", "options": ["Status epilepticus", "Normal postictal recovery", "Absence seizure", "Concussion"], "correct": ["Status epilepticus"], "rationale": "Repeated seizures without recovery between episodes meet the definition of status epilepticus even when a single episode is not documented as lasting 5 minutes.", "id": 54}, {"topic": "Seizures", "page": 54, "type": "mcq", "question": "A client begins a generalized tonic-clonic seizure while in bed. Which action should the nurse take to reduce aspiration risk?", "options": ["Turn the client to the side", "Insert a tongue blade", "Restrain the client's arms and legs", "Give oral fluids immediately"], "correct": ["Turn the client to the side"], "rationale": "Side positioning helps secretions drain and supports airway protection. Nothing should be placed in the mouth, restraints can cause injury, and oral fluids are unsafe during impaired consciousness.", "id": 55}, {"topic": "Seizures", "page": 54, "type": "mcq", "question": "During an active convulsive seizure, a family member tries to hold the client's arms still. Which action should the nurse take?", "options": ["Stop the family member and protect the client from injury without restraining the movements", "Help restrain both arms", "Place an object in the client's mouth", "Force the client into a seated position"], "correct": ["Stop the family member and protect the client from injury without restraining the movements"], "rationale": "During a seizure, the nurse protects the client from injury without restraining the extremities. Restraint can cause injury, and objects should never be placed in the mouth.", "id": 56}, {"topic": "Seizures", "page": 55, "type": "mcq", "question": "A client has ongoing convulsive seizure activity. The provider prescribes a rescue benzodiazepine. Which medication should the nurse recognize as rescue therapy from the lecture?", "options": ["Lorazepam", "Levetiracetam", "Phenytoin", "Carbamazepine"], "correct": ["Lorazepam"], "rationale": "Lorazepam is one of the rescue benzodiazepines identified for ongoing seizure activity. Levetiracetam, phenytoin, and carbamazepine are maintenance antiseizure medications in the lecture.", "id": 57}, {"topic": "Seizures", "page": 55, "type": "mcq", "question": "A client receives lorazepam for an ongoing seizure. Which assessment is the nurse's priority after administration?", "options": ["Breathing and level of alertness", "Bowel sounds and stool color", "Pedal edema and calf circumference", "Hearing acuity only"], "correct": ["Breathing and level of alertness"], "rationale": "Rescue benzodiazepines can depress breathing and alertness. The nurse monitors respiratory status, level of alertness, seizure activity, and response to treatment.", "id": 58}, {"topic": "Seizures", "page": 55, "type": "mcq", "question": "A client with a seizure disorder takes levetiracetam on a scheduled basis. Which role should the nurse associate with this medication in the lecture?", "options": ["Maintenance seizure control", "Immediate rescue benzodiazepine therapy", "CSF drainage", "Osmotic reduction of cerebral edema"], "correct": ["Maintenance seizure control"], "rationale": "Levetiracetam is identified as maintenance antiseizure therapy. Rescue treatment for an ongoing seizure uses benzodiazepines such as lorazepam, diazepam, or midazolam.", "id": 59}, {"topic": "Seizures", "page": 58, "type": "mcq", "question": "A generalized tonic-clonic seizure has ended. The client is breathing spontaneously but is confused, sleepy, and has oral secretions. Which action should the nurse take first during the postictal period?", "options": ["Maintain side-lying positioning and manage secretions", "Force the client to ambulate", "Give oral fluids immediately", "Restrain the client until fully oriented"], "correct": ["Maintain side-lying positioning and manage secretions"], "rationale": "After the seizure, airway protection remains important because the client is drowsy and may not handle secretions well. Side-lying positioning promotes drainage.", "id": 60}, {"topic": "Seizures", "page": 58, "type": "mcq", "question": "A client is awake after a seizure but repeatedly asks what happened and appears embarrassed. Which nursing response is most appropriate?", "options": ["Reorient the client calmly and allow time for recovery", "Demand immediate recall of the entire event", "Apply restraints because confusion is expected", "Require immediate ambulation to restore orientation"], "correct": ["Reorient the client calmly and allow time for recovery"], "rationale": "Confusion and fatigue are common during the postictal period. Calm reorientation, rest, neurologic assessment, and supportive care promote safe recovery.", "id": 61}, {"topic": "Seizures", "page": 50, "type": "mcq", "question": "A client is being evaluated after recurrent episodes concerning for seizures. Which diagnostic study directly records electrical activity of the brain?", "options": ["EEG", "MRI", "CT", "Biopsy"], "correct": ["EEG"], "rationale": "EEG records cerebral electrical activity and is used in seizure evaluation. CT and MRI provide structural imaging.", "id": 62}, {"topic": "Seizures", "page": 56, "type": "mcq", "question": "A client with difficult-to-control seizures asks about an implanted device that provides intermittent stimulation to reduce seizure frequency. Which therapy is the client describing?", "options": ["Vagal nerve stimulator", "External ventricular drain", "VP shunt", "Intraparenchymal ICP monitor"], "correct": ["Vagal nerve stimulator"], "rationale": "A vagal nerve stimulator is an implanted device that intermittently stimulates the vagus nerve to help reduce seizures.", "id": 63}, {"topic": "Seizures", "page": 58, "type": "mcq", "question": "A client is confused immediately after a generalized tonic-clonic seizure. Which finding would make the nurse question whether this is uncomplicated postictal recovery?", "options": ["The client's level of consciousness continues to decline rather than gradually improve", "The client reports fatigue", "The client is embarrassed by the event", "The client has temporary muscle soreness"], "correct": ["The client's level of consciousness continues to decline rather than gradually improve"], "rationale": "Confusion, fatigue, and muscle soreness can occur after a convulsive seizure. Continued decline in LOC suggests worsening neurologic status and should not simply be attributed to the postictal state.", "id": 64}, {"topic": "Seizures", "page": 54, "type": "sata", "question": "A client begins a generalized convulsive seizure. Which actions should the nurse take during the seizure? Select all that apply.", "options": ["Turn the client to the side when possible", "Protect the client from injury", "Prepare suction equipment", "Loosen restrictive clothing", "Restrain the extremities", "Place an object in the mouth"], "correct": ["Turn the client to the side when possible", "Protect the client from injury", "Prepare suction equipment", "Loosen restrictive clothing"], "rationale": "During active seizure activity, the nurse protects the client from injury, supports airway protection with side positioning, prepares suction, and loosens restrictive clothing. Restraints can cause injury, and nothing should be placed in the mouth.", "id": 65}, {"topic": "Seizures", "page": 58, "type": "sata", "question": "A client's generalized seizure has stopped. The client is sleepy and confused but breathing spontaneously. Which actions belong in postictal care? Select all that apply.", "options": ["Maintain side-lying position", "Manage secretions", "Assess for injury", "Perform neurologic checks", "Reorient as alertness returns", "Force immediate oral intake"], "correct": ["Maintain side-lying position", "Manage secretions", "Assess for injury", "Perform neurologic checks", "Reorient as alertness returns"], "rationale": "Postictal care focuses on airway and secretion management, injury assessment, neurologic recovery, rest, and reorientation. Oral intake should not be forced while alertness and airway protection are impaired.", "id": 66}, {"topic": "Seizures", "page": 55, "type": "sata", "question": "A client receives a rescue benzodiazepine for prolonged seizure activity. Which assessments should the nurse prioritize after administration? Select all that apply.", "options": ["Respiratory status", "Level of alertness", "Ongoing seizure activity", "Response to the medication", "Hair distribution", "Bowel pattern"], "correct": ["Respiratory status", "Level of alertness", "Ongoing seizure activity", "Response to the medication"], "rationale": "After rescue benzodiazepine therapy, the nurse evaluates whether seizure activity stops while monitoring breathing and alertness because these medications can depress the central nervous system.", "id": 67}, {"topic": "Brain Death", "page": 40, "type": "mcq", "question": "The family of a client with catastrophic brain injury asks whether brain death is the same as coma. Which explanation reflects the lecture content?", "options": ["Brain death is irreversible loss of all brain function and is distinct from coma", "Brain death and coma are interchangeable terms", "Brain death describes temporary confusion after a seizure", "Brain death is diagnosed only by a low GCS score"], "correct": ["Brain death is irreversible loss of all brain function and is distinct from coma"], "rationale": "The lecture distinguishes brain death from coma and describes brain death as irreversible loss of all brain function established using defined criteria.", "id": 68}, {"topic": "ICP Medications", "page": 35, "type": "mcq", "question": "A client with cerebral edema has a rising ICP despite positioning and treatment of contributing factors. Which prescribed medication should the nurse recognize as hyperosmolar therapy intended to reduce cerebral edema?", "options": ["Mannitol", "Lorazepam", "Carbamazepine", "Levetiracetam"], "correct": ["Mannitol"], "rationale": "Mannitol is listed in the PowerPoint as pharmacologic therapy to reduce cerebral edema. The nursing focus is not simply giving the drug: neurologic status shows whether the client is improving, while blood pressure, intake/output, renal function, and osmolality help identify important physiologic effects of therapy.", "id": 69}, {"topic": "ICP Medications", "page": 35, "type": "mcq", "question": "A client receiving mannitol for cerebral edema has a urinary output of 1,250 mL over 3 hours and the blood pressure is trending downward. Which nursing concern best explains why these findings require follow-up?", "options": ["The therapy can produce substantial fluid shifts, so fluid balance and blood pressure must be monitored", "Mannitol is being used to stop an ongoing seizure", "The findings show that cerebral edema has definitely resolved", "Mannitol is a maintenance antiseizure medication"], "correct": ["The therapy can produce substantial fluid shifts, so fluid balance and blood pressure must be monitored"], "rationale": "The PowerPoint specifically directs the nurse to monitor blood pressure and intake/output during pharmacologic ICP management. A large urine output with falling blood pressure matters because excessive fluid loss can threaten circulating volume and cerebral perfusion even while therapy is intended to reduce cerebral edema.", "id": 70}, {"topic": "ICP Medications", "page": 35, "type": "mcq", "question": "A client receiving mannitol for increased ICP has worsening renal function. Which action by the nurse is most appropriate?", "options": ["Recognize the change as important because renal function is part of the prescribed monitoring for therapy", "Ignore the result because renal function is unrelated to ICP medications", "Give an additional dose without reviewing the change", "Stop neurologic assessments and monitor only urine color"], "correct": ["Recognize the change as important because renal function is part of the prescribed monitoring for therapy"], "rationale": "The PowerPoint includes renal function among the required monitoring parameters during pharmacologic management of increased ICP. A worsening renal trend therefore requires follow-up rather than being treated as unrelated to therapy.", "id": 71}, {"topic": "ICP Medications", "page": 35, "type": "mcq", "question": "A client with cerebral edema is prescribed hypertonic saline. Which finding should the nurse trend most closely as part of the medication-specific monitoring emphasized in the PowerPoint?", "options": ["Serum sodium and osmolality", "Hemoglobin A1c and bilirubin", "Amylase and lipase", "Platelet count and INR only"], "correct": ["Serum sodium and osmolality"], "rationale": "Hypertonic saline is listed as therapy to reduce cerebral edema. Because the therapy changes extracellular tonicity, the PowerPoint emphasizes sodium and osmolality monitoring along with neurologic status, blood pressure, fluid balance, and renal function.", "id": 72}, {"topic": "ICP Medications", "page": 35, "type": "mcq", "question": "A client receiving hypertonic saline for cerebral edema has a rising serum sodium level. Which interpretation by the nurse is most appropriate?", "options": ["The sodium trend is clinically relevant and should be evaluated with the prescribed osmolality and fluid-balance monitoring", "The sodium level is unrelated to this therapy", "The finding proves the client is having a seizure", "The finding means neurologic assessments are no longer needed"], "correct": ["The sodium trend is clinically relevant and should be evaluated with the prescribed osmolality and fluid-balance monitoring"], "rationale": "The PowerPoint specifically identifies sodium/osmolality as monitoring priorities during pharmacologic management of increased ICP. The nurse evaluates the laboratory trend together with fluid balance and neurologic response rather than assuming that any sodium change is automatically therapeutic or harmless.", "id": 73}, {"topic": "ICP Medications", "page": 35, "type": "mcq", "question": "A client with increased ICP is restless and severely agitated. The treatment plan includes analgesia and sedation. What is the intended purpose of this therapy according to the PowerPoint?", "options": ["Reduce pain and agitation", "Drain CSF from the ventricles", "Prevent all future seizures", "Replace neurologic assessment"], "correct": ["Reduce pain and agitation"], "rationale": "The PowerPoint lists analgesia/sedation to reduce pain and agitation. This supports ICP management because uncontrolled pain and agitation can add physiologic stress; medication does not replace continued neurologic and hemodynamic assessment.", "id": 74}, {"topic": "ICP Medications", "page": 35, "type": "mcq", "question": "A client has refractory increased ICP despite initial measures. The provider adds phenobarbital. Which explanation best matches the role of this medication in the PowerPoint?", "options": ["A barbiturate option for selected refractory ICP", "First-line maintenance treatment for every client with ICP elevation", "A hyperosmolar agent that directly removes water from cerebral tissue", "A medication used only to treat VP-shunt infection"], "correct": ["A barbiturate option for selected refractory ICP"], "rationale": "The PowerPoint lists barbiturates such as phenobarbital for selected refractory ICP. The word 'selected' is important: this is not presented as routine therapy for every client with increased ICP.", "id": 75}, {"topic": "ICP Medications", "page": 35, "type": "sata", "question": "A client is receiving pharmacologic therapy for increased ICP. Which parameters should the nurse monitor according to the PowerPoint? Select all that apply.", "options": ["Neurologic status", "Blood pressure", "Intake and output/fluid balance", "Renal function", "Sodium and osmolality as ordered", "Hair and nail growth"], "correct": ["Neurologic status", "Blood pressure", "Intake and output/fluid balance", "Renal function", "Sodium and osmolality as ordered"], "rationale": "The PowerPoint explicitly lists neurologic status, blood pressure, intake/output or fluid balance, renal function, and sodium/osmolality as ordered. Together these data help the nurse evaluate both neurologic response and physiologic effects of ICP-directed therapy.", "id": 76}, {"topic": "Seizure Medications", "page": 55, "type": "mcq", "question": "A client has been having continuous generalized seizure activity for 6 minutes. Which prescribed medication should the nurse recognize as a rescue medication intended to stop the ongoing seizure?", "options": ["Lorazepam", "Levetiracetam", "Carbamazepine", "Valproate"], "correct": ["Lorazepam"], "rationale": "The seizure has exceeded 5 minutes, so the scenario establishes status epilepticus rather than routine maintenance care. Lorazepam is one of the rescue medications listed in the PowerPoint to stop ongoing seizure activity; levetiracetam, carbamazepine, and valproate are listed as maintenance medications.", "id": 77}, {"topic": "Seizure Medications", "page": 55, "type": "mcq", "question": "A client has repeated seizures without regaining consciousness. The provider prescribes midazolam. Which medication role should the nurse recognize?", "options": ["Rescue therapy for ongoing seizure activity", "Long-term maintenance therapy only", "Hyperosmolar therapy for cerebral edema", "Treatment for VP-shunt obstruction"], "correct": ["Rescue therapy for ongoing seizure activity"], "rationale": "Repeated seizures without recovery meet the lecture definition of status epilepticus. Midazolam is listed with lorazepam and diazepam as rescue medication used to help stop an ongoing seizure.", "id": 78}, {"topic": "Seizure Medications", "page": 55, "type": "mcq", "question": "A client receives diazepam for an ongoing seizure. The seizure stops, but the client is very drowsy. Which assessment should the nurse prioritize next?", "options": ["Breathing and level of alertness", "Bowel pattern and abdominal girth", "Skin turgor and appetite only", "Visual acuity and hearing only"], "correct": ["Breathing and level of alertness"], "rationale": "The PowerPoint identifies breathing, alertness, and response as nursing priorities after rescue seizure medication. Once seizure activity stops, the nurse still has to determine whether airway and respiratory function remain adequate while the client's alertness is reduced.", "id": 79}, {"topic": "Seizure Medications", "page": 55, "type": "mcq", "question": "A client receives lorazepam for active seizure activity. Which finding best demonstrates the therapeutic response the nurse should evaluate?", "options": ["The ongoing seizure activity stops", "The client immediately becomes fully alert", "The client develops a fixed dilated pupil", "The serum sodium rises"], "correct": ["The ongoing seizure activity stops"], "rationale": "Rescue medications are given to help stop an ongoing seizure, so cessation of seizure activity is the direct therapeutic response. Alertness may remain reduced and must be monitored rather than expected to normalize immediately.", "id": 80}, {"topic": "Seizure Medications", "page": 55, "type": "mcq", "question": "A client with epilepsy takes levetiracetam every day and has no seizure activity at present. Which explanation best describes why the medication is continued?", "options": ["It is maintenance therapy intended to help prevent future seizures", "It is given only to stop a seizure that is already occurring", "It reduces cerebral edema through hyperosmolar action", "It is used to drain excess CSF"], "correct": ["It is maintenance therapy intended to help prevent future seizures"], "rationale": "The PowerPoint separates rescue from maintenance therapy. Levetiracetam is listed as a maintenance medication used to help prevent future seizures, so scheduled dosing remains important even when the client is not actively seizing.", "id": 81}, {"topic": "Seizure Medications", "page": 55, "type": "mcq", "question": "A client taking phenytoin for maintenance seizure control says, 'I have not had a seizure lately, so I sometimes skip my doses.' Which response by the nurse best addresses the medication priority in the PowerPoint?", "options": ["Take the medication consistently as prescribed to maintain seizure prevention", "Save the medication for use only when a seizure begins", "Double every dose after a seizure-free day", "Stop the medication whenever you feel well"], "correct": ["Take the medication consistently as prescribed to maintain seizure prevention"], "rationale": "Phenytoin is listed as maintenance therapy, and the PowerPoint emphasizes consistent dosing. Maintenance therapy is intended to prevent future seizures, so taking it only when symptoms appear defeats its preventive role.", "id": 82}, {"topic": "Seizure Medications", "page": 55, "type": "mcq", "question": "A client taking carbamazepine for seizure prevention reports a new possible medication-related symptom. Which nursing action best reflects the PowerPoint's maintenance-medication priorities?", "options": ["Assess the reported side effect and review prescribed monitoring rather than dismissing it", "Tell the client that maintenance medications do not cause side effects", "Instruct the client to use the drug only during an active seizure", "Replace the medication with a rescue benzodiazepine without a prescription"], "correct": ["Assess the reported side effect and review prescribed monitoring rather than dismissing it"], "rationale": "The PowerPoint does not provide a drug-specific adverse-effect list for carbamazepine, but it does explicitly require side-effect assessment and prescribed monitoring for maintenance medications. The nurse should therefore evaluate the symptom without inventing a specific adverse effect not supplied by the lecture.", "id": 83}, {"topic": "Seizure Medications", "page": 55, "type": "mcq", "question": "A client taking valproate for seizure prevention asks why laboratory or clinical follow-up may still be prescribed when the medication seems to be working. Which response best reflects the PowerPoint?", "options": ["Maintenance therapy requires consistent dosing, side-effect assessment, and prescribed monitoring", "Monitoring is necessary only while an active seizure is occurring", "Valproate is a rescue medication and should be stopped between seizures", "Follow-up is unnecessary once one dose prevents a seizure"], "correct": ["Maintenance therapy requires consistent dosing, side-effect assessment, and prescribed monitoring"], "rationale": "Valproate is listed as a maintenance antiseizure medication. The lecture specifically pairs maintenance therapy with consistent dosing, assessment for side effects, and whatever monitoring is prescribed.", "id": 84}, {"topic": "Seizure Medications", "page": 55, "type": "mcq", "question": "A client has an order for scheduled phenytoin and a separate PRN rescue medication for prolonged seizure activity. Which medication from the PowerPoint would fit the rescue role?", "options": ["Midazolam", "Phenytoin", "Carbamazepine", "Valproate"], "correct": ["Midazolam"], "rationale": "Midazolam is listed as rescue therapy for an ongoing seizure. Phenytoin, carbamazepine, and valproate are listed as maintenance medications that help prevent future seizures.", "id": 85}, {"topic": "Seizure Medications", "page": 55, "type": "mcq", "question": "A client is actively convulsing and has been seizing for more than 5 minutes. The medication record includes scheduled levetiracetam and a prescribed rescue dose of lorazepam. Which medication should the nurse associate with the immediate goal of stopping the current seizure?", "options": ["Lorazepam", "Scheduled levetiracetam", "Both medications have the same immediate rescue role", "Neither medication is related to seizure management"], "correct": ["Lorazepam"], "rationale": "The scenario requires rescue treatment because the seizure is ongoing beyond 5 minutes. Lorazepam is listed as a rescue medication. Levetiracetam is maintenance therapy intended to reduce future seizure occurrence rather than serving the same immediate role.", "id": 86}, {"topic": "Seizure Medications", "page": 55, "type": "sata", "question": "A nurse reviews medications for a client with a seizure disorder. Which medications are listed in the PowerPoint as rescue medications that help stop an ongoing seizure? Select all that apply.", "options": ["Lorazepam", "Diazepam", "Midazolam", "Levetiracetam", "Carbamazepine", "Valproate"], "correct": ["Lorazepam", "Diazepam", "Midazolam"], "rationale": "Lorazepam, diazepam, and midazolam are the rescue medications listed in the PowerPoint. Levetiracetam, carbamazepine, and valproate are listed as maintenance medications used to help prevent future seizures.", "id": 87}, {"topic": "Seizure Medications", "page": 55, "type": "sata", "question": "A nurse reviews scheduled medications used to help prevent future seizures. Which medications are listed in the PowerPoint as maintenance therapy? Select all that apply.", "options": ["Levetiracetam", "Phenytoin", "Carbamazepine", "Valproate", "Lorazepam", "Midazolam"], "correct": ["Levetiracetam", "Phenytoin", "Carbamazepine", "Valproate"], "rationale": "Levetiracetam, phenytoin, carbamazepine, and valproate are listed as maintenance antiseizure medications. Lorazepam and midazolam are listed in the rescue group for ongoing seizure activity.", "id": 88}, {"topic": "Seizure Medications", "page": 55, "type": "sata", "question": "A client receives a rescue benzodiazepine for an ongoing seizure. Which assessments reflect the nursing priorities stated in the PowerPoint? Select all that apply.", "options": ["Breathing", "Level of alertness", "Whether seizure activity responds", "Hair texture", "Bowel pattern", "Nail growth"], "correct": ["Breathing", "Level of alertness", "Whether seizure activity responds"], "rationale": "The PowerPoint identifies breathing, alertness, and response as the priorities after rescue medication. These assessments address both medication safety and whether the treatment is accomplishing its immediate purpose.", "id": 89}, {"topic": "Seizure Medications", "page": 55, "type": "sata", "question": "The nurse is teaching a client about a prescribed maintenance antiseizure medication. Which points are supported by the PowerPoint? Select all that apply.", "options": ["Take doses consistently", "Report and discuss possible side effects", "Complete prescribed monitoring", "Use the medication only when a seizure begins", "Assume monitoring is unnecessary when seizure-free", "Treat it as the same type of therapy as a rescue benzodiazepine"], "correct": ["Take doses consistently", "Report and discuss possible side effects", "Complete prescribed monitoring"], "rationale": "The PowerPoint's maintenance-medication priorities are consistent dosing, side-effect assessment, and prescribed monitoring. Maintenance therapy helps prevent future seizures and is not used in the same way as rescue medication for an ongoing event.", "id": 90}];let state={},missed=false,order=DATA.map(q=>q.id);const quiz=document.getElementById('quiz'),topic=document.getElementById('topic'),type=document.getElementById('type'),search=document.getElementById('search'),sum=document.getElementById('sum');[...new Set(DATA.map(q=>q.topic))].sort().forEach(t=>{let o=document.createElement('option');o.value=t;o.textContent=t;topic.appendChild(o)});
