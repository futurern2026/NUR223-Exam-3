<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spot the Nursing Error</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f2f7;color:#25212a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}header{background:#43245f;color:#fff;padding:18px;position:sticky;top:0;z-index:5}.wrap,main{max-width:900px;margin:auto}h1{margin:0 0 5px}.sub{opacity:.9;font-size:13px}main{padding:14px}.card,.panel{background:#fff;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 3px 14px #0001}button{border:1px solid #d3ccd8;background:#fff;border-radius:9px;padding:11px;margin:5px;font-size:15px}button:hover{background:#f1eaf5}.primary{background:#43245f;color:#fff}.correct{background:#e5f4e8!important;border-color:#559164!important}.wrong{background:#fde8e8!important;border-color:#b95a5a!important}.feedback{margin-top:12px;padding:12px;border-radius:9px;background:#f3eef6;line-height:1.5}.hidden{display:none}.score{font-weight:750}.choice{display:block;width:100%;text-align:left}.big{font-size:22px;font-weight:750;line-height:1.4}.tag{font-size:12px;font-weight:800;text-transform:uppercase;color:#76518d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.drop{min-height:120px;border:2px dashed #c9bfd0;border-radius:12px;padding:10px}.item{background:#fff;border:1px solid #d8d0dd;border-radius:9px;padding:10px;margin:7px 0;cursor:pointer}.selected{outline:3px solid #8b68a0}.order{padding:10px;border:1px solid #ddd;border-radius:9px;margin:7px 0;background:#fff}.small{font-size:12px;color:#666}a{color:#43245f}</style><style id="study-site-nav-css">.study-site-nav{position:fixed;right:14px;bottom:14px;z-index:99999;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.study-site-nav a{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;text-decoration:none;background:#172033;color:#fff!important;border:1px solid #ffffff38;border-radius:999px;padding:9px 12px;font-size:13px;font-weight:800;box-shadow:0 4px 14px #0003}.study-site-nav a:first-child{background:#3448c5}@media(max-width:520px){.study-site-nav{left:10px;right:10px;bottom:10px}.study-site-nav a{flex:1;text-align:center}}</style></head><body><header><div class="wrap"><h1>Spot the Nursing Error</h1><div class="sub">Find the unsafe or inappropriate action</div></div></header><main><div class="panel score" id="score"></div><div id="game"></div><button class="primary" onclick="next()">Next</button></main><script>const Q=[{"topic": "Seizure", "q": "During a tonic-clonic seizure, a nurse places an object in the client's mouth. Spot the error.", "o": ["Nothing should be placed in the mouth", "The object should be larger", "The client should instead be restrained", "There is no error"], "a": 0, "r": "Objects in the mouth can cause injury and do not protect the client."}, {"topic": "Seizure", "q": "A nurse holds the client's arms and legs down during active convulsions. Spot the error.", "o": ["Do not restrain seizure movements", "Restraints are required", "Only restrain the legs", "There is no error"], "a": 0, "r": "Restraints can cause injury. Protect the client from environmental injury instead."}, {"topic": "ICP", "q": "A client with increased ICP is positioned with the neck sharply flexed. Spot the error.", "o": ["Excessive neck flexion can impair venous drainage", "The neck should be flexed further", "HOB must always be flat", "There is no error"], "a": 0, "r": "Keep head/neck neutral and avoid excessive flexion."}, {"topic": "TBI", "q": "A head-injury client with possible cervical injury has the neck rotated for range-of-motion testing. Spot the error.", "o": ["Maintain cervical stabilization until injury is ruled out", "Rotation is required immediately", "Only flexion is unsafe", "There is no error"], "a": 0, "r": "Unnecessary movement can worsen an unrecognized cervical-spine injury."}, {"topic": "Postictal", "q": "Immediately after a seizure, a drowsy client with secretions is given oral water. Spot the error.", "o": ["Oral intake is unsafe while alertness/airway protection are impaired", "The water should be colder", "The client should stand while drinking", "There is no error"], "a": 0, "r": "Postictal care prioritizes airway protection, side positioning, and secretion management."}, {"topic": "ICP", "q": "A client with rising ICP is repeatedly stimulated for nonessential tasks despite agitation. Spot the error.", "o": ["Reduce unnecessary stimulation", "Increase stimulation further", "Agitation always lowers ICP", "There is no error"], "a": 0, "r": "The PowerPoint recommends reducing unnecessary stimulation and controlling agitation."}];let i=0,s=0,a=0;const g=document.getElementById('game'),sc=document.getElementById('score');
function render(){let q=Q[i];g.innerHTML=`<div class="card"><div class="tag">${q.topic}</div><div class="big">${q.q}</div><div id="opts">${q.o.map((x,j)=>`<button class="choice" data-i="${j}">${x}</button>`).join('')}</div><div id="fb"></div></div>`;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>ans(b,+b.dataset.i,q));upd()}
function ans(b,j,q){if(document.querySelector('#fb').innerHTML)return;a++;document.querySelectorAll('.choice').forEach((x,k)=>{x.disabled=true;if(k===q.a)x.classList.add('correct')});if(j===q.a){s++;b.classList.add('correct')}else b.classList.add('wrong');document.querySelector('#fb').innerHTML=`<div class="feedback"><b>${j===q.a?'Correct':'Review'}</b><br>${q.r}</div>`;upd()}
function upd(){sc.textContent=`Score: ${s}/${a} · Item ${i+1}/${Q.length}`}function next(){i=(i+1)%Q.length;render()}render();</script><nav class="study-site-nav" aria-label="Study site navigation"><a href="index.html">← Day1 Home</a><a href="../index.html">Exam 3 Main</a></nav></body></html>
