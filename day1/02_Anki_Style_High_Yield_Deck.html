<style>*{box-sizing:border-box}body{margin:0;background:#f4f1f7;color:#211d27;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}header{background:#40205b;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:10}.wrap,main{max-width:850px;margin:auto}h1{font-size:22px;margin:0 0 4px}.sub{opacity:.9;font-size:13px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}select,button{border:0;border-radius:9px;padding:10px 12px;font-size:14px}main{margin:18px auto;padding:0 14px}.stats{background:#fff;border-radius:12px;padding:12px 15px;margin-bottom:14px}.card{min-height:370px;background:#fff;border-radius:18px;padding:26px;box-shadow:0 5px 24px #0002;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer}.topic{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#76518d;margin-bottom:18px}.front{font-size:27px;font-weight:750;line-height:1.3}.hint{font-size:13px;color:#777;margin-top:18px}.answer{display:none;margin-top:22px;border-top:1px solid #ddd;padding-top:20px}.answer.show{display:block}.back{font-size:23px;font-weight:700;line-height:1.35}.pearl{margin-top:16px;padding:13px;background:#f5f0f8;border-radius:10px;text-align:left;line-height:1.45}.source{margin-top:12px;font-size:12px;color:#777}.rate{display:none;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}.rate.show{display:flex}.rate button{min-width:95px;color:#fff;font-weight:700}.again{background:#9d3f3f}.hard{background:#9a6b22}.good{background:#487a50}.easy{background:#4a638e}.nav{display:flex;gap:8px;justify-content:center;margin-top:14px}.nav button{background:#40205b;color:#fff}.small{font-size:12px;color:#666;text-align:center;margin-top:10px}</style><style id="study-site-nav-css">.study-site-nav{position:fixed;right:14px;bottom:14px;z-index:99999;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.study-site-nav a{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-se <header><div class="wrap"><h1>NUR 223 Exam 3 — Anki-Style High-Yield Deck</h1><div class="sub">PowerPoint focused • eBook/ATI reinforced • active recall</div><div class="controls"><select id="topic"><option value="All">All topics</option></select><button onclick="shuffleDeck()">Shuffle</button><button onclick="studyMissed()">Study Again/Hard</button><button onclick="resetDeck()">Reset</button></div></div></header>
<main><div class="stats" id="stats"></div><div class="card" id="card" onclick="flip()"></div><div class="rate" id="rate"><button class="again" onclick="event.stopPropagation();rateCard('again')">Again</button><button class="hard" onclick="event.stopPropagation();rateCard('hard')">Hard</button><button class="good" onclick="event.stopPropagation();rateCard('good')">Good</button><button class="easy" onclick="event.stopPropagation();rateCard('easy')">Easy</button></div><div class="nav"><button onclick="prev()">← Previous</button><button onclick="next()">Next →</button></div><div class="small">Think first, then tap the card to reveal. Rating automatically advances.</div></main>
<script>const ALL=[{"id": 1, "topic": "Neuro Foundations", "front": "Frontal lobe: key functions?", "back": "Judgment, behavior, speech, voluntary movement.", "pearl": "Think personality + motor + speech.", "source": "PowerPoint pp. 4–8"}, {"id": 2, "topic": "Neuro Foundations", "front": "Parietal lobe: key functions?", "back": "Sensory interpretation and spatial awareness.", "pearl": "Think sensation + space.", "source": "PowerPoint pp. 4–8"}, {"id": 3, "topic": "Neuro Foundations", "front": "Temporal lobe: key functions?", "back": "Hearing, memory, language comprehension.", "pearl": "Think hearing + memory + understanding language.", "source": "PowerPoint pp. 4–8"}, {"id": 4, "topic": "Neuro Foundations", "front": "Occipital lobe: key function?", "back": "Vision.", "pearl": "New visual change can help localize dysfunction.", "source": "PowerPoint pp. 4–8"}, {"id": 5, "topic": "Neuro Foundations", "front": "Cerebellum: key functions?", "back": "Balance and coordination.", "pearl": "Gait/coordination problems point here.", "source": "PowerPoint pp. 4–8"}, {"id": 6, "topic": "Neuro Foundations", "front": "Brainstem: key functions?", "back": "Respirations, heart rate, swallowing, consciousness.", "pearl": "Brainstem dysfunction can threaten life-sustaining functions.", "source": "PowerPoint pp. 4–8"}, {"id": 7, "topic": "Neuro Foundations", "front": "Focused neuro trend: what should be compared with baseline?", "back": "GCS/LOC, pupils, motor strength, sensation, gait/balance, speech.", "pearl": "Trend is often more important than one isolated value.", "source": "PowerPoint pp. 4–8"}, {"id": 8, "topic": "Neuro Foundations", "front": "Most time-sensitive history point in an acute neurologic change?", "back": "Onset and last known well.", "pearl": "Timing can change diagnostic and treatment decisions.", "source": "PowerPoint pp. 4–8"}, {"id": 9, "topic": "Hydrocephalus", "front": "Classic infant findings of hydrocephalus?", "back": "Increasing head circumference, bulging/tense fontanel, prominent scalp veins, poor feeding/irritability, difficulty holding the head up, sunset eyes.", "pearl": "Recognize the cluster.", "source": "PowerPoint pp. 10–12"}, {"id": 10, "topic": "Hydrocephalus", "front": "Worsening infant hydrocephalus: concerning findings?", "back": "Vomiting, lethargy/decreased LOC, high-pitched cry, apnea.", "pearl": "Decreased LOC/apnea = more serious deterioration.", "source": "PowerPoint pp. 10–12"}, {"id": 11, "topic": "Hydrocephalus", "front": "What does a VP shunt do?", "back": "Diverts CSF to the peritoneal cavity.", "pearl": "Goal: relieve excess CSF accumulation.", "source": "PowerPoint pp. 10–12"}, {"id": 12, "topic": "Hydrocephalus", "front": "VP shunt obstruction: key cues?", "back": "Return of hydrocephalus symptoms, vomiting, headache, neurologic decline.", "pearl": "Obstruction = CSF diversion is failing.", "source": "PowerPoint pp. 10–12"}, {"id": 13, "topic": "Hydrocephalus", "front": "VP shunt infection: key cues?", "back": "Fever, redness/tenderness, neurologic change.", "pearl": "Separate infection cues from obstruction cues.", "source": "PowerPoint pp. 10–12"}, {"id": 14, "topic": "TBI", "front": "Primary vs secondary TBI?", "back": "Primary occurs at impact; secondary develops afterward.", "pearl": "Primary: fracture/contusion/concussion/hemorrhage. Secondary: hypoxia/ischemia/edema/increased ICP.", "source": "PowerPoint pp. 14–17 + ATI Ch. 15"}, {"id": 15, "topic": "TBI", "front": "Main nursing goal after the initial TBI?", "back": "Prevent secondary brain injury.", "pearl": "Protect oxygenation/perfusion and catch deterioration early.", "source": "PowerPoint pp. 14–17 + ATI Ch. 15"}, {"id": 16, "topic": "TBI", "front": "Common concussion/mild TBI manifestations?", "back": "Headache, dizziness, nausea, confusion/foggy feeling, memory/concentration problems, light/noise sensitivity, balance problems.", "pearl": "Expected symptoms still require reassessment if they worsen.", "source": "PowerPoint pp. 14–17 + ATI Ch. 15"}, {"id": 17, "topic": "TBI", "front": "TBI danger signs?", "back": "Worsening headache, repeated vomiting, increasing confusion/drowsiness, unequal pupils, new weakness/numbness, slurred speech, seizure.", "pearl": "A worsening pattern is the red flag.", "source": "PowerPoint pp. 14–17 + ATI Ch. 15"}, {"id": 18, "topic": "TBI", "front": "Head injury: ABC priority assessment?", "back": "Respiratory status.", "pearl": "The brain has little oxygen reserve; hypoxia worsens injury.", "source": "PowerPoint pp. 14–17 + ATI Ch. 15"}, {"id": 19, "topic": "TBI", "front": "Early indicator of neurologic deterioration after head injury?", "back": "Change in LOC/GCS.", "pearl": "Trend the GCS, not just the initial number.", "source": "PowerPoint pp. 14–17 + ATI Ch. 15"}, {"id": 20, "topic": "TBI", "front": "ATI GCS severity ranges?", "back": "13–15 mild; 9–12 moderate; less than 8 severe.", "pearl": "A falling GCS matters even before reaching the severe category.", "source": "PowerPoint pp. 14–17 + ATI Ch. 15"}, {"id": 21, "topic": "TBI", "front": "Why maintain C-spine precautions after significant head trauma?", "back": "Cervical injury can coexist and movement can worsen spinal cord injury.", "pearl": "Stabilize until cervical injury is ruled out.", "source": "PowerPoint pp. 14–17 + ATI Ch. 15"}, {"id": 22, "topic": "Brain Tumors", "front": "Primary vs secondary brain tumor?", "back": "Primary originates in the CNS; secondary is metastatic.", "pearl": "Do not confuse secondary tumor with secondary TBI injury.", "source": "PowerPoint pp. 18–22"}, {"id": 23, "topic": "Brain Tumors", "front": "Brain tumor manifestations?", "back": "Headache, N/V, decreased LOC, focal weakness, sensory/speech/visual changes, balance problems, seizures, personality/cognitive changes.", "pearl": "Location drives manifestations.", "source": "PowerPoint pp. 18–22"}, {"id": 24, "topic": "Brain Tumors", "front": "Key brain-tumor diagnostics?", "back": "CT, MRI, biopsy/pathology when indicated.", "pearl": "Imaging characterizes; pathology identifies tissue type.", "source": "PowerPoint pp. 18–22"}, {"id": 25, "topic": "Brain Tumors", "front": "Major treatment categories for brain tumors?", "back": "Surgery, radiation, systemic therapy, rehab, palliative/supportive care.", "pearl": "Treatment depends on location, type, neurologic effects.", "source": "PowerPoint pp. 18–22"}, {"id": 26, "topic": "Brain Tumors", "front": "Core nursing priorities with brain tumors?", "back": "Neuro assessment, safety, symptom management, postop care, emotional support.", "pearl": "Watch focal deficits and increased-ICP-type symptoms.", "source": "PowerPoint pp. 18–22"}, {"id": 27, "topic": "Increased ICP", "front": "Monro-Kellie doctrine?", "back": "If brain, blood, or CSF volume increases, another component must decrease or ICP rises.", "pearl": "When compensation fails, perfusion falls and herniation can occur.", "source": "PowerPoint pp. 23–41 + overlapping ATI/Engage"}, {"id": 28, "topic": "Increased ICP", "front": "Three intracranial components?", "back": "Brain tissue, blood, CSF.", "pearl": "Fixed skull, three major contents.", "source": "PowerPoint pp. 23–41 + overlapping ATI/Engage"}, {"id": 29, "topic": "Increased ICP", "front": "What increases brain volume?", "back": "Cerebral edema or tumor.", "pearl": "Consumes compensatory reserve.", "source": "PowerPoint pp. 23–41 + overlapping ATI/Engage"}, {"id": 30, "topic": "Increased ICP", "front": "What increases intracranial blood volume?", "back": "Hemorrhage, increased cerebral blood volume, impaired venous drainage.", "pearl": "Poor venous drainage can worsen ICP.", "source": "PowerPoint pp. 23–41 + overlapping ATI/Engage"}, {"id": 31, "topic": "Increased ICP", "front": "What increases CSF volume?", "back": "Hydrocephalus or obstructed CSF flow.", "pearl": "CSF accumulation raises pressure when compensation fails.", "source": "PowerPoint pp. 23–41 + overlapping ATI/Engage"}, {"id": 32, "topic": "Increased ICP", "front": "MAP formula?", "back": "MAP = (SBP + 2 × DBP) ÷ 3.", "pearl": "Diastole is weighted twice.", "source": "PowerPoint pp. 23–41 + overlapping ATI/Engage"}, {"id": 33, "topic": "Increased ICP", "front": "CPP formula?", "back": "CPP = MAP − ICP.", "pearl": "CPP falls if MAP drops or ICP rises.", "source": "PowerPoint pp. 23–41 + overlapping ATI/Engage"}, {"id": 34, "topic": "Increased ICP", "front": "Early/worsening increased ICP findings?", "back": "LOC change, restlessness/confusion, headache, N/V, visual/pupillary changes.", "pearl": "Do not wait for late signs.", "source": "PowerPoint pp. 23–41 + overlapping ATI/Engage"}, {"id": 35, "topic": "Increased ICP", "front": "Late/ominous increased ICP findings?", "back": "Marked ↓LOC, fixed/dilated pupils, posturing, respiratory changes, coma, Cushing's triad.", "pearl": "These indicate severe progression.", "source": "PowerPoint pp. 23–41 + overlapping ATI/Engage"}, {"id": 36, "topic": "Increased ICP", "front": "Cushing's triad?", "back": "Increased systolic BP/widening pulse pressure + bradycardia + irregular respirations.", "pearl": "Late, ominous increased-ICP pattern.", "source": "PowerPoint pp. 23–41 + overlapping ATI/Engage"}, {"id": 37, "topic": "Increased ICP", "front": "Herniation warning pattern?", "back": "Rapid LOC decline, pupil changes, posturing, respiratory deterioration.", "pearl": "Severe neurologic deterioration.", "source": "PowerPoint pp. 23–41 + overlapping ATI/Engage"}, {"id": 38, "topic": "Increased ICP", "front": "Serial neuro checks should include?", "back": "GCS/LOC, pupils, motor response, vital signs.", "pearl": "Trend changes over time.", "source": "PowerPoint pp. 23–41 + overlapping ATI/Engage"}, {"id": 39, "topic": "Increased ICP", "front": "EVD: what can it do?", "back": "Measure ICP AND drain CSF.", "pearl": "Monitoring + therapeutic drainage.", "source": "PowerPoint pp. 23–41 + overlapping ATI/Engage"}, {"id": 40, "topic": "Increased ICP", "front": "Intraparenchymal monitor: what can it do?", "back": "Measure ICP but cannot drain CSF.", "pearl": "Key difference from EVD.", "source": "PowerPoint pp. 23–41 + overlapping ATI/Engage"}, {"id": 41, "topic": "Increased ICP", "front": "Main management goals for increased ICP?", "back": "Treat cause, maintain oxygenation/perfusion, hyperosmolar therapy, CSF drainage, sedation/analgesia, selected decompressive surgery.", "pearl": "Protect perfusion and limit further injury.", "source": "PowerPoint pp. 23–41 + overlapping ATI/Engage"}, {"id": 42, "topic": "Increased ICP", "front": "Mannitol: purpose?", "back": "Reduce cerebral edema.", "pearl": "Monitor neuro status, BP, I&O, renal function, osmolality.", "source": "PowerPoint pp. 23–41 + overlapping ATI/Engage"}, {"id": 43, "topic": "Increased ICP", "front": "Hypertonic saline: purpose?", "back": "Reduce cerebral edema.", "pearl": "Trend sodium/osmolality, fluid balance, renal function, BP, neuro response.", "source": "PowerPoint pp. 23–41 + overlapping ATI/Engage"}, {"id": 44, "topic": "Increased ICP", "front": "Analgesia/sedation in ICP: purpose?", "back": "Reduce pain and agitation.", "pearl": "Limits avoidable physiologic stress.", "source": "PowerPoint pp. 23–41 + overlapping ATI/Engage"}, {"id": 45, "topic": "Increased ICP", "front": "Phenobarbital/barbiturates in ICP?", "back": "Selected refractory ICP.", "pearl": "Not routine first-line therapy for every client.", "source": "PowerPoint pp. 23–41 + overlapping ATI/Engage"}, {"id": 46, "topic": "Increased ICP", "front": "Positioning for increased ICP?", "back": "HOB elevated as ordered; head/neck neutral; avoid excessive flexion/rotation.", "pearl": "Supports cerebral venous drainage.", "source": "PowerPoint pp. 23–41 + overlapping ATI/Engage"}, {"id": 47, "topic": "Increased ICP", "front": "Why prevent hypoxia and hypotension?", "back": "They reduce oxygen delivery/cerebral perfusion and worsen secondary injury.", "pearl": "Protect the brain from a second hit.", "source": "PowerPoint pp. 23–41 + overlapping ATI/Engage"}, {"id": 48, "topic": "Increased ICP", "front": "Why treat fever?", "back": "Fever increases metabolic demand and physiologic stress.", "pearl": "Reduce avoidable brain demand.", "source": "PowerPoint pp. 23–41 + overlapping ATI/Engage"}, {"id": 49, "topic": "Increased ICP", "front": "Cerebral-edema safety setup?", "back": "Suction available, seizure precautions, HOB elevated, neck aligned, minimal stimulation.", "pearl": "Airway/safety preparation matters.", "source": "PowerPoint pp. 23–41 + overlapping ATI/Engage"}, {"id": 50, "topic": "Seizures", "front": "What is a seizure?", "back": "Abnormal, excessive electrical activity in the brain.", "pearl": "Manifestations depend on involved brain areas.", "source": "PowerPoint pp. 42–60 + ATI Ch. 7"}, {"id": 51, "topic": "Seizures", "front": "Three broad seizure categories?", "back": "Generalized, focal, unknown.", "pearl": "Start broad, then identify pattern.", "source": "PowerPoint pp. 42–60 + ATI Ch. 7"}, {"id": 52, "topic": "Seizures", "front": "Generalized seizure types emphasized?", "back": "Tonic-clonic, atonic, myoclonic, absence.", "pearl": "Know distinguishing patterns.", "source": "PowerPoint pp. 42–60 + ATI Ch. 7"}, {"id": 53, "topic": "Seizures", "front": "Myoclonic hallmark?", "back": "Brief muscle contractions/jerks.", "pearl": "Sudden + brief jerking.", "source": "PowerPoint pp. 42–60 + ATI Ch. 7"}, {"id": 54, "topic": "Seizures", "front": "Atonic hallmark?", "back": "Sudden loss of muscle tone.", "pearl": "Major fall/injury risk.", "source": "PowerPoint pp. 42–60 + ATI Ch. 7"}, {"id": 55, "topic": "Seizures", "front": "Absence hallmark?", "back": "Brief interruption of awareness.", "pearl": "Can be subtle.", "source": "PowerPoint pp. 42–60 + ATI Ch. 7"}, {"id": 56, "topic": "Seizures", "front": "Four seizure phases?", "back": "Prodromal → early ictal/aura → ictal → postictal.", "pearl": "Aura is early ictal.", "source": "PowerPoint pp. 42–60 + ATI Ch. 7"}, {"id": 57, "topic": "Seizures", "front": "Why can convulsions threaten oxygenation?", "back": "O2/energy demand rises while breathing can be irregular/impaired and airway protection is reduced.", "pearl": "Airway and breathing remain priorities.", "source": "PowerPoint pp. 42–60 + ATI Ch. 7"}, {"id": 58, "topic": "Seizures", "front": "Status epilepticus definition?", "back": "Seizure ≥5 min OR repeated seizures without recovery.", "pearl": "Neurologic emergency.", "source": "PowerPoint pp. 42–60 + ATI Ch. 7"}, {"id": 59, "topic": "Seizures", "front": "During seizure: DO?", "back": "Protect from injury, support airway, side-position when possible, loosen clothing, prepare suction, observe/document.", "pearl": "If standing, ease to floor and protect head.", "source": "PowerPoint pp. 42–60 + ATI Ch. 7"}, {"id": 60, "topic": "Seizures", "front": "During seizure: DO NOT?", "back": "Do not restrain; do not put anything in the mouth.", "pearl": "These can cause injury and do not stop the seizure.", "source": "PowerPoint pp. 42–60 + ATI Ch. 7"}, {"id": 61, "topic": "Seizures", "front": "What should be documented during a seizure?", "back": "Onset, duration, observed findings/behaviors.", "pearl": "Objective description helps characterize the event.", "source": "PowerPoint pp. 42–60 + ATI Ch. 7"}, {"id": 62, "topic": "Seizures", "front": "Postictal priorities?", "back": "Side-lying, secretion management, vitals, injury assessment, neuro checks, rest, reorientation.", "pearl": "Airway protection continues after seizure ends.", "source": "PowerPoint pp. 42–60 + ATI Ch. 7"}, {"id": 63, "topic": "Seizures", "front": "What does EEG evaluate?", "back": "Electrical activity of the brain.", "pearl": "CT/MRI evaluate structure.", "source": "PowerPoint pp. 42–60 + ATI Ch. 7"}, {"id": 64, "topic": "Seizures", "front": "Seizure workup categories?", "back": "CT/MRI; CBC/metabolic/liver/ammonia/toxicology/drug levels; EEG; LP/CSF; PET.", "pearl": "Looks for structural, metabolic, infectious, toxic, electrical causes.", "source": "PowerPoint pp. 42–60 + ATI Ch. 7"}, {"id": 65, "topic": "Seizures", "front": "Rescue seizure meds in the PowerPoint?", "back": "Lorazepam, diazepam, midazolam.", "pearl": "Help stop an ongoing seizure.", "source": "PowerPoint pp. 42–60 + ATI Ch. 7"}, {"id": 66, "topic": "Seizures", "front": "After rescue benzodiazepine: monitor?", "back": "Breathing, alertness, response.", "pearl": "Stopping the seizure is not the end of assessment.", "source": "PowerPoint pp. 42–60 + ATI Ch. 7"}, {"id": 67, "topic": "Seizures", "front": "Maintenance seizure meds in the PowerPoint?", "back": "Levetiracetam, phenytoin, carbamazepine, valproate.", "pearl": "Help prevent future seizures.", "source": "PowerPoint pp. 42–60 + ATI Ch. 7"}, {"id": 68, "topic": "Seizures", "front": "Maintenance medication priorities?", "back": "Consistent dosing, side-effect assessment, prescribed monitoring.", "pearl": "Preventive therapy, not saved for an active seizure.", "source": "PowerPoint pp. 42–60 + ATI Ch. 7"}, {"id": 69, "topic": "Seizures", "front": "Phenytoin teaching reinforced by ATI?", "back": "Take consistently at the same time each day.", "pearl": "Helps maintain therapeutic levels.", "source": "PowerPoint pp. 42–60 + ATI Ch. 7"}, {"id": 70, "topic": "Seizures", "front": "Vagal nerve stimulator purpose?", "back": "Intermittent vagal stimulation to help reduce seizures.", "pearl": "Adjunct for seizure reduction.", "source": "PowerPoint pp. 42–60 + ATI Ch. 7"}, {"id": 71, "topic": "TBI", "front": "GCS falls 14 → 11 after TBI. Meaning?", "back": "Neurologic deterioration until proven otherwise.", "pearl": "A falling trend is clinically significant.", "source": "PowerPoint + overlapping assigned reading"}, {"id": 72, "topic": "TBI", "front": "New unequal pupil + increasing drowsiness after TBI. Interpretation?", "back": "Worsening neurologic status requiring prompt escalation.", "pearl": "Pupil change + declining LOC are priority findings.", "source": "PowerPoint + overlapping assigned reading"}, {"id": 73, "topic": "Increased ICP", "front": "Bradycardia + widening pulse pressure + irregular respirations. Pattern?", "back": "Cushing's triad.", "pearl": "Late/ominous severe ICP pattern.", "source": "PowerPoint + overlapping assigned reading"}, {"id": 74, "topic": "Increased ICP", "front": "MAP 82, ICP 18. CPP?", "back": "64 mm Hg.", "pearl": "CPP = 82 − 18.", "source": "PowerPoint + overlapping assigned reading"}, {"id": 75, "topic": "Increased ICP", "front": "BP 120/60. MAP?", "back": "80 mm Hg.", "pearl": "(120 + 2×60) ÷ 3.", "source": "PowerPoint + overlapping assigned reading"}, {"id": 76, "topic": "Seizures", "front": "Tonic-clonic seizure begins while standing. First safety action?", "back": "Ease to floor and protect the head.", "pearl": "Do not restrain or put anything in the mouth.", "source": "PowerPoint + overlapping assigned reading"}, {"id": 77, "topic": "Seizures", "front": "Seizure has lasted 5 minutes. Recognize what?", "back": "Status epilepticus.", "pearl": "Neurologic emergency.", "source": "PowerPoint + overlapping assigned reading"}, {"id": 78, "topic": "Seizures", "front": "Seizure ended; client sleepy with oral secretions. Position?", "back": "Side-lying.", "pearl": "Promotes drainage and airway protection.", "source": "PowerPoint + overlapping assigned reading"}, {"id": 79, "topic": "Seizures", "front": "Lorazepam stopped seizure. What next?", "back": "Assess breathing, alertness, and response.", "pearl": "Rescue-medication monitoring continues.", "source": "PowerPoint + overlapping assigned reading"}, {"id": 80, "topic": "Hydrocephalus", "front": "VP shunt + vomiting, headache, neurologic decline. Concern?", "back": "Shunt obstruction.", "pearl": "Return of hydrocephalus manifestations.", "source": "PowerPoint + overlapping assigned reading"}, {"id": 81, "topic": "Hydrocephalus", "front": "VP shunt + fever and redness/tenderness. Concern?", "back": "Shunt infection.", "pearl": "Infection pattern.", "source": "PowerPoint + overlapping assigned reading"}, {"id": 82, "topic": "Increased ICP", "front": "Needs ICP measurement + CSF drainage. Device?", "back": "External ventricular drain (EVD).", "pearl": "Intraparenchymal monitor cannot drain CSF.", "source": "PowerPoint + overlapping assigned reading"}];let ratings={},filter='All',deck=[...ALL],idx=0,revealed=false,missedMode=false;const topic=document.getElementById('topic'),card=document.getElementById('card'),stats=document.getElementById('stats'),rate=document.getElementById('rate');[...new Set(ALL.map(c=>c.topic))].sort().forEach(t=>{let o=document.createElement('option');o.value=t;o.textContent=t;topic.appendChild(o)});topic.onchange=()=>{filter=topic.value;missedMode=false;build()};function build(){deck=ALL.filter(c=>(filter==='All'||c.topic===filter)&&(!missedMode||['again','hard'].includes(ratings[c.id])));idx=0;revealed=false;render()}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){if(!deck.length){card.innerHTML='<div class="front">No cards in this review set yet.</div>';rate.classList.remove('show');update();return}let c=deck[idx];card.innerHTML=`<div class="topic">${esc(c.topic)}</div><div class="front">${esc(c.front)}</div><div class="hint">${revealed?'':'Think of the answer before tapping.'}</div><div class="answer ${revealed?'show':''}"><div class="back">${esc(c.back)}</div>${c.pearl?`<div class="pearl"><b>Clinical pearl:</b> ${esc(c.pearl)}</div>`:''}<div class="source">${esc(c.source)}</div></div>`;rate.classList.toggle('show',revealed);update()}function update(){let done=Object.keys(ratings).length,hard=Object.values(ratings).filter(x=>x==='again'||x==='hard').length;stats.innerHTML=`<b>${deck.length} cards in this deck</b> · Card ${deck.length?idx+1:0}/${deck.length} · Rated ${done}/${ALL.length} · Again/Hard ${hard}`}function flip(){if(!deck.length)return;revealed=!revealed;render()}function next(){if(!deck.length)return;idx=(idx+1)%deck.length;revealed=false;render()}function prev(){if(!deck.length)return;idx=(idx-1+deck.length)%deck.length;revealed=false;render()}function rateCard(r){if(!deck.length)return;ratings[deck[idx].id]=r;next()}function shuffleDeck(){for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}idx=0;revealed=false;render()}function studyMissed(){missedMode=true;build()}function resetDeck(){ratings={};missedMode=false;filter='All';topic.value='All';build()}build();</script><nav class="study-site-nav" aria-label="Study site navigation"><a href="index.html">← Day1 Home</a><a href="../index.html">Exam 3 Main</a></nav><style id="nur223-autosave-style">
