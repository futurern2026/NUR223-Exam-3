us:999px;padding:9px 12px;font-size:13px;font-weight:800;box-shadow:0 4px 14px #0003}.study-site-nav a:first-child{background:#3448c5}@media(max-width:520px){.study-site-nav{left:10px;right:10px;bottom:10px}.study-site-nav a{flex:1;text-align:center}}</style></head><body><header><div class="wrap"><h1>Medication Match-Up & Rescue</h1><div class="sub">Purpose, rescue vs maintenance, and monitoring</div></div></header><main><div class="panel score" id="score"></div><div id="game"></div><button class="primary" onclick="next()">Next</button></main><script>const Q=[{"topic": "Seizure rescue", "q": "Which medication belongs to the rescue group for an ongoing seizure?", "o": ["Lorazepam", "Levetiracetam", "Carbamazepine", "Valproate"], "a": 0, "r": "Lorazepam, diazepam, and midazolam are the PowerPoint rescue medications."}, {"topic": "Seizure rescue", "q": "After diazepam stops an ongoing seizure, what is the priority monitoring focus?", "o": ["Breathing and alertness", "Hair growth", "Bowel pattern only", "Visual acuity only"], "a": 0, "r": "The PowerPoint emphasizes breathing, alertness, and response after rescue medication."}, {"topic": "Seizure maintenance", "q": "Which medication is listed as maintenance therapy?", "o": ["Levetiracetam", "Midazolam", "Lorazepam", "Diazepam"], "a": 0, "r": "Levetiracetam, phenytoin, carbamazepine, and valproate are maintenance medications."}, {"topic": "Seizure maintenance", "q": "What is the key purpose of maintenance antiseizure medication?", "o": ["Help prevent future seizures", "Drain CSF", "Stop every active seizure instantly", "Reduce cerebral edema"], "a": 0, "r": "Maintenance therapy is preventive and should be taken consistently."}, {"topic": "ICP medication", "q": "Mannitol is used in this PowerPoint primarily to do what?", "o": ["Reduce cerebral edema", "Prevent all future seizures", "Treat shunt infection", "Measure ICP"], "a": 0, "r": "Mannitol is hyperosmolar therapy used to reduce cerebral edema."}, {"topic": "ICP medication", "q": "Hypertonic saline therapy makes which monitoring especially relevant?", "o": ["Sodium/osmolality and fluid balance", "Hair/nail growth", "Hearing only", "Bowel frequency only"], "a": 0, "r": "The PowerPoint emphasizes sodium/osmolality along with neuro status, BP, fluid balance, and renal function."}, {"topic": "ICP medication", "q": "Phenobarbital/barbiturate therapy is described for which situation?", "o": ["Selected refractory ICP", "Every mild concussion", "VP-shunt infection", "Routine first-line seizure prevention for every client"], "a": 0, "r": "The lecture lists barbiturates such as phenobarbital for selected refractory ICP."}, {"topic": "Maintenance teaching", "q": "Which teaching point is reinforced for phenytoin maintenance therapy?", "o": ["Take it consistently at the same time each day", "Save it for an active seizure", "Skip doses when seizure-free", "Use it to drain CSF"], "a": 0, "r": "ATI reinforces consistent same-time daily dosing to maintain therapeutic levels."}];let i=0,s=0,a=0;const g=document.getElementById('game'),sc=document.getElementById('score');

<script id="nur223-autosave-engine">
(function(){
 const base='nur223_autosave_v1_'+location.pathname, ek=base+'_events', sk=base+'_scroll'; let replaying=false;
 const read=()=>{try{return JSON.parse(localStorage.getItem(ek)||'[]')}catch(e){return[]}};
 const write=a=>localStorage.setItem(ek,JSON.stringify(a));
 function path(el){if(el.id)return '#'+CSS.escape(el.id);let a=[];while(el&&el!==document.body){let tag=el.tagName.toLowerCase(), sib=[...el.parentElement.children].filter(x=>x.tagName===el.tagName), n=sib.indexOf(el)+1;a.unshift(tag+':nth-of-type('+n+')');el=el.parentElement}return 'body>'+a.join('>')}
 function add(type,el){if(replaying||el.closest('#nur223-save-status')||el.closest('.site-nav'))return;let txt=(el.textContent||'').trim();if(type==='click'&&/reset|start over|clear progress/i.test(txt)){write([]);localStorage.removeItem(sk);return}let e={type,path:path(el)};if(type!=='click')e.value=el.value;let a=read();a.push(e);if(a.length>5000)a=a.slice(-5000);write(a);status('Progress saved ✓')}
 document.addEventListener('click',e=>{let t=e.target.closest('button,input[type=button],input[type=submit]');if(t)add('click',t)},true);
 document.addEventListener('change',e=>{if(e.target.matches('select,input,textarea'))add('change',e.target)},true);
 let st;addEventListener('scroll',()=>{clearTimeout(st);st=setTimeout(()=>localStorage.setItem(sk,String(scrollY)),150)});
 function status(msg){let b=document.getElementById('nur223-save-status');if(b)b.firstChild.nodeValue=msg+' '}
 addEventListener('DOMContentLoaded',()=>{let badge=document.createElement('div');badge.id='nur223-save-status';badge.append(document.createTextNode('Autosave on ✓ '));let clear=document.createElement('button');clear.textContent='Clear saved session';clear.onclick=()=>{if(confirm('Clear the saved session for this game? Long-term mastery stored by the game may remain unless you also use its Reset button.')){write([]);localStorage.removeItem(sk);location.reload()}};badge.append(clear);document.body.append(badge);setTimeout(()=>{let a=read();if(a.length){replaying=true;for(let e of a){let el;try{el=document.querySelector(e.path)}catch(_){}if(!el)continue;if(e.type==='change'){el.value=e.value;el.dispatchEvent(new Event('change',{bubbles:true}));el.dispatchEvent(new Event('input',{bubbles:true}))}else el.click()}replaying=false;status('Progress restored ✓')}let y=Number(localStorage.getItem(sk)||0);if(y)setTimeout(()=>scrollTo(0,y),50)},80)});
})();
