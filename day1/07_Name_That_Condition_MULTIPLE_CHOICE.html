<script id="nur223-autosave-engine">
(function(){

 function path(el){if(el.id)return '#'+CSS.escape(el.id);let a=[];while(el&&el!==document.body){let tag=el.tagName.toLowerCase(), sib=[...el.parentElement.children].filter(x=>x.tagName===el.tagName), n=sib.indexOf(el)+1;a.unshift(tag+':nth-of-type('+n+')');el=el.parentElement}return 'body>'+a.join('>')}
 function add(type,el){if(replaying||el.closest('#nur223-save-status')||el.closest('.site-nav'))return;let txt=(el.textContent||'').trim();if(type==='click'&&/reset|start over|clear progress/i.test(txt)){write([]);localStorage.removeItem(sk);return}let e={type,path:path(el)};if(type!=='click')e.value=el.value;let a=read();a.push(e);if(a.length>5000)a=a.slice(-5000);write(a);status('Progress saved ✓')}
