<!doctype html><html><head><script id="nur223-autosave-seed">
(function(){
 const k='nur223_autosave_seed_'+location.pathname; let s=Number(localStorage.getItem(k));
 if(!s){s=(Date.now()^location.pathname.split('').reduce((a,c)=>a+c.charCodeAt(0),0))>>>0;localStorage.setItem(k,String(s));}
 let x=s>>>0; Math.random=function(){x+=0x6D2B79F5;let t=x;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296};
})();
</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clinical Sorting Game</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f2f7;color:#25212a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}header{background:#43245f;color:#fff;padding:18px;position:sticky;top:0;z-index:5}.wrap,main{max-width:900px;margin:auto}h1{margin:0 0 5px}.sub{opacity:.9;font-size:13px}main{padding:14px}.card,.panel{background:#fff;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 3px 14px #0001}button{border:1px solid #d3ccd8;background:#fff;border-radius:9px;padding:11px;margin:5px;font-size:15px}button:hover{background:#f1eaf5}.primary{background:#43245f;color:#fff}.correct{background:#e5f4e8!important;border-color:#559164!important}.wrong{background:#fde8e8!important;border-color:#b95a5a!important}.feedback{margin-top:12px;padding:12px;border-radius:9px;background:#f3eef6;line-height:1.5}.hidden{display:none}.score{font-weight:750}.choice{display:block;width:100%;text-align:left}.big{font-size:22px;font-weight:750;line-height:1.4}.tag{font-size:12px;font-weight:800;text-transform:uppercase;color:#76518d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.drop{min-height:120px;border:2px dashed #c9bfd0;border-radius:12px;padding:10px}.item{background:#fff;border:1px solid #d8d0dd;border-radius:9px;padding:10px;margin:7px 0;cursor:pointer}.selected{outline:3px solid #8b68a0}.order{padding:10px;border:1px solid #ddd;border-radius:9px;margin:7px 0;background:#fff}.small{font-size:12px;color:#666}a{color:#43245f}</style><style id="study-site-nav-css">.study-site-nav{position:fixed;right:14px;bottom:14px;z-index:99999;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.study-site-nav a{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;text-decoration:none;background:#172033;color:#fff!important;border:1px solid #ffffff38;border-radius:999px;padding:9px 12px;font-size:13px;font-weight:800;box-shadow:0 4px 14px #0003}.study-site-nav a:first-child{background:#3448c5}@media(max-width:520px){.study-site-nav{left:10px;right:10px;bottom:10px}.study-site-nav a{flex:1;text-align:center}}</style></head><body><header><div class="wrap"><h1>Clinical Sorting Game</h1><div class="sub">Sort high-yield neurologic distinctions</div></div></header><main><div class="panel score" id="score"></div><div id="game"></div><button class="primary" onclick="check()">Check Sort</button><button onclick="next()">Next Set</button></main><script>const S=[{"title": "Primary vs Secondary TBI", "cats": ["Primary injury", "Secondary injury"], "items": [["Concussion", 0], ["Contusion", 0], ["Hemorrhage at impact", 0], ["Skull fracture", 0], ["Hypoxia", 1], ["Ischemia", 1], ["Cerebral edema", 1], ["Increased ICP", 1]]}, {"title": "Early vs Late Increased ICP", "cats": ["Early/worsening", "Late/ominous"], "items": [["Restlessness/confusion", 0], ["Headache", 0], ["Nausea/vomiting", 0], ["LOC change", 0], ["Fixed/dilated pupil", 1], ["Posturing", 1], ["Cushing's triad", 1], ["Marked LOC decline", 1]]}, {"title": "Shunt Complications", "cats": ["Obstruction", "Infection"], "items": [["Return of hydrocephalus symptoms", 0], ["Vomiting/headache", 0], ["Neurologic decline", 0], ["Fever", 1], ["Redness/tenderness along shunt", 1]]}, {"title": "Seizure Medications", "cats": ["Rescue", "Maintenance"], "items": [["Lorazepam", 0], ["Diazepam", 0], ["Midazolam", 0], ["Levetiracetam", 1], ["Phenytoin", 1], ["Carbamazepine", 1], ["Valproate", 1]]}, {"title": "ICP Devices", "cats": ["EVD", "Intraparenchymal monitor"], "items": [["Measures ICP", 0], ["Can drain CSF", 0], ["Measures ICP but cannot drain CSF", 1]]}];let i=0,selected=null,placed={},score=0,attempts=0;const g=document.getElementById('game'),sc=document.getElementById('score');function render(){selected=null;placed={};let s=S[i];g.innerHTML=`<div class="card"><div class="big">${s.title}</div><p>Tap an item, then tap the category where it belongs.</p><div id="pool">${s.items.map((x,k)=>`<div class="item" data-item="${k}">${x[0]}</div>`).join('')}</div><div class="grid">${s.cats.map((c,k)=>`<div class="drop" data-cat="${k}"><b>${c}</b><div id="c${k}"></div></div>`).join('')}</div><div id="fb"></div></div>`;document.querySelectorAll('[data-item]').forEach(x=>x.onclick=()=>{document.querySelectorAll('.item').forEach(z=>z.classList.remove('selected'));x.classList.add('selected');selected=+x.dataset.item});document.querySelectorAll('[data-cat]').forEach(x=>x.onclick=()=>{if(selected===null)return;placed[selected]=+x.dataset.cat;document.getElementById('c'+x.dataset.cat).appendChild(document.querySelector(`[data-item="${selected}"]`));selected=null});upd()}function check(){let s=S[i];if(Object.keys(placed).length!==s.items.length)return alert('Sort every item first.');attempts++;let ok=s.items.every((x,k)=>placed[k]===x[1]);if(ok)score++;document.getElementById('fb').innerHTML=`<div class="feedback"><b>${ok?'Perfect sort!':'Review the correct groups:'}</b><br>${s.cats.map((c,j)=>`<b>${c}:</b> ${s.items.filter(x=>x[1]===j).map(x=>x[0]).join(', ')}`).join('<br>')}</div>`;upd()}function upd(){sc.textContent=`Score: ${score}/${attempts} · Set ${i+1}/${S.length}`}function next(){i=(i+1)%S.length;render()}render();</script><nav class="study-site-nav" aria-label="Study site navigation"><a href="index.html">← Day1 Home</a><a href="../index.html">Exam 3 Main</a></nav><style id="nur223-autosave-style">

<script id="nur223-autosave-engine">
(function(){
 const base='nur223_autosave_v1_'+location.pathname, ek=base+'_events', sk=base+'_scroll'; let replaying=false;
 const read=()=>{try{return JSON.parse(localStorage.getItem(ek)||'[]')}catch(e){return[]}};
 const write=a=>localStorage.setItem(ek,JSON.stringify(a));
 function path(el){if(el.id)return '#'+CSS.escape(el.id);let a=[];while(el&&el!==document.body){let tag=el.tagName.toLowerCase(), sib=[...el.parentElement.children].filter(x=>x.tagName===el.tagName), n=sib.indexOf(el)+1;a.unshift(tag+':nth-of-type('+n+')');el=el.parentElement}return 'body>'+a.join('>')}
 function add(type,el){if(replaying||el.closest('#nur223-save-status')||el.closest('.site-nav'))return;let txt=(el.textContent||'').trim();if(type==='click'&&/reset|start over|clear progress/i.test(txt)){write([]);localStorage.removeItem(sk);return}let e={type,path:path(el)};if(type!=='click')e.value=el.value;let a=read();a.push(e);if(a.length>5000)a=a.slice(-5000);write(a);status('Progress saved ✓')}
 document.addEventListener('click',e=>{let t=e.target.closest('button,input[type=button],input[type=submit]');if(t)add('click',t)},true);
 document.addEventListener('change',e=>{if(e.target.matches('select,input,textarea'))add('change',e.target)},true);
 let st;addEventListener('scroll',()=>{clearTimeout(st);st=setTimeout(()=>localStorage.setItem(sk,String(scrollY)),150)});
 function status(msg){let b=document.getElementById('nur223-save-status');if(b)b.firstChild.nodeValue=msg+' '}
 addEventListener('DOMContentLoaded',()=>{let badge=document.createElement('div');badge.id='nur223-save-status';badge.append(document.createTextNode('Autosave on ✓ '));let clear=document.createElement('button');clear.textContent='Clear saved session';clear.onclick=()=>{if(confirm('Clear the saved session for this game? Long-term mastery stored by the game may remain unless you also use its Reset button.')){write([]);localStorage.removeItem(sk);location.reload()}};badge.append(clear);document.body.append(badge);setTimeout(()=>{let a=read();if(a.length){replaying=true;for(let e of a){let el;try{el=document.querySelector(e.path)}catch(_){}if(!el)continue;if(e.type==='change'){el.value=e.value;el.dispatchEvent(new Event('change',{bubbles:true}));el.dispatchEvent(new Event('input',{bubbles:true}))}else el.click()}replaying=false;status('Progress restored ✓')}let y=Number(localStorage.getItem(sk)||0);if(y)setTimeout(()=>scrollTo(0,y),50)},80)});
})();
</script></body></html>
