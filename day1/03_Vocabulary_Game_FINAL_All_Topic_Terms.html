<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NUR 223 Vocabulary Game</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f2f7;color:#26212b;font-family:Arial,sans-serif}header{background:#43245f;color:#fff;padding:18px;position:sticky;top:0}.wrap,main{max-width:980px;margin:auto}h1{margin:0 0 4px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button,select{border:0;border-radius:9px;padding:10px 12px}.panel{background:#fff;border-radius:14px;padding:16px;margin:15px 0;box-shadow:0 3px 14px #0001}.game{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tile{width:100%;text-align:left;background:#fff;border:2px solid #ded7e2;border-radius:10px;padding:12px;margin:7px 0}.selected{border-color:#7a5592;background:#f0e8f5}.matched{border-color:#5b9368;background:#eaf5ec;opacity:.55}.wrong{border-color:#b95d5d;background:#faeaea}.choice{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border:1px solid #ddd;background:#fff;border-radius:9px}.correct{background:#e7f5ea}.incorrect{background:#fdeaea}.prompt{font-size:24px;font-weight:700;margin:18px 0}.tabs .active{background:#43245f;color:white}@media(max-width:650px){.game{grid-template-columns:1fr}}</style><style id="study-site-nav-css">.study-site-nav{position:fixed;right:14px;bottom:14px;z-index:99999;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.study-site-nav a{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;text-decoration:none;background:#172033;color:#fff!important;border:1px solid #ffffff38;border-radius:999px;padding:9px 12px;font-size:13px;font-weight:800;box-shadow:0 4px 14px #0003}.study-site-nav a:first-child{background:#3448c5}@media(max-width:520px){.study-site-nav{left:10px;right:10px;bottom:10px}.study-site-nav a{flex:1;text-align:center}}</style></head><body><header><div class="wrap"><h1>NUR 223 Exam 3 — Vocabulary Game</h1><div>PowerPoint terminology + high-yield overlapping reading concepts • all terms in the selected topic appear each round</div><div class="tools"><select id="cat"><option value="All">All categories</option></select><button onclick="newRound()">New Round</button><button onclick="resetAll()">Reset Score</button></div></div></header><main><div class="panel"><div class="tabs"><button id="m" class="active" onclick="mode='match';newRound()">Matching</button> <button id="q" onclick="mode='quiz';newRound()">Definition Challenge</button></div><p id="stats"></p></div><div id="content"></div></main><script>
const T=[{"id": 1, "category": "Neuro Anatomy", "term": "Frontal lobe", "definition": "Judgment, behavior, speech, voluntary movement"}, {"id": 2, "category": "Neuro Anatomy", "term": "Parietal lobe", "definition": "Sensory interpretation and spatial awareness"}, {"id": 3, "category": "Neuro Anatomy", "term": "Temporal lobe", "definition": "Hearing, memory, language comprehension"}, {"id": 4, "category": "Neuro Anatomy", "term": "Occipital lobe", "definition": "Vision"}, {"id": 5, "category": "Neuro Anatomy", "term": "Cerebellum", "definition": "Balance and coordination"}, {"id": 6, "category": "Neuro Anatomy", "term": "Brainstem", "definition": "Respirations, heart rate, swallowing, consciousness"}, {"id": 7, "category": "Assessment", "term": "Glasgow Coma Scale (GCS)", "definition": "Standardized assessment of level of consciousness"}, {"id": 8, "category": "Assessment", "term": "Last known well", "definition": "Last time the client was known at neurologic baseline"}, {"id": 9, "category": "Hydrocephalus", "term": "Hydrocephalus", "definition": "Excess CSF accumulation associated with increased intracranial volume"}, {"id": 10, "category": "Hydrocephalus", "term": "Sunset eyes", "definition": "Downward eye deviation associated with infant hydrocephalus"}, {"id": 11, "category": "Hydrocephalus", "term": "VP shunt", "definition": "Diverts CSF to the peritoneal cavity"}, {"id": 12, "category": "Hydrocephalus", "term": "Shunt obstruction", "definition": "Failed CSF diversion causing return of hydrocephalus symptoms"}, {"id": 13, "category": "Hydrocephalus", "term": "Shunt infection", "definition": "Shunt complication associated with fever and redness or tenderness"}, {"id": 14, "category": "TBI", "term": "Traumatic brain injury (TBI)", "definition": "Brain injury caused by trauma"}, {"id": 15, "category": "TBI", "term": "Primary brain injury", "definition": "Damage occurring at the moment of impact"}, {"id": 16, "category": "TBI", "term": "Secondary brain injury", "definition": "Damage developing after impact, such as hypoxia, ischemia, edema, or increased ICP"}, {"id": 17, "category": "TBI", "term": "Concussion", "definition": "Mild TBI with symptoms such as headache, dizziness, nausea, or confusion"}, {"id": 18, "category": "TBI", "term": "Cerebral edema", "definition": "Brain swelling that increases brain volume"}, {"id": 19, "category": "Brain Tumors", "term": "Primary brain tumor", "definition": "Tumor originating in the central nervous system"}, {"id": 20, "category": "Brain Tumors", "term": "Secondary brain tumor", "definition": "Metastatic tumor that spread to the brain from another site"}, {"id": 21, "category": "Increased ICP", "term": "Intracranial pressure (ICP)", "definition": "Pressure within the skull"}, {"id": 22, "category": "Increased ICP", "term": "Monro-Kellie doctrine", "definition": "Brain, blood, and CSF share a fixed skull volume and must compensate for volume changes"}, {"id": 23, "category": "Increased ICP", "term": "Mean arterial pressure (MAP)", "definition": "Average arterial pressure; (SBP + 2×DBP) ÷ 3"}, {"id": 24, "category": "Increased ICP", "term": "Cerebral perfusion pressure (CPP)", "definition": "Pressure driving cerebral blood flow; CPP = MAP − ICP"}, {"id": 25, "category": "Increased ICP", "term": "Cushing's triad", "definition": "Widened pulse pressure/increased systolic BP, bradycardia, irregular respirations"}, {"id": 26, "category": "Increased ICP", "term": "Herniation", "definition": "Dangerous displacement of brain tissue associated with severe intracranial pressure"}, {"id": 27, "category": "Increased ICP", "term": "Posturing", "definition": "Abnormal motor response associated with severe neurologic dysfunction"}, {"id": 28, "category": "Increased ICP", "term": "External ventricular drain (EVD)", "definition": "Device that measures ICP and can drain CSF"}, {"id": 29, "category": "Increased ICP", "term": "Intraparenchymal monitor", "definition": "Device that measures ICP but cannot drain CSF"}, {"id": 30, "category": "Increased ICP", "term": "Hyperosmolar therapy", "definition": "Therapy used to reduce cerebral edema"}, {"id": 31, "category": "Increased ICP", "term": "Mannitol", "definition": "Hyperosmolar medication used to reduce cerebral edema"}, {"id": 32, "category": "Increased ICP", "term": "Hypertonic saline", "definition": "Hyperosmolar therapy used to reduce cerebral edema"}, {"id": 33, "category": "Increased ICP", "term": "Refractory ICP", "definition": "ICP that remains elevated despite initial treatment"}, {"id": 34, "category": "Seizures", "term": "Seizure", "definition": "Abnormal, excessive electrical activity in the brain"}, {"id": 35, "category": "Seizures", "term": "Epilepsy", "definition": "Chronic seizure disorder"}, {"id": 36, "category": "Seizures", "term": "Generalized seizure", "definition": "Broad seizure category involving widespread brain activity"}, {"id": 37, "category": "Seizures", "term": "Focal seizure", "definition": "Seizure beginning in a focal area of the brain"}, {"id": 38, "category": "Seizures", "term": "Tonic-clonic seizure", "definition": "Generalized seizure with tonic and clonic motor activity"}, {"id": 39, "category": "Seizures", "term": "Atonic seizure", "definition": "Seizure with sudden loss of muscle tone"}, {"id": 40, "category": "Seizures", "term": "Myoclonic seizure", "definition": "Seizure with brief muscle contractions or jerks"}, {"id": 41, "category": "Seizures", "term": "Absence seizure", "definition": "Generalized seizure with brief interruption of awareness"}, {"id": 42, "category": "Seizures", "term": "Prodromal phase", "definition": "Period preceding the ictal event in the seizure sequence"}, {"id": 43, "category": "Seizures", "term": "Aura", "definition": "Early ictal warning associated with seizure onset"}, {"id": 44, "category": "Seizures", "term": "Ictal phase", "definition": "Period of active seizure activity"}, {"id": 45, "category": "Seizures", "term": "Postictal phase", "definition": "Recovery period after seizure activity ends"}, {"id": 46, "category": "Seizures", "term": "Status epilepticus", "definition": "Seizure ≥5 minutes or repeated seizures without recovery"}, {"id": 47, "category": "Seizures", "term": "Electroencephalogram (EEG)", "definition": "Test that records electrical activity of the brain"}, {"id": 48, "category": "Seizures", "term": "Rescue antiseizure medication", "definition": "Medication category used to help stop an ongoing seizure; examples are lorazepam, diazepam, and midazolam."}, {"id": 49, "category": "Seizures", "term": "Maintenance antiseizure medication", "definition": "Medication category taken consistently to help prevent future seizures; examples are levetiracetam, phenytoin, carbamazepine, and valproate."}, {"id": 50, "category": "Seizures", "term": "Vagal nerve stimulator (VNS)", "definition": "Implanted device providing intermittent vagal stimulation to reduce seizures"}];let mode='match',score=0,attempts=0,round=[],st=null,sd=null,matched=new Set(),qi=0;const cat=document.getElementById('cat'),content=document.getElementById('content'),stats=document.getElementById('stats');[...new Set(T.map(x=>x.category))].sort().forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;cat.appendChild(o)});cat.onchange=newRound;
function pool(){return T.filter(x=>cat.value==='All'||x.category===cat.value)}function sample(a,n){let x=[...a];for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x.slice(0,Math.min(n,x.length))}function stat(){stats.innerHTML=`<b>Score ${score}/${attempts}</b> · ${pool().length} terms available`}
function newRound(){document.getElementById('m').classList.toggle('active',mode==='match');document.getElementById('q').classList.toggle('active',mode==='quiz');matched=new Set();st=sd=null;round=sample(pool(),pool().length);qi=0;render()}function render(){stat();mode==='match'?match():quiz()}
function match(){let defs=sample(round,round.length);content.innerHTML=`<div class="panel"><b>Match each term with its unique definition. Medication cards test the rescue-versus-maintenance category and list the PowerPoint examples, avoiding ambiguous one-to-one drug matches.</b><div class="game"><div><h3>Terms</h3>${round.map(x=>`<button class="tile ${matched.has(x.id)?'matched':''}" data-t="${x.id}">${x.term}</button>`).join('')}</div><div><h3>Definitions</h3>${defs.map(x=>`<button class="tile ${matched.has(x.id)?'matched':''}" data-d="${x.id}">${x.definition}</button>`).join('')}</div></div></div>`;document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{if(matched.has(+b.dataset.t))return;document.querySelectorAll('[data-t]').forEach(z=>z.classList.remove('selected'));b.classList.add('selected');st=+b.dataset.t;check()});document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(matched.has(+b.dataset.d))return;document.querySelectorAll('[data-d]').forEach(z=>z.classList.remove('selected'));b.classList.add('selected');sd=+b.dataset.d;check()})}
function check(){if(st==null||sd==null)return;attempts++;if(st===sd){score++;matched.add(st)}else{document.querySelectorAll('.selected').forEach(x=>x.classList.add('wrong'))}st=sd=null;stat();setTimeout(match,450)}
function quiz(){let x=round[qi%round.length],opts=sample([x,...sample(pool().filter(z=>z.id!==x.id && z.definition!==x.definition),3)],4);content.innerHTML=`<div class="panel"><div>Which term matches this definition?</div><div class="prompt">${x.definition}</div>${opts.map(o=>`<button class="choice" data-id="${o.id}">${o.term}</button>`).join('')}<p id="fb"></p></div>`;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{attempts++;document.querySelectorAll('.choice').forEach(z=>z.disabled=true);if(+b.dataset.id===x.id){score++;b.classList.add('correct');document.getElementById('fb').innerHTML='<b>Correct!</b>'}else{b.classList.add('incorrect');document.querySelector(`[data-id="${x.id}"]`).classList.add('correct');document.getElementById('fb').innerHTML=`<b>Correct answer: ${x.term}</b>`}stat();qi++;setTimeout(quiz,1000)})}
function resetAll(){score=attempts=0;newRound()}newRound();</script><nav class="study-site-nav" aria-label="Study site navigation"><a href="index.html">← Day1 Home</a><a href="../index.html">Exam 3 Main</a></nav></body></html>
