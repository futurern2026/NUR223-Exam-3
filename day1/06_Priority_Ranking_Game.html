<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Priority Ranking Game</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f2f7;color:#25212a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}header{background:#43245f;color:#fff;padding:18px;position:sticky;top:0;z-index:5}.wrap,main{max-width:900px;margin:auto}h1{margin:0 0 5px}.sub{opacity:.9;font-size:13px}main{padding:14px}.card,.panel{background:#fff;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 3px 14px #0001}button{border:1px solid #d3ccd8;background:#fff;border-radius:9px;padding:11px;margin:5px;font-size:15px}button:hover{background:#f1eaf5}.primary{background:#43245f;color:#fff}.correct{background:#e5f4e8!important;border-color:#559164!important}.wrong{background:#fde8e8!important;border-color:#b95a5a!important}.feedback{margin-top:12px;padding:12px;border-radius:9px;background:#f3eef6;line-height:1.5}.hidden{display:none}.score{font-weight:750}.choice{display:block;width:100%;text-align:left}.big{font-size:22px;font-weight:750;line-height:1.4}.tag{font-size:12px;font-weight:800;text-transform:uppercase;color:#76518d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.drop{min-height:120px;border:2px dashed #c9bfd0;border-radius:12px;padding:10px}.item{background:#fff;border:1px solid #d8d0dd;border-radius:9px;padding:10px;margin:7px 0;cursor:pointer}.selected{outline:3px solid #8b68a0}.order{padding:10px;border:1px solid #ddd;border-radius:9px;margin:7px 0;background:#fff}.small{font-size:12px;color:#666}a{color:#43245f}</style><style id="study-site-nav-css">.study-site-nav{position:fixed;right:14px;bottom:14px;z-index:99999;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.study-site-nav a{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;text-decoration:none;background:#172033;color:#fff!important;border:1px solid #ffffff38;border-radius:999px;padding:9px 12px;font-size:13px;font-weight:800;box-shadow:0 4px 14px #0003}.study-site-nav a:first-child{background:#3448c5}@media(max-width:520px){.study-site-nav{left:10px;right:10px;bottom:10px}.study-site-nav a{flex:1;text-align:center}}</style></head><body><header><div class="wrap"><h1>Priority Ranking Game</h1><div class="sub">Put nursing actions in sequence</div></div></header><main><div class="panel score" id="score"></div><div id="game"></div><button class="primary" onclick="check()">Check Order</button><button onclick="next()">Next</button></main><script>const Q=[{"topic": "Seizure", "q": "A client begins a tonic-clonic seizure while standing. Put the nursing sequence in the best order.", "items": ["Ease the client to the floor/protect the head", "Support side positioning/airway and loosen restrictive clothing", "Observe and document onset, duration, and findings", "After seizure ends, assess vitals/injury/neuro status and reorient"], "r": "The sequence moves from immediate injury prevention and airway support to observation, then postictal recovery assessment."}, {"topic": "TBI", "q": "A newly admitted trauma client may have head and cervical injury. Rank the priorities.", "items": ["Maintain airway/oxygenation with cervical protection", "Establish neurologic baseline including GCS/pupils/motor findings", "Trend neurologic findings and vital signs", "Escalate promptly if LOC/GCS, pupils, or motor function worsens"], "r": "Protect oxygenation and the cervical spine first, then establish and trend the neurologic baseline so deterioration can be recognized."}, {"topic": "Increased ICP", "q": "A client is showing worsening ICP. Rank these nursing actions conceptually from immediate stabilization to ongoing monitoring.", "items": ["Maintain airway/oxygenation and prevent hypotension", "Position with HOB elevated as ordered and head/neck neutral", "Control avoidable triggers such as pain, agitation, and fever", "Continue serial GCS/LOC, pupils, motor, and vital-sign trends"], "r": "The priorities protect oxygenation/perfusion, support venous drainage, reduce avoidable ICP stressors, and then continue close trending."}];let i=0,s=0,a=0,chosen=[];const g=document.getElementById('game'),sc=document.getElementById('score');function render(){chosen=[];let q=Q[i],mix=q.items.map((x,k)=>({x,k})).sort(()=>Math.random()-.5);g.innerHTML=`<div class="card"><div class="tag">${q.topic}</div><div class="big">${q.q}</div><p>Tap items in the order you would perform them.</p><div id="pool">${mix.map(z=>`<button class="choice" data-k="${z.k}">${z.x}</button>`).join('')}</div><div id="sel"></div><div id="fb"></div></div>`;document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{if(b.disabled)return;b.disabled=true;chosen.push(+b.dataset.k);document.getElementById('sel').innerHTML=chosen.map((k,n)=>`<div class="order">${n+1}. ${q.items[k]}</div>`).join('')});upd()}function check(){let q=Q[i];if(chosen.length!==q.items.length)return alert('Choose all items first.');a++;let ok=chosen.every((k,n)=>k===n);if(ok)s++;document.getElementById('fb').innerHTML=`<div class="feedback"><b>${ok?'Correct order':'Review the sequence'}</b><br>${q.items.map((x,n)=>`${n+1}. ${x}`).join('<br>')}<br><br>${q.r}</div>`;upd()}function upd(){sc.textContent=`Score: ${s}/${a} · Scenario ${i+1}/${Q.length}`}function next(){i=(i+1)%Q.length;render()}render();</script><nav class="study-site-nav" aria-label="Study site navigation"><a href="index.html">← Day1 Home</a><a href="../index.html">Exam 3 Main</a></nav></body></html>
