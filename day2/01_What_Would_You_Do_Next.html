<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>What Would You Do Next?</title><style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#d9dfeb;--accent:#3448c5;--good:#087a55;--bad:#b42318;--soft:#eef1ff}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line)}.wrap{max-width:980px;margin:auto;padding:18px}main{max-width:980px;margin:22px auto;padding:0 16px 50px}
h1{font-size:1.4rem;margin:0 0 6px}.sub{color:var(--muted);font-size:.92rem}.stats,.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
button,select{border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 12px;color:var(--ink);font-weight:700;cursor:pointer}
.primary{background:var(--accent);border-color:var(--accent);color:#fff}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 4px 14px rgba(20,30,55,.05);margin-bottom:14px}
.chip{display:inline-block;background:var(--soft);color:#3343a5;border-radius:999px;padding:5px 9px;font-size:.78rem;font-weight:800}.stem{font-size:1.15rem;font-weight:760;line-height:1.5;margin:16px 0}
.options{display:grid;gap:9px}.opt{width:100%;text-align:left;line-height:1.4}.opt.correct{border-color:#4da987;background:#edf9f4}.opt.wrong{border-color:#d97b74;background:#fff1f0}
.feedback{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;line-height:1.55}.why{color:var(--muted)}.progress{height:7px;background:#e8ecf4;border-radius:99px;overflow:hidden;margin-top:12px}.bar{height:100%;background:var(--accent)}
.center{text-align:center}.big{font-size:1.25rem;font-weight:800}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style><style id="study-site-nav-css">.study-site-nav{position:fixed;right:14px;bottom:14px;z-index:99999;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.study-site-nav a{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;text-decoration:none;background:#172033;color:#fff!important;border:1px solid #ffffff38;border-radius:999px;padding:9px 12px;font-size:13px;font-weight:800;box-shadow:0 4px 14px #0003}.study-site-nav a:first-child{background:#3448c5}@media(max-width:520px){.study-site-nav{left:10px;right:10px;bottom:10px}.study-site-nav a{flex:1;text-align:center}}</style></head><body>
<header><div class="wrap"><h1>What Would You Do Next?</h1><div class="sub">Priority nursing actions and clinical judgment</div></div></header>
<main><div class="stats"><span>Question <b id="num">1</b>/<b id="total"></b></span><span>Correct <b id="score">0</b></span><span>Accuracy <b id="acc">—</b></span></div>
<div class="progress"><div class="bar" id="bar"></div></div><div id="stage" style="margin-top:18px"></div></main><script>
const Q=[{"topic": "Placenta previa", "stem": "A client at 33 weeks has painless bright-red vaginal bleeding and a soft uterus. What should the nurse do next?", "options": ["Perform a digital vaginal examination", "Assess maternal vital signs and fetal status while avoiding a digital exam", "Encourage ambulation to determine whether bleeding increases", "Apply fundal pressure"], "correct": 1, "rationale": "The pattern suggests placenta previa. Maternal/fetal stability and bleeding are assessed first, and a digital vaginal examination is avoided because it can trigger severe hemorrhage."}, {"topic": "Placental abruption", "stem": "A client at 36 weeks has severe abdominal pain, a firm tender uterus, dark vaginal bleeding, and fetal distress. What should the nurse prioritize?", "options": ["Maternal hemodynamic stabilization and fetal assessment", "Delay intervention until ultrasound confirms the diagnosis", "Perform a digital examination", "Encourage oral fluids and reassess in one hour"], "correct": 0, "rationale": "Placental abruption can cause major maternal hemorrhage and fetal oxygen compromise. Stabilization, fetal assessment, IV access, laboratory preparation, and urgent birth planning may be required."}, {"topic": "Preterm labor", "stem": "A client at 31 weeks reports regular contractions, pelvic pressure, and low backache. What should the nurse assess next?", "options": ["Cervical change and contraction pattern", "Whether the client has chosen a pediatrician", "Postpartum contraception preference", "Newborn hearing-screen plans"], "correct": 0, "rationale": "Preterm labor is regular contractions causing cervical change before 37 weeks, so determining whether cervical change is occurring is central to the evaluation."}, {"topic": "Preeclampsia", "stem": "A pregnant client with elevated blood pressure reports a persistent severe headache and new visual changes. What should the nurse do?", "options": ["Reassure the client that these are expected pregnancy discomforts", "Promptly evaluate for worsening hypertensive disease and maternal-fetal compromise", "Recommend a high-carbohydrate snack", "Delay assessment until the next prenatal appointment"], "correct": 1, "rationale": "Severe headache and visual changes are concerning features of preeclampsia and can precede serious maternal neurologic complications."}, {"topic": "Preterm newborn", "stem": "A 30-week newborn is grunting, retracting, and has low oxygen saturation. What should the nurse prioritize?", "options": ["Oral feeding", "Respiratory support", "Bathing", "Parent discharge teaching"], "correct": 1, "rationale": "Respiratory stability is the first physiologic priority in a symptomatic preterm newborn because surfactant deficiency and immature respiratory control can rapidly impair oxygenation."}, {"topic": "Cold stress", "stem": "A preterm infant is hypothermic. What should the nurse address first?", "options": ["Thermal support while monitoring respiratory and glucose status", "Delay warming until the next scheduled temperature", "Give a large oral feeding regardless of respiratory status", "Place the infant near a cool window"], "correct": 0, "rationale": "Cold stress increases oxygen and glucose consumption and can worsen respiratory distress and hypoglycemia. Controlled warming and physiologic monitoring are priorities."}, {"topic": "STI testing", "stem": "A client reports receptive anal intercourse and oral sex but no genital symptoms. What should guide the STI testing plan?", "options": ["Only the presence of genital symptoms", "Anatomy and sites of sexual exposure", "Gender identity alone", "A urine specimen for every possible infection"], "correct": 1, "rationale": "Specimen sites should match anatomy and exposure. Rectal or pharyngeal infection can be missed when testing is limited to genital or urine specimens."}, {"topic": "PID", "stem": "A client has pelvic pain, fever, abnormal discharge, and cervical motion tenderness. What is the nursing priority?", "options": ["Recognize possible PID and facilitate prompt evaluation/treatment", "Reassure the client that the findings are typical ovulation", "Delay evaluation until the next menstrual cycle", "Recommend cervical cancer screening as the only test"], "correct": 0, "rationale": "The cluster is concerning for PID, an ascending infection that can lead to infertility, ectopic pregnancy, and chronic pelvic pain if untreated."}, {"topic": "Post-abortion", "stem": "A client after medication abortion reports syncope, worsening severe pain, and very heavy bleeding. What should the nurse advise?", "options": ["Urgent evaluation", "Routine follow-up in several weeks", "These are expected findings requiring no action", "Begin fertility-awareness tracking"], "correct": 0, "rationale": "Hemodynamic symptoms, excessive bleeding, and severe/worsening pain are warning signs rather than expected recovery findings."}, {"topic": "Combined contraception", "stem": "A client using combined hormonal contraception reports unilateral severe leg pain and swelling. What should the nurse recommend?", "options": ["Prompt evaluation", "Take the next dose early", "This is an expected effect", "Massage the leg vigorously"], "correct": 0, "rationale": "Severe leg pain/swelling is an ACHES warning sign that can indicate venous thrombosis."}, {"topic": "Amenorrhea", "stem": "A client who could become pregnant reports a missed period. What should be assessed first?", "options": ["Pregnancy possibility/testing", "Menopause regardless of age", "Cervical cancer screening", "Endometriosis surgery"], "correct": 0, "rationale": "Pregnancy is an important and common cause of amenorrhea and should be considered first when biologically possible."}, {"topic": "Postmenopausal bleeding", "stem": "A 54-year-old who has had no menses for 14 months reports new vaginal bleeding. What should the nurse do?", "options": ["Arrange prompt evaluation", "Explain that normal monthly cycles have resumed", "Recommend waiting six months", "Treat it as routine dysmenorrhea"], "correct": 0, "rationale": "New bleeding after menopause is a red flag requiring evaluation."}];let order=Q.map((_,i)=>i),pos=0,score=0,answered=0;
const $=s=>document.querySelector(s);const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){let q=Q[order[pos]];$("#total").textContent=Q.length;$("#num").textContent=pos+1;$("#score").textContent=score;$("#acc").textContent=answered?Math.round(score/answered*100)+"%":"—";$("#bar").style.width=(pos/Q.length*100)+"%";
$("#stage").innerHTML=`<section class="card"><span class="chip">${esc(q.topic||"Clinical Judgment")}</span><div class="stem">${esc(q.stem)}</div><div class="options">${q.options.map((x,i)=>`<button class="opt" data-i="${i}">${esc(x)}</button>`).join("")}</div><div id="fb"></div></section>`;
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));}
function answer(i){let q=Q[order[pos]];document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(j===q.correct)b.classList.add("correct");if(j===i&&i!==q.correct)b.classList.add("wrong");});answered++;if(i===q.correct)score++;
$("#fb").innerHTML=`<div class="feedback"><b>${i===q.correct?"Correct":"Not quite"}</b><div class="why">${esc(q.rationale)}</div><div style="margin-top:12px"><button class="primary" id="next">${pos===Q.length-1?"Restart":"Next →"}</button></div></div>`;$("#score").textContent=score;$("#acc").textContent=Math.round(score/answered*100)+"%";$("#next").onclick=()=>{if(pos===Q.length-1){order.sort(()=>Math.random()-.5);pos=0;score=answered=0;}else pos++;render();};}
order.sort(()=>Math.random()-.5);render();</script><nav class="study-site-nav" aria-label="Study site navigation"><a href="index.html">← Day2 Home</a><a href="../index.html">Exam 3 Main</a></nav></body></html>
