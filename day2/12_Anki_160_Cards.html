<script>
const DECK=[{"id": 1, "topic": "STIs & Inclusive Reproductive Care", "front": "What six areas should guide a focused sexual-health history?", "answer": "Partners, Practices, Protection, Past STIs, Pregnancy intention, and current Symptoms/exposure concerns.", "why": "A structured, neutral history identifies exposure risk without making assumptions about identity or behavior.", "clinical": "Use permission-based, nonjudgmental language and select tests based on anatomy and exposure.", "tags": []}, {"id": 2, "topic": "STIs & Inclusive Reproductive Care", "front": "How should the nurse choose an STI specimen site?", "answer": "Match the specimen site to the client’s anatomy and sites of sexual exposure.", "why": "Urine or genital testing alone can miss rectal or pharyngeal infection.", "clinical": "Possible sites include urine, vaginal/cervical, urethral, rectal, pharyngeal, and blood testing.", "tags": []}, {"id": 3, "topic": "STIs & Inclusive Reproductive Care", "front": "Which common bacterial STIs are generally curable?", "answer": "Chlamydia, gonorrhea, and syphilis.", "why": "Bacterial infections can usually be eradicated with appropriate antimicrobial therapy, unlike HSV and HPV.", "clinical": "Treatment does not eliminate the need for partner management and prevention teaching.", "tags": []}, {"id": 4, "topic": "STIs & Inclusive Reproductive Care", "front": "Why can chlamydia be difficult to recognize clinically?", "answer": "It is frequently asymptomatic.", "why": "An infected client can transmit the organism and develop complications despite having few or no symptoms.", "clinical": "Screening and exposure-based testing matter even without symptoms.", "tags": []}, {"id": 5, "topic": "STIs & Inclusive Reproductive Care", "front": "What complications can untreated chlamydia cause?", "answer": "PID, infertility, and ectopic pregnancy.", "why": "Ascending infection can scar reproductive structures and impair tubal function.", "clinical": "Prompt treatment and partner management reduce recurrent exposure.", "tags": []}, {"id": 6, "topic": "STIs & Inclusive Reproductive Care", "front": "What is the expected medication for uncomplicated chlamydia in most nonpregnant adolescents/adults?", "answer": "Doxycycline PO for 7 days.", "why": "Doxycycline is effective against Chlamydia trachomatis.", "clinical": "Complete the entire regimen and follow partner/retesting recommendations.", "tags": []}, {"id": 7, "topic": "STIs & Inclusive Reproductive Care", "front": "What findings can occur with gonorrhea?", "answer": "Cervicitis, urethritis, dysuria, purulent drainage, and pelvic pain; infection may also be asymptomatic.", "why": "Symptoms overlap with chlamydia, so manifestations alone cannot reliably identify the organism.", "clinical": "Use appropriate swab/urine testing rather than treating the discharge appearance as diagnostic.", "tags": []}, {"id": 8, "topic": "STIs & Inclusive Reproductive Care", "front": "What medication is used to treat gonorrhea?", "answer": "Ceftriaxone IM.", "why": "Ceftriaxone is effective against Neisseria gonorrhoeae.", "clinical": "Testing for coexisting STIs and partner management remain important.", "tags": []}, {"id": 9, "topic": "STIs & Inclusive Reproductive Care", "front": "What additional serious complication can occur with untreated gonorrhea?", "answer": "Disseminated gonococcal infection.", "why": "Gonorrhea can spread beyond the local reproductive tract.", "clinical": "Mild local symptoms do not eliminate the risk of significant complications.", "tags": []}, {"id": 10, "topic": "STIs & Inclusive Reproductive Care", "front": "Why should a client with suspected chlamydia or gonorrhea often be tested for more than one STI?", "answer": "Symptoms overlap and coinfection can occur.", "why": "A discharge pattern or dysuria cannot reliably distinguish the organism.", "clinical": "Base testing on exposure and clinical risk rather than symptoms alone.", "tags": []}, {"id": 11, "topic": "STIs & Inclusive Reproductive Care", "front": "What is the classic lesion of primary syphilis?", "answer": "A painless chancre.", "why": "Primary syphilis often begins with a painless ulcer at the infection site.", "clinical": "Because it is painless, a client may overlook the lesion.", "tags": []}, {"id": 12, "topic": "STIs & Inclusive Reproductive Care", "front": "What findings characterize secondary syphilis?", "answer": "Mucosal lesions, a brown/red rash that can involve palms and soles, and systemic symptoms.", "why": "Secondary disease reflects systemic spread of infection.", "clinical": "A palm/sole rash is a high-yield clue when paired with syphilis exposure risk.", "tags": []}, {"id": 13, "topic": "STIs & Inclusive Reproductive Care", "front": "What defines latent syphilis?", "answer": "No clinical symptoms despite persistent infection.", "why": "Absence of symptoms does not mean the infection has resolved.", "clinical": "Treatment is still required to prevent later complications.", "tags": []}, {"id": 14, "topic": "STIs & Inclusive Reproductive Care", "front": "What severe problems can tertiary syphilis cause?", "answer": "Neurologic and cardiovascular injury such as stroke, blindness, dementia, aortic inflammation, and carotid stenosis.", "why": "Untreated infection can damage multiple organ systems over years or decades.", "clinical": "Late complications are a major reason early diagnosis and treatment matter.", "tags": []}, {"id": 15, "topic": "STIs & Inclusive Reproductive Care", "front": "Which screening tests are commonly used for syphilis?", "answer": "RPR or VDRL.", "why": "These are serologic tests used to detect evidence of syphilis infection.", "clinical": "Positive screening is interpreted with the overall diagnostic plan.", "tags": []}, {"id": 16, "topic": "STIs & Inclusive Reproductive Care", "front": "How is primary, secondary, or early latent syphilis treated?", "answer": "One dose of benzathine penicillin G IM.", "why": "Earlier stages require a shorter penicillin regimen than late latent disease.", "clinical": "Stage matters when determining the dosing schedule.", "tags": []}, {"id": 17, "topic": "STIs & Inclusive Reproductive Care", "front": "How is late latent syphilis treated?", "answer": "Three doses of benzathine penicillin G IM.", "why": "Longer-duration infection requires an extended treatment schedule.", "clinical": "Do not confuse the late-latent schedule with the single-dose early-stage regimen.", "tags": []}, {"id": 18, "topic": "STIs & Inclusive Reproductive Care", "front": "What is the key treatment principle for genital herpes?", "answer": "HSV can be managed but not eradicated.", "why": "The virus remains latent and can reactivate, causing recurrent manifestations.", "clinical": "Teach transmission reduction even when antiviral therapy controls symptoms.", "tags": []}, {"id": 19, "topic": "STIs & Inclusive Reproductive Care", "front": "What does acyclovir do for genital herpes?", "answer": "Reduces manifestations and transmission risk; it does not cure HSV.", "why": "Antiviral suppression decreases viral activity but does not remove latent virus.", "clinical": "Avoid sex during visible lesions and use condoms at other times to reduce transmission.", "tags": []}, {"id": 20, "topic": "STIs & Inclusive Reproductive Care", "front": "What are common genital herpes manifestations?", "answer": "Painful vesicles or ulcers, tingling/pain, and sometimes systemic symptoms.", "why": "Vesicular lesions are a classic clue for HSV.", "clinical": "Testing can include swabbing active vesicles.", "tags": []}, {"id": 21, "topic": "STIs & Inclusive Reproductive Care", "front": "What is the major long-term concern with high-risk HPV?", "answer": "Cancer risk, including cervical, anal, penile, vulvar, vaginal, and oropharyngeal cancers.", "why": "Persistent high-risk HPV can cause dysplastic cellular changes.", "clinical": "Screening targets abnormal tissue; treatment removes lesions but does not eradicate the virus.", "tags": []}, {"id": 22, "topic": "STIs & Inclusive Reproductive Care", "front": "Does HPV vaccination treat an existing HPV infection?", "answer": "No. It prevents new HPV infections.", "why": "Vaccination is preventive rather than therapeutic.", "clinical": "Routine vaccination begins in adolescence; catch-up and shared decision-making depend on age.", "tags": []}, {"id": 23, "topic": "STIs & Inclusive Reproductive Care", "front": "What is the HPV vaccination age framework?", "answer": "Routine at 11–12 years (may begin at 9), catch-up through 26, and shared decision-making for selected adults 27–45.", "why": "Vaccination is most effective before exposure but may still benefit some adults.", "clinical": "It prevents new infection rather than treating established HPV.", "tags": []}, {"id": 24, "topic": "STIs & Inclusive Reproductive Care", "front": "What discharge pattern suggests bacterial vaginosis?", "answer": "Thin gray/white discharge, fishy odor, and vaginal pH >4.5.", "why": "BV reflects altered vaginal flora and typically raises vaginal pH.", "clinical": "BV is not classified as an STI.", "tags": []}, {"id": 25, "topic": "STIs & Inclusive Reproductive Care", "front": "Which medications treat bacterial vaginosis?", "answer": "Metronidazole or clindamycin.", "why": "Both target organisms associated with BV.", "clinical": "Differentiate BV therapy from antifungal treatment for candidiasis.", "tags": []}, {"id": 26, "topic": "STIs & Inclusive Reproductive Care", "front": "What pattern suggests vulvovaginal candidiasis?", "answer": "Thick white discharge, intense itching/erythema, and usually normal pH ≤4.5.", "why": "Candida causes prominent vulvovaginal inflammation without the elevated pH typical of BV/trichomoniasis.", "clinical": "VVC is fungal and is not classified as an STI.", "tags": []}, {"id": 27, "topic": "STIs & Inclusive Reproductive Care", "front": "How is vulvovaginal candidiasis treated?", "answer": "Topical azoles; oral fluconazole may be used in selected nonpregnant clients.", "why": "Antifungal therapy targets Candida species.", "clinical": "Pregnancy status matters when selecting therapy.", "tags": []}, {"id": 28, "topic": "STIs & Inclusive Reproductive Care", "front": "What pattern suggests trichomoniasis?", "answer": "Frothy yellow-green discharge, pH >4.5, irritation, dysuria/dyspareunia, and sometimes a strawberry cervix.", "why": "Trichomonas is a protozoal infection that often produces inflammatory discharge.", "clinical": "Treat sex partners and prevent reinfection.", "tags": []}, {"id": 29, "topic": "STIs & Inclusive Reproductive Care", "front": "How is trichomoniasis treated in women?", "answer": "Metronidazole twice daily for 7 days.", "why": "Antiprotozoal therapy eradicates the infection when taken correctly.", "clinical": "Partners need treatment; avoid sex until treatment is completed and retest women at about 3 months.", "tags": []}, {"id": 30, "topic": "STIs & Inclusive Reproductive Care", "front": "What assessment cluster strongly suggests PID?", "answer": "Pelvic pain, cervical motion tenderness, abnormal bleeding/discharge, dyspareunia, and possibly fever.", "why": "PID is an ascending upper-reproductive-tract infection, often related to chlamydia/gonorrhea or polymicrobial infection.", "clinical": "Prompt treatment matters because scarring can cause infertility, ectopic pregnancy, and chronic pelvic pain.", "tags": []}, {"id": 31, "topic": "STIs & Inclusive Reproductive Care", "front": "Why can a positive STI test after prior successful treatment represent reinfection rather than treatment failure?", "answer": "An untreated or newly infected partner can re-expose the client.", "why": "Antimicrobial cure does not create immunity.", "clinical": "Partner evaluation/treatment and temporary abstinence are essential prevention measures.", "tags": []}, {"id": 32, "topic": "STIs & Inclusive Reproductive Care", "front": "Which infections are reportable in every U.S. state in this study set?", "answer": "Chlamydia, gonorrhea, syphilis, chancroid, and HIV.", "why": "Public-health reporting supports surveillance and partner/public-health interventions.", "clinical": "Maintain confidentiality and explain reporting requirements to clients.", "tags": []}, {"id": 33, "topic": "STIs & Inclusive Reproductive Care", "front": "What is the best basis for reproductive screening in a transgender client?", "answer": "Current anatomy, surgical history, hormones, sexual practices/exposure sites, pregnancy potential, and goals.", "why": "Gender identity alone does not reveal which organs are present or which sites are exposed.", "clinical": "Screen organs that are present and use the client’s name, pronouns, and neutral language.", "tags": []}, {"id": 34, "topic": "STIs & Inclusive Reproductive Care", "front": "Do gender-affirming hormones provide reliable contraception?", "answer": "No.", "why": "Amenorrhea does not guarantee infertility, and pregnancy may remain possible when reproductive anatomy permits it.", "clinical": "Discuss pregnancy intention and contraception when pregnancy is possible and undesired.", "tags": []}, {"id": 35, "topic": "STIs & Inclusive Reproductive Care", "front": "What postoperative problems require priority surveillance after gender-affirming surgery?", "answer": "Airway/hemodynamic instability, bleeding/hematoma, wound problems, urinary issues, infection, VTE, pain, and mobility limitations.", "why": "Early recognition of hemorrhage, infection, and thromboembolism prevents major postoperative deterioration.", "clinical": "Support privacy, autonomy, pain control, catheter/wound care, and early mobility.", "tags": []}, {"id": 36, "topic": "Pregnancy Foundations & Antepartum", "front": "Where does fertilization usually occur?", "answer": "The ampulla of the fallopian tube.", "why": "Sperm and ovum typically unite in the tube before the developing conceptus travels toward the uterus.", "clinical": "Implantation occurs later in the endometrium.", "tags": []}, {"id": 37, "topic": "Pregnancy Foundations & Antepartum", "front": "When does the embryonic period end?", "answer": "At the end of 8 weeks after fertilization.", "why": "Major organ development occurs during the embryonic period; after 8 completed weeks the developing baby is termed a fetus.", "clinical": "Early development is especially important because organ systems are forming.", "tags": []}, {"id": 38, "topic": "Pregnancy Foundations & Antepartum", "front": "What are the three major functions of the placenta?", "answer": "Oxygen/nutrient exchange, waste removal, and hormone production.", "why": "The placenta supports fetal growth while maintaining the pregnancy environment.", "clinical": "Placental dysfunction can therefore affect both fetal oxygenation and growth.", "tags": []}, {"id": 39, "topic": "Pregnancy Foundations & Antepartum", "front": "How many vessels are in a normal umbilical cord?", "answer": "Two arteries and one vein.", "why": "Umbilical vessels are named by direction of blood flow relative to the fetal heart.", "clinical": "The vein carries oxygenated blood toward the fetus; arteries carry deoxygenated blood away.", "tags": []}, {"id": 40, "topic": "Pregnancy Foundations & Antepartum", "front": "What are presumptive signs of pregnancy?", "answer": "Subjective changes experienced by the client: amenorrhea, nausea, breast changes, fatigue, and perceived fetal movement.", "why": "These findings suggest pregnancy but can have other causes.", "clinical": "They do not confirm a fetus.", "tags": []}, {"id": 41, "topic": "Pregnancy Foundations & Antepartum", "front": "What are probable signs of pregnancy?", "answer": "Objective findings such as a positive pregnancy test and uterine/cervical changes.", "why": "These findings increase the likelihood of pregnancy but are not definitive fetal evidence.", "clinical": "A positive test can still require clinical confirmation.", "tags": []}, {"id": 42, "topic": "Pregnancy Foundations & Antepartum", "front": "What are positive signs of pregnancy?", "answer": "Fetal cardiac activity, ultrasound visualization of the fetus, or fetal movement palpated by the examiner.", "why": "These findings directly demonstrate the fetus.", "clinical": "Use positive signs when the question asks what confirms pregnancy.", "tags": []}, {"id": 43, "topic": "Pregnancy Foundations & Antepartum", "front": "How is Nägele’s rule used?", "answer": "From the first day of the LMP: subtract 3 months, add 7 days, and adjust the year.", "why": "It provides an estimated date of delivery based on a regular menstrual cycle.", "clinical": "Accurate LMP history improves the estimate.", "tags": []}, {"id": 44, "topic": "Pregnancy Foundations & Antepartum", "front": "What does GTPAL stand for?", "answer": "Gravida, Term births, Preterm births, Abortions/losses before about 20 weeks, Living children.", "why": "GTPAL separates pregnancy history into clinically meaningful outcomes.", "clinical": "Multiple births count as one pregnancy/birth event for T or P but each living child counts in L.", "tags": []}, {"id": 45, "topic": "Pregnancy Foundations & Antepartum", "front": "Which routine labs/tests are common in prenatal care?", "answer": "CBC/Hgb, blood type/Rh, antibody screen, urinalysis/culture, rubella, genetic testing as appropriate, glucose testing, hepatitis, HIV, syphilis, GC/chlamydia, and later GBS.", "why": "Baseline screening identifies anemia, incompatibility, infection, metabolic risk, and other threats before complications develop.", "clinical": "Prenatal testing is preventive surveillance, not just diagnosis after symptoms occur.", "tags": []}, {"id": 46, "topic": "Pregnancy Foundations & Antepartum", "front": "Around midpregnancy, how should fundal height relate to gestational age?", "answer": "Fundal height in centimeters is roughly similar to gestational weeks.", "why": "Serial measurements provide a simple trend of uterine/fetal growth.", "clinical": "Unexpected trends warrant further assessment rather than diagnosis from one measurement alone.", "tags": []}, {"id": 47, "topic": "Pregnancy Foundations & Antepartum", "front": "Which common pregnancy changes are usually expected?", "answer": "Mild nausea, heartburn, urinary frequency, fatigue, mild back discomfort, and mild dependent edema.", "why": "Pregnancy alters cardiovascular, GI, urinary, musculoskeletal, and endocrine physiology.", "clinical": "Expected discomforts still need context; severe or sudden changes may be warning signs.", "tags": []}, {"id": 48, "topic": "Pregnancy Foundations & Antepartum", "front": "Which pregnancy symptoms require prompt evaluation?", "answer": "Vaginal bleeding, fluid leakage, persistent severe headache, vision changes, severe abdominal/epigastric pain, dyspnea, markedly decreased fetal movement, or regular contractions before 37 weeks.", "why": "These findings can indicate hemorrhage, membrane rupture, hypertensive disease, fetal compromise, or preterm labor.", "clinical": "Teach warning signs before they occur so clients know when to seek care.", "tags": []}, {"id": 49, "topic": "Pregnancy Foundations & Antepartum", "front": "What are the core health-promotion priorities during pregnancy?", "answer": "Balanced nutrition, prenatal vitamins/folic acid, avoiding alcohol/nicotine/drugs, food safety, activity, medication review, dental care, vaccination, and knowing warning signs.", "why": "Preventive behaviors reduce modifiable maternal and fetal risks.", "clinical": "Medication and supplement safety should be reviewed rather than assumed.", "tags": []}, {"id": 50, "topic": "High-Risk Pregnancy & Preterm Labor", "front": "When is routine gestational-diabetes screening commonly performed?", "answer": "Around 24–28 weeks, with earlier screening when risk is elevated.", "why": "Pregnancy-related insulin resistance becomes more prominent as gestation advances.", "clinical": "Early risk recognition allows earlier glucose management.", "tags": []}, {"id": 51, "topic": "High-Risk Pregnancy & Preterm Labor", "front": "What are the main management components for gestational diabetes?", "answer": "Glucose monitoring, nutrition, activity, medication if needed, and fetal surveillance.", "why": "Maternal glucose control reduces complications while surveillance tracks fetal effects.", "clinical": "Therapy may escalate without stopping nutrition or monitoring.", "tags": []}, {"id": 52, "topic": "High-Risk Pregnancy & Preterm Labor", "front": "What fetal/newborn complications are associated with gestational diabetes?", "answer": "Large-for-gestational-age growth, birth complications, and neonatal hypoglycemia.", "why": "Maternal hyperglycemia increases fetal insulin exposure and growth; after birth, persistent fetal insulin can lower newborn glucose.", "clinical": "Monitor both fetal growth and neonatal glucose risk.", "tags": []}, {"id": 53, "topic": "High-Risk Pregnancy & Preterm Labor", "front": "Which findings raise concern for preeclampsia?", "answer": "Hypertension with persistent severe headache, visual changes, RUQ/epigastric pain, dyspnea, renal/liver abnormalities, or thrombocytopenia.", "why": "These findings suggest maternal organ involvement rather than uncomplicated hypertension.", "clinical": "Severe disease can progress to seizure, stroke, abruption, and maternal/fetal compromise.", "tags": []}, {"id": 54, "topic": "High-Risk Pregnancy & Preterm Labor", "front": "What is the classic placenta previa pattern?", "answer": "Bright-red painless bleeding with a soft, nontender uterus.", "why": "Placental tissue near the cervical opening can bleed without the painful uterine irritation typical of abruption.", "clinical": "Avoid digital vaginal examination until previa is excluded.", "tags": []}, {"id": 55, "topic": "High-Risk Pregnancy & Preterm Labor", "front": "Why is a digital vaginal exam avoided when placenta previa is suspected?", "answer": "It can disrupt placental tissue and provoke severe hemorrhage.", "why": "The placenta may overlie or lie near the cervix.", "clinical": "Use ultrasound to assess placental location before any potentially disruptive examination.", "tags": []}, {"id": 56, "topic": "High-Risk Pregnancy & Preterm Labor", "front": "What is the classic placental abruption pattern?", "answer": "Painful bleeding that may be dark or concealed, with a tender, firm/board-like uterus and possible fetal distress.", "why": "Premature placental separation causes uterine irritation and can compromise maternal circulation and fetal oxygenation.", "clinical": "Shock can be worse than visible blood loss because bleeding may be concealed.", "tags": []}, {"id": 57, "topic": "High-Risk Pregnancy & Preterm Labor", "front": "What are immediate nursing priorities for suspected placental abruption with instability?", "answer": "Maternal ABC/hemodynamic stabilization, fetal assessment, large-bore IV access, CBC/coagulation studies/type and crossmatch, and preparation for urgent birth when indicated.", "why": "Abruption can threaten both maternal circulation and fetal oxygenation simultaneously.", "clinical": "Do not delay stabilization while waiting for visible bleeding or imaging.", "tags": []}, {"id": 58, "topic": "High-Risk Pregnancy & Preterm Labor", "front": "What defines preterm labor?", "answer": "Regular uterine contractions causing cervical change before 37 completed weeks.", "why": "Contractions alone do not establish preterm labor unless cervical change occurs.", "clinical": "Assess contraction pattern, cervical change, membrane status, and maternal-fetal condition.", "tags": []}, {"id": 59, "topic": "High-Risk Pregnancy & Preterm Labor", "front": "What are common cues of preterm labor?", "answer": "Regular contractions, menstrual-like cramps, pelvic pressure, low backache, increased/change in discharge, spotting/bleeding, or fluid leakage.", "why": "Preterm labor can begin with subtle symptoms rather than dramatic pain.", "clinical": "Teach clients to report these findings before 37 weeks.", "tags": []}, {"id": 60, "topic": "High-Risk Pregnancy & Preterm Labor", "front": "What is the purpose of antenatal corticosteroids in threatened preterm birth?", "answer": "Promote fetal organ maturation.", "why": "Accelerating maturation improves the fetus’s ability to adapt if birth occurs early.", "clinical": "Do not confuse corticosteroid purpose with tocolysis or magnesium neuroprotection.", "tags": []}, {"id": 61, "topic": "High-Risk Pregnancy & Preterm Labor", "front": "What is the purpose of tocolytics in preterm labor?", "answer": "To delay birth briefly when clinically appropriate.", "why": "A short delay can create time for fetal-benefit therapy or transfer to higher-level neonatal care.", "clinical": "Tocolytics do not permanently stop preterm labor.", "tags": []}, {"id": 62, "topic": "High-Risk Pregnancy & Preterm Labor", "front": "What is the purpose of magnesium sulfate when very preterm birth is anticipated?", "answer": "Fetal neuroprotection.", "why": "Magnesium can reduce risk of neurologic injury when birth is expected at very early gestation.", "clinical": "Its role differs from corticosteroid fetal maturation and tocolytic delay.", "tags": []}, {"id": 63, "topic": "High-Risk Pregnancy & Preterm Labor", "front": "What reversible contributors to uterine activity may need treatment during preterm-labor evaluation?", "answer": "Infection and dehydration.", "why": "Correcting contributors may reduce uterine irritability, but does not eliminate the need to assess for true cervical change.", "clinical": "Continue maternal-fetal evaluation while treating contributing conditions.", "tags": []}, {"id": 64, "topic": "High-Risk Pregnancy & Preterm Labor", "front": "Why might a client with threatened very preterm birth be transferred?", "answer": "To access a higher level of neonatal care before delivery when feasible.", "why": "A very premature newborn may require advanced respiratory, thermal, nutritional, and intensive-care support.", "clinical": "Maternal stabilization and safe transfer planning occur together.", "tags": []}, {"id": 65, "topic": "Preterm Newborn & Thermoregulation", "front": "What defines a preterm newborn?", "answer": "Birth before 37 completed weeks of gestation.", "why": "Organ immaturity increases as gestational age decreases.", "clinical": "Expect vulnerabilities in respiration, temperature, glucose, feeding, immunity, skin, and neurologic function.", "tags": []}, {"id": 66, "topic": "Preterm Newborn & Thermoregulation", "front": "What is the first physiologic priority in a symptomatic preterm newborn?", "answer": "Respiratory stability.", "why": "Immature lungs, surfactant deficiency, and immature respiratory control can quickly compromise oxygenation.", "clinical": "Assess airway/breathing and support oxygenation before routine feeding.", "tags": []}, {"id": 67, "topic": "Preterm Newborn & Thermoregulation", "front": "Which signs suggest respiratory distress in a preterm newborn?", "answer": "Tachypnea, grunting, retractions, nasal flaring, cyanosis, or low oxygen saturation.", "why": "These signs reflect increased work of breathing and impaired gas exchange.", "clinical": "Escalate respiratory support according to severity.", "tags": []}, {"id": 68, "topic": "Preterm Newborn & Thermoregulation", "front": "Why are preterm newborns at risk for respiratory distress syndrome?", "answer": "Immature lungs may produce inadequate surfactant.", "why": "Surfactant lowers alveolar surface tension; deficiency promotes alveolar collapse and poor gas exchange.", "clinical": "Support may include oxygen, CPAP/ventilation, and surfactant when indicated.", "tags": []}, {"id": 69, "topic": "Preterm Newborn & Thermoregulation", "front": "Why are preterm newborns prone to hypothermia?", "answer": "Thin skin, little subcutaneous fat, limited brown fat, large surface-area-to-mass ratio, and immature temperature control.", "why": "They lose heat easily and have limited reserves for heat production.", "clinical": "Dry promptly, use hats/blankets, skin-to-skin when stable, and controlled external warming.", "tags": []}, {"id": 70, "topic": "Preterm Newborn & Thermoregulation", "front": "What is evaporation heat loss?", "answer": "Heat lost when moisture on the skin turns to vapor.", "why": "Evaporation consumes heat from the newborn’s body.", "clinical": "Dry the newborn promptly and remove wet linens.", "tags": []}, {"id": 71, "topic": "Preterm Newborn & Thermoregulation", "front": "What is conduction heat loss?", "answer": "Heat transferred from the newborn to a colder surface through direct contact.", "why": "Direct contact with cold scales, mattresses, or equipment draws away body heat.", "clinical": "Warm surfaces before contact.", "tags": []}, {"id": 72, "topic": "Preterm Newborn & Thermoregulation", "front": "What is convection heat loss?", "answer": "Heat lost to cooler surrounding air.", "why": "Drafts and cool room air remove heat from the newborn.", "clinical": "Reduce drafts and maintain an appropriate environmental temperature.", "tags": []}, {"id": 73, "topic": "Preterm Newborn & Thermoregulation", "front": "What is radiation heat loss?", "answer": "Heat transferred to a nearby colder object without direct contact.", "why": "A newborn can lose heat to cold windows or walls even without touching them.", "clinical": "Position the infant away from cold surfaces.", "tags": []}, {"id": 74, "topic": "Preterm Newborn & Thermoregulation", "front": "Why is cold stress dangerous in a preterm newborn?", "answer": "It increases metabolic rate, oxygen consumption, and glucose use.", "why": "The infant spends limited energy reserves generating heat, which can contribute to hypoglycemia, respiratory distress, and metabolic acidosis.", "clinical": "Temperature instability can worsen other physiologic problems rather than remaining an isolated issue.", "tags": []}, {"id": 75, "topic": "Preterm Newborn & Thermoregulation", "front": "What can cause hyperthermia in a preterm newborn?", "answer": "Excess environmental heat, overbundling, warmer/incubator settings, dehydration, or infection.", "why": "High temperature is not always infection; environmental causes must also be assessed.", "clinical": "Check environment, hydration, and signs of infection before assuming one cause.", "tags": []}, {"id": 76, "topic": "Preterm Newborn & Thermoregulation", "front": "Why are preterm infants at risk during oral feeding?", "answer": "Suck-swallow-breathe coordination may be immature.", "why": "Poor coordination increases aspiration risk and can limit calorie intake and growth.", "clinical": "Assess feeding readiness; gavage or parenteral nutrition may be needed.", "tags": []}, {"id": 77, "topic": "Preterm Newborn & Thermoregulation", "front": "What should the nurse monitor when feeding a preterm newborn?", "answer": "Feeding readiness/tolerance, glucose, intake/output, daily weight, and signs of aspiration.", "why": "Nutrition and glucose stability are linked to growth and physiologic reserve.", "clinical": "Human milk is beneficial; route depends on developmental readiness.", "tags": []}, {"id": 78, "topic": "Preterm Newborn & Thermoregulation", "front": "What major complications are associated with prematurity?", "answer": "RDS, BPD, apnea, PDA, IVH, NEC, ROP, infection/sepsis, hypoglycemia, and anemia.", "why": "Multiple immature organ systems are vulnerable after early birth.", "clinical": "Recognize the system involved: lung, heart, brain, gut, eye, immune/metabolic, or hematologic.", "tags": []}, {"id": 79, "topic": "Preterm Newborn & Thermoregulation", "front": "What does NEC stand for and which system does it affect?", "answer": "Necrotizing enterocolitis; the gastrointestinal system.", "why": "NEC is a serious intestinal complication of prematurity.", "clinical": "New abdominal or feeding intolerance findings in a preterm infant warrant prompt evaluation.", "tags": []}, {"id": 80, "topic": "Preterm Newborn & Thermoregulation", "front": "What does IVH stand for?", "answer": "Intraventricular hemorrhage.", "why": "Fragile cerebral vessels in premature infants are vulnerable to bleeding.", "clinical": "Neurologic complications are a major concern in very preterm newborns.", "tags": []}, {"id": 81, "topic": "Preterm Newborn & Thermoregulation", "front": "What does ROP stand for?", "answer": "Retinopathy of prematurity.", "why": "Premature retinal development places the infant at risk for abnormal retinal changes.", "clinical": "ROP is the major eye complication to associate with prematurity.", "tags": []}, {"id": 82, "topic": "Preterm Newborn & Thermoregulation", "front": "How can nurses reduce infection risk in a preterm newborn?", "answer": "Meticulous hand hygiene, aseptic technique, minimizing unnecessary invasive procedures, and monitoring lines/sites and subtle condition changes.", "why": "Immature immune defenses increase infection vulnerability, and infection may present subtly.", "clinical": "Absence of dramatic fever does not rule out infection.", "tags": []}, {"id": 83, "topic": "Preterm Newborn & Thermoregulation", "front": "How should fragile preterm skin be protected?", "answer": "Use gentle care, minimize adhesive trauma, monitor line/device sites, reposition appropriately, and preserve skin integrity.", "why": "Immature skin is thin and easily injured.", "clinical": "Skin breakdown can become both a pain and infection risk.", "tags": []}, {"id": 84, "topic": "Preterm Newborn & Thermoregulation", "front": "How can parents support bonding with a stable preterm infant?", "answer": "Skin-to-skin contact, touch, voice, participation in care, and feeding when appropriate.", "why": "Parental involvement supports attachment and confidence despite the technology-heavy environment.", "clinical": "Explain equipment and invite participation rather than treating parents as visitors.", "tags": []}, {"id": 85, "topic": "Preterm Newborn & Thermoregulation", "front": "What outcomes suggest preterm discharge readiness?", "answer": "Stable oxygenation, temperature, glucose, nutrition/growth, intact skin/no preventable infection, adequate elimination, and caregiver readiness.", "why": "Safe discharge requires both physiologic stability and family ability to continue care.", "clinical": "Teaching and caregiver participation should begin before discharge day.", "tags": []}, {"id": 86, "topic": "Family Planning, Abortion & Preconception", "front": "What should contraception counseling begin with?", "answer": "The client’s reproductive goal: avoid, delay, space, become pregnant, or unsure.", "why": "Method selection is patient-centered and should match the person’s goals and values.", "clinical": "Then assess safety, effectiveness, reversibility, side effects, STI protection, and ability to use the method consistently.", "tags": []}, {"id": 87, "topic": "Family Planning, Abortion & Preconception", "front": "Which reversible contraceptive methods are among the most effective with typical use?", "answer": "Implants and IUDs.", "why": "Long-acting methods require little ongoing user action, reducing typical-use failure from missed doses or incorrect use.", "clinical": "Effectiveness and STI protection are separate issues.", "tags": []}, {"id": 88, "topic": "Family Planning, Abortion & Preconception", "front": "Which contraceptive method also reduces STI transmission risk?", "answer": "Condoms.", "why": "Barrier protection can reduce exposure to infectious secretions.", "clinical": "Other highly effective pregnancy-prevention methods do not provide STI protection.", "tags": []}, {"id": 89, "topic": "Family Planning, Abortion & Preconception", "front": "What makes fertility-awareness methods more user-dependent?", "answer": "They require consistent tracking of fertility signs/cycles and avoiding unprotected intercourse during the fertile window.", "why": "Effectiveness depends heavily on correct and consistent use and becomes less predictable with irregular cycles.", "clinical": "These methods do not protect against STIs.", "tags": []}, {"id": 90, "topic": "Family Planning, Abortion & Preconception", "front": "What should be assessed before combined hormonal contraception?", "answer": "Blood pressure, smoking, migraine with aura, thromboembolism history, and cardiovascular risk.", "why": "Estrogen can increase vascular/thrombotic risk in susceptible clients.", "clinical": "Safety screening is essential even when the client prefers the method.", "tags": []}, {"id": 91, "topic": "Family Planning, Abortion & Preconception", "front": "What does ACHES stand for in combined hormonal contraception teaching?", "answer": "Severe Abdominal pain, Chest pain/SOB, severe Headache/new neurologic symptoms, Eye/vision changes, Severe leg pain/swelling.", "why": "ACHES symptoms can signal serious vascular or thromboembolic complications.", "clinical": "These are warning signs requiring prompt evaluation, not routine side effects.", "tags": []}, {"id": 92, "topic": "Family Planning, Abortion & Preconception", "front": "What are common effects of progestin-only contraception?", "answer": "Irregular bleeding or amenorrhea.", "why": "Progestin alters the endometrium and ovulatory patterns; timing/adherence requirements vary by method.", "clinical": "Progestin-only methods do not provide STI protection.", "tags": []}, {"id": 93, "topic": "Family Planning, Abortion & Preconception", "front": "How do copper and levonorgestrel IUDs differ in bleeding effects?", "answer": "Copper may increase bleeding/cramping; levonorgestrel often decreases bleeding.", "why": "Copper is nonhormonal, while levonorgestrel produces local progestin effects on the endometrium.", "clinical": "Baseline menstrual concerns can influence method choice.", "tags": []}, {"id": 94, "topic": "Family Planning, Abortion & Preconception", "front": "What bleeding pattern is common with the contraceptive implant?", "answer": "Irregular bleeding.", "why": "The progestin implant is highly effective and reversible but can alter bleeding unpredictably.", "clinical": "Prepare clients for expected changes to support continuation and informed choice.", "tags": []}, {"id": 95, "topic": "Family Planning, Abortion & Preconception", "front": "Why is vasectomy not immediately effective contraception?", "answer": "Sperm can remain in the reproductive tract after the procedure.", "why": "Sterility is not instantaneous even though the procedure is intended to be permanent.", "clinical": "Use backup contraception until effectiveness is confirmed.", "tags": []}, {"id": 96, "topic": "Family Planning, Abortion & Preconception", "front": "Which emergency-contraception option can also provide years of ongoing contraception?", "answer": "Copper IUD inserted within 5 days.", "why": "It can prevent pregnancy after recent unprotected intercourse and then remain as highly effective nonhormonal contraception.", "clinical": "It does not protect against STIs.", "tags": []}, {"id": 97, "topic": "Family Planning, Abortion & Preconception", "front": "How is ulipristal used for emergency contraception?", "answer": "Take as soon as possible within 5 days after unprotected intercourse or contraceptive failure.", "why": "Emergency contraception is time-sensitive and works before an established pregnancy.", "clinical": "It does not provide STI protection.", "tags": []}, {"id": 98, "topic": "Family Planning, Abortion & Preconception", "front": "How is levonorgestrel used for emergency contraception?", "answer": "Take as soon as possible; it may be used within 5 days.", "why": "Earlier use improves the opportunity to prevent pregnancy after contraceptive failure.", "clinical": "It is not medication abortion.", "tags": []}, {"id": 99, "topic": "Family Planning, Abortion & Preconception", "front": "What is the medication sequence for medication abortion?", "answer": "Mifepristone followed by misoprostol.", "why": "The medications work together to end and expel an early pregnancy.", "clinical": "Cramping, bleeding, and passage of tissue are expected; follow-up remains important.", "tags": []}, {"id": 100, "topic": "Family Planning, Abortion & Preconception", "front": "Which symptoms can be expected after medication abortion?", "answer": "Cramping, bleeding, tissue passage, and temporary nausea, diarrhea, or chills.", "why": "These reflect the physiologic effects of the medications.", "clinical": "Severity matters when distinguishing expected effects from complications.", "tags": []}, {"id": 101, "topic": "Family Planning, Abortion & Preconception", "front": "Which symptoms after abortion require urgent evaluation?", "answer": "Excessive bleeding, syncope/hemodynamic symptoms, severe or worsening pain, or persistent fever/signs of infection.", "why": "These findings can indicate hemorrhage, retained tissue, or infection rather than routine recovery.", "clinical": "Teach warning signs clearly before discharge.", "tags": []}, {"id": 102, "topic": "Family Planning, Abortion & Preconception", "front": "What are the major goals of preconception care?", "answer": "Optimize chronic conditions, review medications/supplements, update immunizations, take folic acid, address STI risk, improve nutrition/weight, avoid alcohol/nicotine/drugs, and assess genetic/family risks.", "why": "Improving health before conception reduces preventable pregnancy risks.", "clinical": "Ask about pregnancy intention before giving preconception counseling.", "tags": []}, {"id": 103, "topic": "Family Planning, Abortion & Preconception", "front": "What biologic factors are required for conception?", "answer": "Ovulation, viable sperm, a patent reproductive tract, fertilization, and implantation.", "why": "Infertility can result from problems at multiple steps rather than from one partner alone.", "clinical": "Evaluation should consider both partners when applicable.", "tags": []}, {"id": 104, "topic": "Family Planning, Abortion & Preconception", "front": "When is infertility evaluation generally considered for someone younger than 35 without major risk factors?", "answer": "After 12 months of regular unprotected intercourse without pregnancy.", "why": "Time-based evaluation balances normal variation in conception with the need to identify reproductive problems.", "clinical": "Evaluate earlier when significant risk factors are present.", "tags": []}, {"id": 105, "topic": "Family Planning, Abortion & Preconception", "front": "When is infertility evaluation generally considered when maternal age is over 35?", "answer": "After about 6 months of regular unprotected intercourse without pregnancy.", "why": "Fertility declines with age, so waiting a full year can unnecessarily delay evaluation.", "clinical": "More prompt evaluation may be appropriate over age 40 or with significant risk factors.", "tags": []}, {"id": 106, "topic": "Family Planning, Abortion & Preconception", "front": "What factors may prompt earlier infertility evaluation?", "answer": "Irregular/absent ovulation, endometriosis, prior pelvic infection, known reproductive disorders, or suspected male-factor problems.", "why": "Known risks can reduce the value of waiting for the usual time threshold.", "clinical": "Avoid blame; explain the purpose of testing and support shared decisions.", "tags": []}, {"id": 107, "topic": "Family Planning, Abortion & Preconception", "front": "What is assessed in a female infertility evaluation?", "answer": "Ovulation, ovarian function/reserve, uterine factors, tubal patency, and endometriosis/pelvic factors.", "why": "Pregnancy requires coordinated ovulation, transport, fertilization, and implantation.", "clinical": "Testing should answer which step may be impaired.", "tags": []}, {"id": 108, "topic": "Family Planning, Abortion & Preconception", "front": "What is assessed in a male infertility evaluation?", "answer": "Semen/sperm factors, reproductive anatomy, hormonal/medical issues, medications, and exposures.", "why": "Male-factor infertility can contribute to difficulty conceiving and should not be ignored.", "clinical": "Use neutral language and include both partners when clinically applicable.", "tags": []}, {"id": 109, "topic": "Sexuality & Reproductive Foundations", "front": "What domains make sexuality a holistic health concept?", "answer": "Biologic, psychological, relational, sociocultural, and health-related factors.", "why": "Sexual concerns rarely have only one possible cause.", "clinical": "Assess goals, comfort, safety, symptoms, health context, and function without assumptions.", "tags": []}, {"id": 110, "topic": "Sexuality & Reproductive Foundations", "front": "What communication techniques support a therapeutic sexual-health assessment?", "answer": "Normalize the topic, ask permission, use neutral language, explain why questions are asked, protect privacy, and give the client control to pause or stop.", "why": "Respectful communication improves accuracy and reduces shame or defensiveness.", "clinical": "Avoid facial reactions, judgment, assumptions, or unnecessary probing.", "tags": []}, {"id": 111, "topic": "Sexuality & Reproductive Foundations", "front": "What phases can occur in the sexual response cycle?", "answer": "Desire, arousal, orgasm, and resolution.", "why": "The sequence is variable and may be nonlinear.", "clinical": "Assess the specific domain affected rather than assuming all sexual-function concerns are the same.", "tags": []}, {"id": 112, "topic": "Sexuality & Reproductive Foundations", "front": "What factors can alter sexual function?", "answer": "Pain, hormones, illness/fatigue, medications/substances, mood/stress, body image, relationship factors, trauma/safety, and culture/values.", "why": "Sexual function is influenced by interacting biologic and psychosocial factors.", "clinical": "Clarify onset and impact before assigning a cause.", "tags": []}, {"id": 113, "topic": "Sexuality & Reproductive Foundations", "front": "What are the primary reproductive functions of the ovaries?", "answer": "Produce ova and secrete estrogen and progesterone.", "why": "Ovarian hormones regulate the menstrual cycle and prepare the reproductive system for pregnancy.", "clinical": "Ovarian function affects both fertility and menstrual patterns.", "tags": []}, {"id": 114, "topic": "Sexuality & Reproductive Foundations", "front": "What is the function of the fallopian tubes?", "answer": "Capture and transport the ovum and provide the usual site of fertilization.", "why": "Tubal patency is essential for sperm and ovum to meet and for the conceptus to reach the uterus.", "clinical": "Tubal damage can contribute to infertility or ectopic pregnancy.", "tags": []}, {"id": 115, "topic": "Sexuality & Reproductive Foundations", "front": "What is the function of the endometrium?", "answer": "It is the uterine lining that proliferates, becomes secretory, supports implantation, and sheds during menstruation when pregnancy does not occur.", "why": "Hormonal changes across the cycle alter endometrial structure.", "clinical": "Bleeding patterns often reflect changes in endometrial stimulation.", "tags": []}, {"id": 116, "topic": "Sexuality & Reproductive Foundations", "front": "What does FSH do in the menstrual cycle?", "answer": "Stimulates follicular development and supports estrogen production.", "why": "Growing follicles increase estrogen during the follicular phase.", "clinical": "FSH acts before the LH surge that triggers ovulation.", "tags": []}, {"id": 117, "topic": "Sexuality & Reproductive Foundations", "front": "What does the LH surge trigger?", "answer": "Ovulation and subsequent corpus luteum formation.", "why": "The LH surge marks the transition from follicular development to ovulation/luteal function.", "clinical": "Ovulation is associated with clearer, slippery, stretchable cervical mucus.", "tags": []}, {"id": 118, "topic": "Sexuality & Reproductive Foundations", "front": "What is progesterone’s major role after ovulation?", "answer": "Maintain a secretory endometrium and support the luteal phase.", "why": "Progesterone prepares the endometrium for possible implantation and thickens cervical mucus.", "clinical": "If pregnancy does not occur, ovarian hormone levels fall and menstruation begins.", "tags": []}, {"id": 119, "topic": "Sexuality & Reproductive Foundations", "front": "What marks Day 1 of the menstrual cycle?", "answer": "The first day of menstrual bleeding.", "why": "Cycle length is counted from the first day of one period to the first day of the next.", "clinical": "Adult cycles commonly range about 21–35 days.", "tags": []}, {"id": 120, "topic": "Sexuality & Reproductive Foundations", "front": "What cervical-mucus change is associated with ovulation?", "answer": "Clear, slippery, stretchable mucus.", "why": "Estrogen around ovulation makes mucus more favorable to sperm passage.", "clinical": "This is one fertility-awareness cue.", "tags": []}, {"id": 121, "topic": "Sexuality & Reproductive Foundations", "front": "What is the first priority when evaluating amenorrhea in someone who could be pregnant?", "answer": "Pregnancy testing.", "why": "Pregnancy is a common and clinically important cause of missed menses that should be addressed before many endocrine explanations.", "clinical": "Then assess cycle history, contraception, symptoms, medications, weight/exercise, stress, and endocrine factors.", "tags": []}, {"id": 122, "topic": "Sexuality & Reproductive Foundations", "front": "When does dysmenorrhea warrant evaluation for a secondary cause?", "answer": "When pain is new, severe, progressive, or accompanied by concerning symptoms.", "why": "A change from the client’s usual pattern can suggest underlying pelvic pathology.", "clinical": "Assess severity, function, timing, and associated symptoms.", "tags": []}, {"id": 123, "topic": "Sexuality & Reproductive Foundations", "front": "What makes abnormal uterine bleeding clinically important?", "answer": "Heavy, prolonged, frequent, irregular, or intermenstrual bleeding can cause anemia or signal pregnancy-related or structural disease.", "why": "Severity depends on blood loss, hemodynamic status, pregnancy possibility, and associated symptoms.", "clinical": "Quantify bleeding and assess stability rather than relying on pain alone.", "tags": []}, {"id": 124, "topic": "Sexuality & Reproductive Foundations", "front": "What is a key safety concern with severe PMS/PMDD symptoms?", "answer": "Severe depression or other safety concerns.", "why": "PMDD can significantly impair mood and function in the premenstrual phase.", "clinical": "Assess timing, severity, functional impact, and safety.", "tags": []}, {"id": 125, "topic": "Sexuality & Reproductive Foundations", "front": "What findings suggest endometriosis?", "answer": "Chronic/cyclic pelvic pain, dysmenorrhea, dyspareunia, bowel/bladder pain, and infertility.", "why": "Ectopic endometrial-like tissue can produce inflammation and pain that often tracks with the menstrual cycle.", "clinical": "Assess pain pattern, function, coping, and fertility goals.", "tags": []}, {"id": 126, "topic": "Sexuality & Reproductive Foundations", "front": "What findings suggest uterine fibroids?", "answer": "Heavy/prolonged bleeding, cramping, pelvic pressure/fullness, urinary or bowel pressure, and anemia.", "why": "Fibroids are structural uterine growths that can increase bleeding and exert mass effect.", "clinical": "CBC can assess anemia; ultrasound can evaluate structural pathology.", "tags": []}, {"id": 127, "topic": "Sexuality & Reproductive Foundations", "front": "Which test is especially useful for structural pelvic problems such as fibroids?", "answer": "Transvaginal ultrasound.", "why": "Ultrasound visualizes uterine and adnexal structures rather than screening cervical cells.", "clinical": "Match the diagnostic test to the clinical question.", "tags": []}, {"id": 128, "topic": "Sexuality & Reproductive Foundations", "front": "What is the role of a Pap/HPV test?", "answer": "Cervical cancer screening according to age/history/risk recommendations.", "why": "Cervical screening is preventive and does not diagnose every cause of pelvic pain, bleeding, or discharge.", "clinical": "Do not substitute Pap/HPV testing for symptom-directed evaluation.", "tags": []}, {"id": 129, "topic": "Sexuality & Reproductive Foundations", "front": "What symptoms are common in perimenopause?", "answer": "Irregular cycles, hot flashes/night sweats, sleep or mood changes, vaginal dryness, and urinary symptoms.", "why": "Hormonal variability occurs before the final menstrual period.", "clinical": "Intermittent menses mean the client has not yet met the definition of menopause.", "tags": []}, {"id": 130, "topic": "Sexuality & Reproductive Foundations", "front": "How is menopause defined?", "answer": "12 months without menstruation when no other cause explains the amenorrhea.", "why": "The definition is retrospective after a full year without menses.", "clinical": "New bleeding after menopause is not considered a routine return of menstruation.", "tags": []}, {"id": 131, "topic": "Sexuality & Reproductive Foundations", "front": "What is the key red flag after menopause?", "answer": "Any new postmenopausal bleeding.", "why": "Bleeding after menopause requires diagnostic evaluation even when painless.", "clinical": "Do not wait for bleeding to become heavy or painful.", "tags": []}, {"id": 132, "topic": "Sexuality & Reproductive Foundations", "front": "Does older age eliminate the need for sexual-health assessment?", "answer": "No.", "why": "Sexuality continues across the lifespan and can be affected by health conditions, medications, intimacy, partner changes, and STI risk.", "clinical": "Ask rather than assuming sexual inactivity.", "tags": []}, {"id": 133, "topic": "Sexuality & Reproductive Foundations", "front": "How should the nurse begin evaluating a new sexual-function concern?", "answer": "Clarify whether the problem involves desire, arousal, orgasm, pain, satisfaction, fertility, or body image and determine onset/impact.", "why": "Defining the affected domain guides the rest of the assessment.", "clinical": "Then review health conditions, medications, mood, trauma/safety, relationship context, and values.", "tags": []}, {"id": 134, "topic": "Pregnancy Foundations & Antepartum", "front": "What five components make up the APGAR score?", "answer": "Appearance, Pulse, Grimace, Activity, and Respiration.", "why": "APGAR rapidly describes newborn adaptation after birth.", "clinical": "Each component receives 0, 1, or 2 points.", "tags": []}, {"id": 135, "topic": "Pregnancy Foundations & Antepartum", "front": "What APGAR pulse score is given for a heart rate greater than 100/min?", "answer": "2 points.", "why": "A heart rate above 100/min receives the highest pulse score.", "clinical": "Absent pulse scores 0; a rate below 100/min scores 1.", "tags": []}, {"id": 136, "topic": "Pregnancy Foundations & Antepartum", "front": "What APGAR respiration score is given for a strong cry/good respirations?", "answer": "2 points.", "why": "Effective respirations indicate stronger transition to extrauterine life.", "clinical": "Absent respirations score 0; slow/weak respirations score 1.", "tags": []}, {"id": 137, "topic": "Pregnancy Foundations & Antepartum", "front": "What APGAR activity score is given for well-flexed, active movement?", "answer": "2 points.", "why": "Good flexion reflects stronger neuromuscular tone.", "clinical": "Flaccid tone scores 0; some flexion scores 1.", "tags": []}, {"id": 138, "topic": "Pregnancy Foundations & Antepartum", "front": "What APGAR grimace score is given for a vigorous cry or active response to stimulation?", "answer": "2 points.", "why": "A strong reflex response indicates intact responsiveness.", "clinical": "No response scores 0; a grimace scores 1.", "tags": []}, {"id": 139, "topic": "Pregnancy Foundations & Antepartum", "front": "What APGAR appearance score is given for a pink body with blue hands/feet?", "answer": "1 point.", "why": "Acrocyanosis lowers the color component even when central color is pink.", "clinical": "Completely pink scores 2; pale/blue overall scores 0.", "tags": []}, {"id": 140, "topic": "Medications & Therapeutics", "front": "Doxycycline: what infection is the key association in this unit?", "answer": "Chlamydia in most nonpregnant adolescents/adults, typically PO for 7 days.", "why": "It targets the bacterial organism causing chlamydia.", "clinical": "Differentiate it from ceftriaxone for gonorrhea and penicillin G for syphilis.", "tags": []}, {"id": 141, "topic": "Medications & Therapeutics", "front": "Ceftriaxone IM: what infection is the key association?", "answer": "Gonorrhea.", "why": "An injectable cephalosporin is used to eradicate Neisseria gonorrhoeae.", "clinical": "Because chlamydia and gonorrhea symptoms overlap, testing still matters.", "tags": []}, {"id": 142, "topic": "Medications & Therapeutics", "front": "Benzathine penicillin G: what infection is the key association?", "answer": "Syphilis.", "why": "Penicillin therapy eradicates Treponema pallidum and prevents progression to late organ damage.", "clinical": "Dose schedule depends on stage: one dose for early disease versus three for late latent disease.", "tags": []}, {"id": 143, "topic": "Medications & Therapeutics", "front": "Acyclovir: what is the key teaching point for genital herpes?", "answer": "It reduces manifestations and transmission risk but does not cure HSV.", "why": "HSV remains latent in the body and can reactivate.", "clinical": "Continue transmission-reduction precautions even when symptoms improve.", "tags": []}, {"id": 144, "topic": "Medications & Therapeutics", "front": "Metronidazole: which two vaginal/reproductive infections should you associate with it?", "answer": "Bacterial vaginosis and trichomoniasis.", "why": "Metronidazole has activity against anaerobic organisms associated with BV and the protozoan Trichomonas.", "clinical": "Trichomoniasis also requires partner treatment and reinfection prevention.", "tags": []}, {"id": 145, "topic": "Medications & Therapeutics", "front": "Clindamycin: what vaginal condition is it used to treat?", "answer": "Bacterial vaginosis.", "why": "It targets bacteria associated with altered vaginal flora.", "clinical": "BV is not an STI and differs from candidiasis by discharge pattern and elevated pH.", "tags": []}, {"id": 146, "topic": "Medications & Therapeutics", "front": "Topical azoles: what condition are they used to treat?", "answer": "Vulvovaginal candidiasis.", "why": "Azoles are antifungal agents that treat Candida.", "clinical": "VVC commonly causes intense itching with thick white discharge and normal vaginal pH.", "tags": []}, {"id": 147, "topic": "Medications & Therapeutics", "front": "Fluconazole: in which client group may it be used for VVC in this study set?", "answer": "Selected nonpregnant clients.", "why": "Oral antifungal therapy can treat candidiasis, but pregnancy status changes medication selection.", "clinical": "Always connect the medication choice to pregnancy status.", "tags": []}, {"id": 148, "topic": "Medications & Therapeutics", "front": "Antenatal corticosteroids: what is the single most important purpose to remember?", "answer": "Promote fetal organ maturation when preterm birth is threatened.", "why": "Maturation therapy prepares the fetus for extrauterine life if delivery occurs early.", "clinical": "Do not confuse this with tocolysis or fetal neuroprotection.", "tags": []}, {"id": 149, "topic": "Medications & Therapeutics", "front": "Tocolytics: what is the single most important purpose to remember?", "answer": "Delay preterm birth briefly when clinically appropriate.", "why": "A short delay can allow time for fetal maturation therapy or transfer.", "clinical": "They do not permanently stop labor.", "tags": []}, {"id": 150, "topic": "Medications & Therapeutics", "front": "Magnesium sulfate in anticipated very preterm birth: what fetal benefit is targeted?", "answer": "Neuroprotection.", "why": "Very premature infants are vulnerable to neurologic injury.", "clinical": "This purpose is distinct from corticosteroid maturation.", "tags": []}, {"id": 151, "topic": "Medications & Therapeutics", "front": "Ulipristal acetate: what is its role?", "answer": "Oral emergency contraception taken as soon as possible within 5 days.", "why": "It can reduce pregnancy risk after unprotected intercourse or contraceptive failure.", "clinical": "Emergency contraception does not terminate an established pregnancy or protect against STIs.", "tags": []}, {"id": 152, "topic": "Medications & Therapeutics", "front": "Levonorgestrel emergency contraception: what timing principle matters most?", "answer": "Take it as soon as possible; it may be used within 5 days.", "why": "Emergency contraception is more useful when taken promptly after contraceptive failure.", "clinical": "It is not the same as mifepristone/misoprostol.", "tags": []}, {"id": 153, "topic": "Medications & Therapeutics", "front": "Mifepristone followed by misoprostol: what is this regimen used for?", "answer": "Medication abortion.", "why": "The medications produce physiologic changes that lead to pregnancy expulsion.", "clinical": "Cramping, bleeding, and tissue passage are expected; excessive bleeding or instability is not.", "tags": []}, {"id": 154, "topic": "Medications & Therapeutics", "front": "Combined estrogen-progestin contraception: which safety history should immediately get your attention?", "answer": "Smoking, migraine with aura, hypertension, thromboembolism, or significant cardiovascular risk.", "why": "Estrogen can increase vascular and thrombotic risk in susceptible clients.", "clinical": "Use ACHES teaching for urgent warning symptoms.", "tags": []}, {"id": 155, "topic": "Medications & Therapeutics", "front": "What does the 'C' in ACHES mean?", "answer": "Chest pain or shortness of breath.", "why": "These symptoms can indicate a serious cardiopulmonary/thromboembolic complication.", "clinical": "New chest pain or dyspnea requires prompt evaluation.", "tags": []}, {"id": 156, "topic": "Medications & Therapeutics", "front": "What does the 'H' in ACHES mean?", "answer": "Severe headache or new neurologic symptoms.", "why": "A new severe neurologic symptom can indicate a serious vascular complication.", "clinical": "Do not normalize a severe new headache in a client using estrogen-containing contraception.", "tags": []}, {"id": 157, "topic": "Medications & Therapeutics", "front": "What does the 'E' in ACHES mean?", "answer": "Eye or vision changes.", "why": "Visual changes can signal a serious vascular or neurologic complication.", "clinical": "Treat new visual disturbance as a warning sign.", "tags": []}, {"id": 158, "topic": "Medications & Therapeutics", "front": "What does the 'S' in ACHES mean?", "answer": "Severe leg pain or swelling.", "why": "Unilateral severe leg symptoms can indicate venous thrombosis.", "clinical": "This requires prompt evaluation rather than routine reassurance.", "tags": []}, {"id": 159, "topic": "Medications & Therapeutics", "front": "What does the 'A' in ACHES mean?", "answer": "Severe abdominal pain.", "why": "Severe abdominal pain is a warning symptom rather than an expected minor contraceptive effect.", "clinical": "Teach clients to distinguish urgent warning signs from common bleeding changes.", "tags": []}, {"id": 160, "topic": "Medications & Therapeutics", "front": "Which three medication purposes should never be confused in threatened preterm birth?", "answer": "Corticosteroids = fetal maturation; tocolytics = brief delay of birth; magnesium sulfate = fetal neuroprotection.", "why": "Each therapy addresses a different clinical goal, so recognizing the purpose prevents medication-selection errors.", "clinical": "When a question asks 'why is this being given?', identify the goal before choosing the drug.", "tags": []}];
let ratings=JSON.parse(localStorage.getItem("nur223d2anki_single")||"{}");
let baseOrder=DECK.map((_,i)=>i), current=0, special=null;
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function save(){localStorage.setItem("nur223d2anki_single",JSON.stringify(ratings));}
function list(){
 let arr=special||baseOrder.slice(),t=$("#topic").value,st=$("#status").value,q=$("#search").value.trim().toLowerCase();
 return arr.filter(i=>{let c=DECK[i],r=ratings[c.id]||"new";return(!t||c.topic===t)&&(!st||r===st)&&(!q||(c.front+" "+c.answer+" "+c.why+" "+c.clinical).toLowerCase().includes(q));});
}
function stats(){let v=Object.values(ratings);$("#reviewed").textContent=v.length;["again","hard","good","easy"].forEach(x=>$("#"+x+"N").textContent=v.filter(a=>a===x).length);$("#bar").style.width=(v.length/DECK.length*100)+"%";}
function render(){
 let arr=list();if(current>=arr.length)current=Math.max(0,arr.length-1);
 $("#prev").disabled=current<=0;$("#next").disabled=current>=arr.length-1;
 if(!arr.length){$("#counter").textContent="0 cards";$("#stage").innerHTML='<div class="empty">No cards match this filter.</div>';stats();return;}
 let c=DECK[arr[current]],r=ratings[c.id]||"new";$("#counter").textContent=`${current+1} of ${arr.length} • Card ${c.id}`;
 $("#stage").innerHTML=`<section class="flashcard" id="fc"><div class="meta"><span class="chip">${esc(c.topic)}</span><span class="rating">${r.toUpperCase()}</span></div>
 <div class="face"><div class="front">${esc(c.front)}</div><div class="back">
 <div class="label">Answer</div><div class="answer">${esc(c.answer)}</div>
 <div class="label">Why it matters</div><div class="why">${esc(c.why)}</div>
 ${c.clinical?`<div class="label">Nursing / NCLEX connection</div><div class="clinical">${esc(c.clinical)}</div>`:""}
 </div></div><div class="bottom"><div class="fliprow"><button class="primary" id="flip">Show Answer</button></div>
 <div class="rates"><button class="again" data-r="again">Again</button><button class="hard" data-r="hard">Hard</button><button class="good" data-r="good">Good</button><button class="easy" data-r="easy">Easy</button></div></div></section>`;
 $("#flip").onclick=()=>$("#fc").classList.add("flipped");
 document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>rate(b.dataset.r));
 stats();
}
function rate(r){let arr=list();if(!arr.length)return;let c=DECK[arr[current]];ratings[c.id]=r;save();stats();if(current<arr.length-1)current++;render();}
function move(n){let arr=list();current=Math.max(0,Math.min(arr.length-1,current+n));render();}
$("#prev").onclick=()=>move(-1);$("#next").onclick=()=>move(1);
$("#topic").onchange=()=>{special=null;current=0;render();};$("#status").onchange=()=>{special=null;current=0;render();};$("#search").oninput=()=>{special=null;current=0;render();};
$("#shuffle").onclick=()=>{special=null;baseOrder.sort(()=>Math.random()-.5);current=0;render();};
$("#review").onclick=()=>{special=DECK.map((c,i)=>({i,r:ratings[c.id]})).filter(x=>x.r==="again"||x.r==="hard").map(x=>x.i);$("#topic").value="";$("#status").value="";$("#search").value="";current=0;render();};
$("#reset").onclick=()=>{if(confirm("Reset all card ratings?")){ratings={};special=null;baseOrder=DECK.map((_,i)=>i);current=0;save();render();}};
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT")return;if(e.code==="Space"){e.preventDefault();let f=$("#fc");if(f)f.classList.toggle("flipped");}else if(e.key==="ArrowLeft")move(-1);else if(e.key==="ArrowRight")move(1);else if(["1","2","3","4"].includes(e.key))rate({"1":"again","2":"hard","3":"good","4":"easy"}[e.key]);});
render();
</script><nav class="study-site-nav" aria-label="Study site navigation"><a href="index.html">← Day2 Home</a><a href="../index.html">Exam 3 Main</a></nav></body></html>
