<script>
const BANK=[{"category": "STIs & Reproductive Infections", "level": 1, "stem": "A client has thin gray-white vaginal discharge, a fishy odor, and vaginal pH above 4.5. Which condition best fits the findings?", "options": ["Bacterial vaginosis", "Vulvovaginal candidiasis", "Genital herpes", "Endometriosis"], "correct": 0, "rationale": "Thin gray-white discharge, fishy odor, and elevated vaginal pH are characteristic of bacterial vaginosis."}, {"category": "STIs & Reproductive Infections", "level": 1, "stem": "A client has intense vulvovaginal itching, erythema, and thick white discharge. Which condition should the nurse suspect?", "options": ["Trichomoniasis", "Vulvovaginal candidiasis", "Gonorrhea", "Bacterial vaginosis"], "correct": 1, "rationale": "Vulvovaginal candidiasis commonly causes intense itching, erythema, and thick white discharge; vaginal pH is usually 4.5 or lower."}, {"category": "STIs & Reproductive Infections", "level": 1, "stem": "Which finding is most characteristic of primary syphilis?", "options": ["Painful recurrent vesicles", "Painless chancre", "Frothy yellow-green discharge", "Purulent urethral drainage"], "correct": 1, "rationale": "Primary syphilis classically presents with a painless chancre."}, {"category": "STIs & Reproductive Infections", "level": 2, "stem": "A client reports receptive anal intercourse and oral sex. Which principle should guide STI specimen collection?", "options": ["Collect only urine because symptoms are absent", "Select testing sites according to anatomy and exposure", "Base all testing on gender identity", "Wait for genital symptoms before testing"], "correct": 1, "rationale": "STI testing should reflect the client's anatomy and sites of sexual exposure; rectal or pharyngeal infection can otherwise be missed."}, {"category": "STIs & Reproductive Infections", "level": 2, "stem": "A client with pelvic pain, fever, abnormal discharge, and cervical motion tenderness is being evaluated. Which complication is the nurse trying to prevent through prompt treatment?", "options": ["Infertility and ectopic pregnancy", "Retinopathy of prematurity", "Placenta previa", "Gestational diabetes"], "correct": 0, "rationale": "PID can damage reproductive structures and increase the risk of infertility, ectopic pregnancy, and chronic pelvic pain."}, {"category": "STIs & Reproductive Infections", "level": 2, "stem": "A woman treated for trichomoniasis asks what else is important. Which teaching is appropriate?", "options": ["Partners do not need evaluation", "Resume intercourse immediately after the first dose", "Partners should be treated and intercourse avoided until treatment requirements are met", "Retesting is never needed"], "correct": 2, "rationale": "Trichomoniasis management includes partner treatment and avoiding intercourse until treatment is completed; women should be retested at about 3 months."}, {"category": "STIs & Reproductive Infections", "level": 3, "stem": "A client completed appropriate STI therapy but returns after sexual contact with an untreated partner and again tests positive. Which explanation best fits?", "options": ["Reinfection is possible after re-exposure", "Treatment always creates lifelong immunity", "Every repeat positive test proves medication failure", "Bacterial STIs cannot recur"], "correct": 0, "rationale": "A new infection after successful treatment can occur with re-exposure, especially when partners are not evaluated and treated."}, {"category": "STIs & Reproductive Infections", "level": 3, "stem": "A client has a painless genital lesion followed weeks later by a red-brown rash involving the palms and soles. Which disease progression best explains this?", "options": ["Primary to secondary syphilis", "HSV to HPV", "BV to PID", "Candidiasis to trichomoniasis"], "correct": 0, "rationale": "A painless chancre is associated with primary syphilis; the later systemic rash involving palms and soles is characteristic of secondary syphilis."}, {"category": "Pregnancy & Antepartum Foundations", "level": 1, "stem": "Which vessel carries oxygenated blood toward the fetus?", "options": ["Umbilical artery", "Umbilical vein", "Maternal uterine vein", "Ductus arteriosus"], "correct": 1, "rationale": "The single umbilical vein carries oxygenated blood toward the fetus; the two umbilical arteries carry deoxygenated blood away."}, {"category": "Pregnancy & Antepartum Foundations", "level": 1, "stem": "Which finding is a positive sign of pregnancy?", "options": ["Amenorrhea", "Positive home pregnancy test", "Fetal cardiac activity", "Nausea"], "correct": 2, "rationale": "Fetal cardiac activity directly confirms the presence of a fetus and is therefore a positive sign."}, {"category": "Pregnancy & Antepartum Foundations", "level": 1, "stem": "A client asks when the developing human is called a fetus. Which response is correct?", "options": ["Immediately at fertilization", "After 8 completed weeks following fertilization", "Only after viability", "Only after birth"], "correct": 1, "rationale": "The embryo stage extends through the end of 8 weeks after fertilization; after that the developing human is termed a fetus."}, {"category": "Pregnancy & Antepartum Foundations", "level": 2, "stem": "Around midpregnancy, which relationship is expected when assessing fundal height?", "options": ["Centimeters roughly correspond to gestational weeks", "Fundal height should always be less than 10 cm", "Fundal height is unrelated to gestational age", "Fundal height replaces all fetal assessment"], "correct": 0, "rationale": "Around midpregnancy, fundal height in centimeters roughly corresponds to gestational age in weeks and is useful for trending uterine growth."}, {"category": "Pregnancy & Antepartum Foundations", "level": 2, "stem": "Which prenatal finding should be reported rather than treated as a common discomfort?", "options": ["Mild heartburn", "Urinary frequency", "Marked decrease in fetal movement", "Mild fatigue"], "correct": 2, "rationale": "Marked decrease in fetal movement is a warning sign requiring evaluation."}, {"category": "Pregnancy & Antepartum Foundations", "level": 2, "stem": "Which history belongs in the initial prenatal assessment?", "options": ["Only the current pregnancy", "Pregnancy, medical/surgical, medication, infection, substance, nutrition, and psychosocial history", "Only immunizations", "Only menstrual dates"], "correct": 1, "rationale": "Initial prenatal assessment is broad and includes current and prior pregnancy history, medical/surgical conditions, medications, substances, infection risk, nutrition, immunization, and psychosocial/safety factors."}, {"category": "Pregnancy & Antepartum Foundations", "level": 3, "stem": "A pregnant client reports severe persistent headache, visual changes, and epigastric pain. What is the nurse's best interpretation?", "options": ["Expected third-trimester discomforts", "Warning signs requiring prompt evaluation", "Typical fetal movement symptoms", "Evidence of normal uterine growth"], "correct": 1, "rationale": "Severe headache, visual changes, and severe epigastric/RUQ pain are warning signs associated with hypertensive disease and require prompt evaluation."}, {"category": "Pregnancy & Antepartum Foundations", "level": 3, "stem": "Which statement best distinguishes a probable from a positive sign of pregnancy?", "options": ["A probable sign suggests pregnancy but can have other causes; a positive sign confirms a fetus", "A probable sign always confirms pregnancy", "Positive signs are subjective symptoms", "There is no difference"], "correct": 0, "rationale": "Probable signs are objective findings that suggest pregnancy, while positive signs directly demonstrate a fetus."}, {"category": "High-Risk Pregnancy", "level": 1, "stem": "A 34-week client has painless bright-red vaginal bleeding and a soft uterus. Which complication is most consistent with these findings?", "options": ["Placental abruption", "Placenta previa", "Preterm rupture caused by infection", "Gestational diabetes"], "correct": 1, "rationale": "Placenta previa classically produces painless bright-red bleeding with a soft uterus."}, {"category": "High-Risk Pregnancy", "level": 1, "stem": "Which presentation is most characteristic of placental abruption?", "options": ["Painless bleeding and soft uterus", "Painful bleeding with a tender, firm uterus", "Thick white discharge", "Isolated mild nausea"], "correct": 1, "rationale": "Abruption is associated with painful bleeding and uterine tenderness or firmness; some bleeding may be concealed."}, {"category": "High-Risk Pregnancy", "level": 2, "stem": "A client with suspected placenta previa is actively bleeding. Which action should the nurse avoid until previa is excluded?", "options": ["Maternal vital signs", "Fetal assessment", "Digital vaginal examination", "Quantifying blood loss"], "correct": 2, "rationale": "A digital vaginal examination can disrupt placental tissue and provoke severe hemorrhage when placenta previa is present."}, {"category": "High-Risk Pregnancy", "level": 2, "stem": "A client with suspected abruption has only a small amount of visible blood but is tachycardic and hypotensive. What should the nurse recognize?", "options": ["Visible blood always reflects total blood loss", "Concealed hemorrhage can cause severe shock despite limited external bleeding", "Abruption never causes internal bleeding", "The vital signs are unrelated"], "correct": 1, "rationale": "Blood can collect behind the placenta, so maternal shock may be more severe than the visible blood loss suggests."}, {"category": "High-Risk Pregnancy", "level": 2, "stem": "A client with gestational diabetes asks why fetal surveillance and glucose management matter. Which complication is associated with GDM?", "options": ["Large-for-gestational-age infant and neonatal hypoglycemia", "Primary syphilis", "Retinopathy from prematurity in every infant", "Placenta previa in every pregnancy"], "correct": 0, "rationale": "GDM increases risks including excessive fetal growth, birth complications, and neonatal hypoglycemia."}, {"category": "High-Risk Pregnancy", "level": 3, "stem": "A pregnant client with hypertension develops severe headache, visual changes, shortness of breath, and RUQ pain. What should the nurse prioritize?", "options": ["Prompt maternal-fetal evaluation for severe disease", "Routine dietary teaching only", "Reassurance and discharge", "Delay assessment until the next appointment"], "correct": 0, "rationale": "These are concerning features of severe preeclampsia and can indicate neurologic, hepatic, or respiratory compromise."}, {"category": "High-Risk Pregnancy", "level": 3, "stem": "A client with painful bleeding, a firm tender uterus, fetal distress, and maternal hypotension arrives at triage. Which plan best reflects the priority?", "options": ["Stabilize maternal hemodynamics, assess the fetus, establish IV access, obtain labs, and prepare for urgent birth if needed", "Perform a digital exam first", "Wait for bleeding to become heavier", "Encourage ambulation"], "correct": 0, "rationale": "This presentation suggests severe abruption. Maternal stabilization and fetal assessment occur immediately, with rapid preparation for blood work and urgent delivery when instability is present."}, {"category": "Preterm Labor & Fetal-Benefit Therapies", "level": 1, "stem": "Which definition best describes preterm labor?", "options": ["Any contraction before the due date", "Regular contractions causing cervical change before 37 weeks", "Rupture of membranes after 40 weeks", "Braxton Hicks contractions without cervical change"], "correct": 1, "rationale": "Preterm labor is regular uterine contractions that produce cervical change before 37 completed weeks."}, {"category": "Preterm Labor & Fetal-Benefit Therapies", "level": 1, "stem": "Which symptom cluster should raise concern for preterm labor?", "options": ["Pelvic pressure, low backache, regular contractions, and discharge change", "Isolated mild heartburn", "Stable mild ankle edema", "Occasional fatigue"], "correct": 0, "rationale": "Contractions, pelvic pressure, low backache, discharge changes, spotting, or fluid leakage can signal preterm labor."}, {"category": "Preterm Labor & Fetal-Benefit Therapies", "level": 2, "stem": "What is the primary purpose of antenatal corticosteroids when preterm birth is threatened?", "options": ["Promote fetal organ maturation", "Treat maternal gonorrhea", "Permanently stop labor", "Provide contraception"], "correct": 0, "rationale": "Antenatal corticosteroids are used to promote fetal maturation when preterm birth is threatened."}, {"category": "Preterm Labor & Fetal-Benefit Therapies", "level": 2, "stem": "What is the primary role of a tocolytic in preterm labor?", "options": ["Briefly delay birth when appropriate", "Mature fetal organs directly", "Treat candidiasis", "Provide permanent suppression of contractions"], "correct": 0, "rationale": "Tocolytics may delay birth briefly, which can provide time for other therapy or transfer; they do not permanently stop preterm labor."}, {"category": "Preterm Labor & Fetal-Benefit Therapies", "level": 2, "stem": "Why might magnesium sulfate be administered when very preterm birth is anticipated?", "options": ["Fetal neuroprotection", "Treatment of BV", "Fetal lung maturation", "Emergency contraception"], "correct": 0, "rationale": "In this context, magnesium sulfate is used for fetal neuroprotection when very preterm birth is anticipated."}, {"category": "Preterm Labor & Fetal-Benefit Therapies", "level": 3, "stem": "A 30-week client has regular contractions with cervical change at a facility without advanced neonatal care. Which plan best integrates the goals of treatment?", "options": ["Assess maternal-fetal status, address infection/dehydration, provide indicated fetal-benefit therapies, and arrange higher-level transfer when feasible", "Send the client home because contractions are expected", "Give only oral fluids and ignore cervical change", "Focus solely on postpartum teaching"], "correct": 0, "rationale": "True preterm labor requires maternal-fetal evaluation. Management can include treating contributors, corticosteroids, brief tocolysis, magnesium sulfate when indicated, and transfer to a facility with higher neonatal capability."}, {"category": "Preterm Labor & Fetal-Benefit Therapies", "level": 3, "stem": "Which pairing is incorrect?", "options": ["Corticosteroid — fetal maturation", "Tocolytic — brief delay of birth", "Magnesium sulfate — fetal neuroprotection", "Tocolytic — guaranteed permanent cessation of preterm labor"], "correct": 3, "rationale": "Tocolytics may temporarily delay birth; they do not guarantee permanent cessation of preterm labor."}, {"category": "Preterm Newborn", "level": 1, "stem": "A 30-week newborn has grunting, nasal flaring, retractions, and low oxygen saturation. Which priority comes first?", "options": ["Respiratory support", "Oral feeding", "Bathing", "Discharge education"], "correct": 0, "rationale": "Airway and breathing are immediate priorities in a preterm infant showing respiratory distress."}, {"category": "Preterm Newborn", "level": 1, "stem": "A wet newborn is losing heat as moisture changes to vapor. Which mechanism is occurring?", "options": ["Conduction", "Evaporation", "Radiation", "Convection"], "correct": 1, "rationale": "Evaporation is heat loss as moisture on the skin changes to vapor."}, {"category": "Preterm Newborn", "level": 1, "stem": "A newborn loses heat by lying directly on a cold scale. Which mechanism is this?", "options": ["Conduction", "Convection", "Radiation", "Evaporation"], "correct": 0, "rationale": "Conduction is heat transfer through direct contact with a colder surface."}, {"category": "Preterm Newborn", "level": 2, "stem": "Why is cold stress particularly dangerous in a preterm newborn?", "options": ["It increases oxygen and glucose consumption", "It eliminates respiratory distress", "It improves feeding coordination", "It prevents acidosis"], "correct": 0, "rationale": "Cold stress increases metabolic demand, consuming oxygen and glucose and potentially contributing to hypoglycemia, respiratory distress, and metabolic acidosis."}, {"category": "Preterm Newborn", "level": 2, "stem": "A preterm infant has poor suck-swallow-breathe coordination. Which intervention may be needed?", "options": ["Gavage feeding after assessing readiness", "Force a large oral feeding", "Stop monitoring for aspiration", "Withhold all nutrition indefinitely"], "correct": 0, "rationale": "Immature coordination can make oral feeding unsafe or ineffective; gavage feeding may be required."}, {"category": "Preterm Newborn", "level": 2, "stem": "Which complication is gastrointestinal and strongly associated with prematurity?", "options": ["NEC", "ROP", "IVH", "PDA"], "correct": 0, "rationale": "Necrotizing enterocolitis is a serious intestinal complication associated with prematurity."}, {"category": "Preterm Newborn", "level": 2, "stem": "Which complication affects the retina of premature infants?", "options": ["BPD", "ROP", "PDA", "NEC"], "correct": 1, "rationale": "Retinopathy of prematurity affects the developing retina."}, {"category": "Preterm Newborn", "level": 3, "stem": "A preterm infant is cold, tachypneic, and has falling glucose. Which physiologic sequence best explains the pattern?", "options": ["Cold stress increases metabolic demand, increasing oxygen and glucose use", "Hypothermia decreases all metabolic activity without consequence", "Feeding intolerance directly causes every case of hypothermia", "Radiation increases blood glucose"], "correct": 0, "rationale": "Cold stress drives increased metabolic activity. The infant consumes more oxygen and glucose, which can worsen respiratory distress and produce hypoglycemia and acidosis."}, {"category": "Preterm Newborn", "level": 3, "stem": "A stable preterm infant's parents are hesitant to touch the infant. Which nursing action best supports development and bonding?", "options": ["Encourage safe skin-to-skin contact, touch, voice, and participation in care", "Discourage all interaction until discharge", "Allow contact only during emergencies", "Provide education without parent participation"], "correct": 0, "rationale": "When the infant is stable, skin-to-skin contact and participation in care support bonding and caregiver confidence."}, {"category": "Contraception & Family Planning", "level": 1, "stem": "Which contraceptive method also reduces STI transmission risk?", "options": ["Condom", "Implant", "IUD", "Injection"], "correct": 0, "rationale": "Condoms provide barrier protection that reduces STI transmission; other contraceptive methods do not."}, {"category": "Contraception & Family Planning", "level": 1, "stem": "Which LARC is nonhormonal?", "options": ["Copper IUD", "Levonorgestrel IUD", "Implant", "Combined vaginal ring"], "correct": 0, "rationale": "The copper IUD is a highly effective, reversible, nonhormonal contraceptive method."}, {"category": "Contraception & Family Planning", "level": 1, "stem": "Which bleeding pattern is commonly associated with the contraceptive implant?", "options": ["Irregular bleeding", "Guaranteed monthly amenorrhea", "Severe hemorrhage in all users", "No possible bleeding change"], "correct": 0, "rationale": "Irregular bleeding is common with the progestin implant."}, {"category": "Contraception & Family Planning", "level": 2, "stem": "A client wants a LARC method that often decreases menstrual bleeding. Which option best fits?", "options": ["Copper IUD", "Levonorgestrel IUD", "Fertility awareness", "External condom"], "correct": 1, "rationale": "The levonorgestrel IUD often decreases bleeding; the copper IUD can increase bleeding and cramping."}, {"category": "Contraception & Family Planning", "level": 2, "stem": "A client using combined hormonal contraception reports severe unilateral leg pain and swelling. What should the nurse advise?", "options": ["Prompt evaluation", "Take an extra dose", "This is an expected harmless effect", "Massage the leg vigorously"], "correct": 0, "rationale": "Severe leg pain/swelling is an ACHES warning sign and may indicate thrombosis."}, {"category": "Contraception & Family Planning", "level": 2, "stem": "A client wants emergency contraception 4 days after unprotected intercourse. Which option can be used within 5 days?", "options": ["Ulipristal acetate", "Acyclovir", "Ceftriaxone", "Fluconazole"], "correct": 0, "rationale": "Ulipristal acetate can be used as soon as possible within 5 days; a copper IUD is another highly effective option within 5 days."}, {"category": "Contraception & Family Planning", "level": 3, "stem": "A 38-year-old who smokes daily requests combined hormonal contraception. Which assessment issue is most important?", "options": ["Estrogen-related cardiovascular and thromboembolic risk", "Whether the method cures STIs", "Whether smoking increases estrogen safety", "Whether the method guarantees amenorrhea"], "correct": 0, "rationale": "Smoking and age increase concern when evaluating the safety of estrogen-containing contraception."}, {"category": "Contraception & Family Planning", "level": 3, "stem": "Which statement by a client after vasectomy indicates a need for more teaching?", "options": ["I know it is not immediately effective", "I understand it does not protect against STIs", "I can rely on it for contraception immediately after the procedure", "I understand this is intended as permanent contraception"], "correct": 2, "rationale": "Vasectomy is not immediately effective; residual sperm remain for a period after the procedure."}, {"category": "Sexual & Reproductive Health", "level": 1, "stem": "Which hormone surge triggers ovulation?", "options": ["FSH", "LH", "Progesterone", "Prolactin"], "correct": 1, "rationale": "The LH surge triggers ovulation and formation of the corpus luteum."}, {"category": "Sexual & Reproductive Health", "level": 1, "stem": "Which hormone predominates during the luteal phase and supports the secretory endometrium?", "options": ["Progesterone", "FSH only", "Oxytocin", "hCG in every cycle"], "correct": 0, "rationale": "Progesterone from the corpus luteum supports the secretory endometrium after ovulation."}, {"category": "Sexual & Reproductive Health", "level": 1, "stem": "A client reports no menstrual period and pregnancy is biologically possible. What should be considered first?", "options": ["Pregnancy", "Menopause regardless of age", "Fibroids only", "Cervical cancer screening only"], "correct": 0, "rationale": "Pregnancy is an important first consideration in amenorrhea when conception is possible."}, {"category": "Sexual & Reproductive Health", "level": 2, "stem": "Which symptom cluster is most consistent with endometriosis?", "options": ["Cyclic pelvic pain, dysmenorrhea, dyspareunia, and infertility", "Painless bright-red pregnancy bleeding", "Frothy discharge and strawberry cervix", "Isolated hot flashes"], "correct": 0, "rationale": "Endometriosis commonly causes cyclic pelvic pain, dysmenorrhea, dyspareunia, bowel/bladder pain, and infertility."}, {"category": "Sexual & Reproductive Health", "level": 2, "stem": "Which pattern is most consistent with uterine fibroids?", "options": ["Heavy/prolonged bleeding with pelvic pressure and possible anemia", "Painful recurrent vesicles", "Painless chancre", "Grunting and retractions"], "correct": 0, "rationale": "Fibroids can cause heavy/prolonged bleeding, pelvic pressure/fullness, urinary/bowel pressure, and anemia."}, {"category": "Sexual & Reproductive Health", "level": 2, "stem": "A client has had no menses for 12 months without another cause. Which term applies?", "options": ["Menopause", "Perimenopause only", "Dysmenorrhea", "AUB"], "correct": 0, "rationale": "Menopause is defined as 12 months without menstruation in the absence of another cause."}, {"category": "Sexual & Reproductive Health", "level": 3, "stem": "A 54-year-old who has had no menses for 14 months develops new vaginal bleeding. What should the nurse recommend?", "options": ["Evaluation of postmenopausal bleeding", "Wait for several more cycles", "Treat as expected dysmenorrhea", "Assume normal ovulation resumed"], "correct": 0, "rationale": "Postmenopausal bleeding is not an expected menopausal symptom and requires evaluation."}, {"category": "Sexual & Reproductive Health", "level": 3, "stem": "Which statement best reflects therapeutic sexual-health assessment?", "options": ["Use neutral language, explain why questions are asked, protect privacy, and allow the client control over the examination", "Assume sexual practices from identity", "Avoid discussing coercion or consent", "Require a pelvic exam for every STI concern"], "correct": 0, "rationale": "Sexual-health assessment should be neutral, nonjudgmental, private, trauma-informed, and based on anatomy, exposure, symptoms, and individual goals."}, {"category": "Medications & Therapeutics", "level": 1, "stem": "Which medication is expected for gonorrhea?", "options": ["Ceftriaxone IM", "Acyclovir", "Fluconazole", "Benzathine penicillin G"], "correct": 0, "rationale": "Ceftriaxone IM is used to treat gonorrhea."}, {"category": "Medications & Therapeutics", "level": 1, "stem": "Which medication is used to treat syphilis?", "options": ["Benzathine penicillin G IM", "Ulipristal", "Clindamycin only", "Acyclovir"], "correct": 0, "rationale": "Benzathine penicillin G IM is the treatment for syphilis; the number of doses depends on stage."}, {"category": "Medications & Therapeutics", "level": 1, "stem": "Which medication reduces genital-herpes manifestations but does not cure HSV?", "options": ["Acyclovir", "Ceftriaxone", "Doxycycline", "Misoprostol"], "correct": 0, "rationale": "Acyclovir suppresses HSV manifestations and reduces transmission risk but does not eradicate latent virus."}, {"category": "Medications & Therapeutics", "level": 1, "stem": "Which antimicrobial is used ings indicate syphilis", "No treatment can be used"], "correct": 0, "rationale": "The findings are characteristic of vulvovaginal candidiasis, a fungal condition treated with antifungal therapy such as a topical azole."}, {"category": "Medications & Therapeutics", "level": 3, "stem": "Which set contains only correct medication-purpose pairings?", "options": ["Corticosteroid—fetal maturation; tocolytic—brief delay; magnesium sulfate—fetal neuroprotection", "Ceftriaxone—VVC; acyclovir—HSV cure; fluconazole—syphilis", "Metronidazole—HPV cure; doxycycline—BV only; ulipristal—PID", "Misoprostol—gonorrhea; penicillin—candidiasis; clindamycin—HSV"], "correct": 0, "rationale": "The three preterm-birth therapies have distinct roles: corticosteroids promote fetal maturation, tocolytics may briefly delay birth, and magnesium sulfate can provide fetal neuroprotection."}, {"category": "Priority & Who Do You See First?", "level": 1, "stem": "Which client should the nurse assess first?", "options": ["Pregnant client with mild heartburn", "Client with stable vulvovaginal itching", "Pregnant client with severe headache, visual changes, and dyspnea", "Client asking about HPV vaccination"], "correct": 2, "rationale": "Severe headache, visual changes, and dyspnea in pregnancy can indicate severe preeclampsia and maternal organ compromise."}, {"category": "Priority & Who Do You See First?", "level": 1, "stem": "Which client has the most immediate threat to oxygenation?", "options": ["Preterm infant with grunting, retractions, and cyanosis", "Client with a painless chancre", "Client with stable irregular implant bleeding", "Client with mild dysmenorrhea"], "correct": 0, "rationale": "The preterm infant has active respiratory distress and impaired oxygenation."}, {"category": "Priority & Who Do You See First?", "level": 2, "stem": "Which client should be evaluated first?", "options": ["Client with expected cramping after medication abortion", "Client with syncope and excessive bleeding after medication abortion", "Client with stable hot flashes", "Client requesting contraception counseling"], "correct": 1, "rationale": "Syncope plus excessive bleeding suggests significant blood loss and possible hemodynamic instability."}, {"category": "Priority & Who Do You See First?", "level": 2, "stem": "Four clients call the clinic. Who requires the most urgent response?", "options": ["Client with mild nausea in pregnancy", "Client with regular contractions and fluid leakage at 31 weeks", "Client with expected implant spotting", "Client asking about folic acid"], "correct": 1, "rationale": "Regular contractions and fluid leakage before 37 weeks raise concern for preterm labor and membrane rupture and require prompt evaluation."}, {"category": "Priority & Who Do You See First?", "level": 2, "stem": "Which client should the nurse see first?", "options": ["Stable client with fishy vaginal odor", "Pregnant client with painful bleeding, firm tender uterus, and dizziness", "Client with chronic cyclic pelvic pain", "Client requesting HPV vaccination"], "correct": 1, "rationale": "Painful pregnancy bleeding, a firm tender uterus, and dizziness suggest placental abruption with possible hemorrhage."}, {"category": "Priority & Who Do You See First?", "level": 3, "stem": "The nurse has four preterm infants. Which infant requires immediate assessment?", "options": ["Infant sleeping in an incubator with stable temperature", "Infant with poor weight gain over several days", "Infant with new apnea and cyanosis", "Stable infant whose parent requests feeding teaching"], "correct": 2, "rationale": "New apnea and cyanosis represent an immediate airway/breathing threat."}, {"category": "Priority & Who Do You See First?", "level": 3, "stem": "Which client represents the highest immediate physiologic priority?", "options": ["Client with postmenopausal bleeding but stable vital signs", "Client with endometriosis pain rated 6/10", "Client with suspected abruption, hypotension, and fetal distress", "Client with uncomplicated chlamydia awaiting medication"], "correct": 2, "rationale": "Maternal hypotension plus fetal distress in suspected abruption indicates active maternal-fetal compromise requiring immediate stabilization."}, {"category": "Priority & Who Do You See First?", "level": 3, "stem": "A nurse must choose the next action for a cold preterm infant with tachypnea and low glucose. What should be prioritized?", "options": ["Controlled warming while supporting respiratory and glucose stability", "Routine bath", "Large oral feeding regardless of respiratory status", "Delay intervention until the next scheduled assessment"], "correct": 0, "rationale": "Cold stress increases oxygen and glucose use. Controlled warming plus respiratory and glucose support addresses the physiologic cascade."}];const CATS=["STIs & Reproductive Infections", "Pregnancy & Antepartum Foundations", "High-Risk Pregnancy", "Preterm Labor & Fetal-Benefit Therapies", "Preterm Newborn", "Contraception & Family Planning", "Sexual & Reproductive Health", "Medications & Therapeutics", "Priority & Who Do You See First?"];
let history=JSON.parse(localStorage.getItem("nur223d2boss_v2")||"{}"),battle=[],pos=0,score=0,answered=0;

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}
function key(q){return q.category+"|"+q.level+"|"+q.stem}
function save(){localStorage.setItem("nur223d2boss_v2",JSON.stringify(history))}
function updateMastery(){
 let correctKeys=Object.entries(history).filter(([k,v])=>v.correct).map(([k])=>k);$("#mastery").textContent=Math.round(correctKeys.length/BANK.length*100)+"%";
 $("#catgrid").innerHTML=CATS.map(c=>{let qs=BANK.filter(q=>q.category===c),done=qs.filter(q=>history[key(q)]),ok=qs.filter(q=>history[key(q)]?.correct),pct=qs.length?Math.round(ok.length/qs.length*100):0;return `<div class="cat"><div class="name">${esc(c)}</div><div class="meter"><div style="width:${pct}%"></div></div><small>${ok.length}/${qs.length} mastered • ${pct}%</small></div>`}).join("");
}
function startBattle(){
 let cat=$("#cat").value,lev=$("#level").value,p=BANK.filter(q=>(cat==="Mixed Boss Mode"||q.category===cat)&&(lev==="all"||q.level===+lev));

 let weak=shuffle(p.filter(q=>!history[key(q)]?.correct)),strong=shuffle(p.filter(q=>history[key(q)]?.correct));let n=$("#length").value==="all"?p.length:Math.min(+$("#length").value,p.length);

function answer(i){let q=battle[pos],is=i===q.correct;answered++;if(is)score++;history[key(q)]={correct:is,attempts:(history[key(q)]?.attempts||0)+1};save();
 document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(j===q.correct)b.classList.add("correct");if(j===i&&!is)b.classList.add("wrong")});

}
