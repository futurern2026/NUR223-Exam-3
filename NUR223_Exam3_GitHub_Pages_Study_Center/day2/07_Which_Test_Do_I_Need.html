<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Which Test Do I Need?</title><style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#d9dfeb;--accent:#3448c5;--good:#087a55;--bad:#b42318;--soft:#eef1ff}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line)}.wrap{max-width:980px;margin:auto;padding:18px}main{max-width:980px;margin:22px auto;padding:0 16px 50px}
h1{font-size:1.4rem;margin:0 0 6px}.sub{color:var(--muted);font-size:.92rem}.stats,.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
button,select{border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 12px;color:var(--ink);font-weight:700;cursor:pointer}
.primary{background:var(--accent);border-color:var(--accent);color:#fff}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 4px 14px rgba(20,30,55,.05);margin-bottom:14px}
.chip{display:inline-block;background:var(--soft);color:#3343a5;border-radius:999px;padding:5px 9px;font-size:.78rem;font-weight:800}.stem{font-size:1.15rem;font-weight:760;line-height:1.5;margin:16px 0}
.options{display:grid;gap:9px}.opt{width:100%;text-align:left;line-height:1.4}.opt.correct{border-color:#4da987;background:#edf9f4}.opt.wrong{border-color:#d97b74;background:#fff1f0}
.feedback{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;line-height:1.55}.why{color:var(--muted)}.progress{height:7px;background:#e8ecf4;border-radius:99px;overflow:hidden;margin-top:12px}.bar{height:100%;background:var(--accent)}
.center{text-align:center}.big{font-size:1.25rem;font-weight:800}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style><style id="study-site-nav-css">.study-site-nav{position:fixed;right:14px;bottom:14px;z-index:99999;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.study-site-nav a{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;text-decoration:none;background:#172033;color:#fff!important;border:1px solid #ffffff38;border-radius:999px;padding:9px 12px;font-size:13px;font-weight:800;box-shadow:0 4px 14px #0003}.study-site-nav a:first-child{background:#3448c5}@media(max-width:520px){.study-site-nav{left:10px;right:10px;bottom:10px}.study-site-nav a{flex:1;text-align:center}}</style></head><body>
<header><div class="wrap"><h1>Which Test Do I Need?</h1><div class="sub">Match the clinical question to the appropriate assessment or diagnostic test</div></div></header>
<main><div class="stats"><span>Question <b id="num">1</b>/<b id="total"></b></span><span>Correct <b id="score">0</b></span><span>Accuracy <b id="acc">—</b></span></div>
<div class="progress"><div class="bar" id="bar"></div></div><div id="stage" style="margin-top:18px"></div></main><script>
const Q=[{"topic": "STI testing", "stem": "A client reports receptive oral and anal exposure. Which testing principle is most appropriate?", "options": ["Test exposed pharyngeal/rectal sites as indicated", "Use only a urine specimen", "Test only if genital symptoms occur", "Base testing only on gender identity"], "correct": 0, "rationale": "STI testing sites should reflect anatomy and exposure."}, {"topic": "Amenorrhea", "stem": "A client who could be pregnant has missed a period. Which test has priority?", "options": ["Pregnancy test", "Pap test", "ROP screening", "Semen analysis"], "correct": 0, "rationale": "Pregnancy should be considered first in amenorrhea when possible."}, {"topic": "Heavy bleeding", "stem": "Which test helps evaluate anemia from heavy uterine bleeding?", "options": ["CBC", "RPR", "APGAR", "HPV vaccine"], "correct": 0, "rationale": "CBC/Hgb can identify anemia related to blood loss."}, {"topic": "Fibroids", "stem": "Which test is useful for suspected structural uterine pathology?", "options": ["Transvaginal ultrasound", "APGAR", "Semen analysis", "VDRL only"], "correct": 0, "rationale": "Transvaginal ultrasound evaluates uterine and adnexal structure."}, {"topic": "Syphilis", "stem": "Which tests are associated with syphilis screening?", "options": ["RPR/VDRL", "APGAR", "GBS only", "Fundal height"], "correct": 0, "rationale": "RPR and VDRL are serologic tests used in syphilis evaluation."}, {"topic": "Placenta previa", "stem": "Which evaluation helps determine placental location?", "options": ["Ultrasound", "Digital vaginal exam before exclusion", "Semen analysis", "Pap test"], "correct": 0, "rationale": "Ultrasound can assess placental location without disrupting placental tissue."}, {"topic": "Infertility", "stem": "Which test evaluates male-factor sperm/semen characteristics?", "options": ["Semen analysis", "Fundal height", "APGAR", "RPR"], "correct": 0, "rationale": "Semen analysis is a central component of male infertility evaluation."}];let order=Q.map((_,i)=>i),pos=0,score=0,answered=0;
const $=s=>document.querySelector(s);const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){let q=Q[order[pos]];$("#total").textContent=Q.length;$("#num").textContent=pos+1;$("#score").textContent=score;$("#acc").textContent=answered?Math.round(score/answered*100)+"%":"—";$("#bar").style.width=(pos/Q.length*100)+"%";
$("#stage").innerHTML=`<section class="card"><span class="chip">${esc(q.topic||"Clinical Judgment")}</span><div class="stem">${esc(q.stem)}</div><div class="options">${q.options.map((x,i)=>`<button class="opt" data-i="${i}">${esc(x)}</button>`).join("")}</div><div id="fb"></div></section>`;
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));}
function answer(i){let q=Q[order[pos]];document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(j===q.correct)b.classList.add("correct");if(j===i&&i!==q.correct)b.classList.add("wrong");});answered++;if(i===q.correct)score++;
$("#fb").innerHTML=`<div class="feedback"><b>${i===q.correct?"Correct":"Not quite"}</b><div class="why">${esc(q.rationale)}</div><div style="margin-top:12px"><button class="primary" id="next">${pos===Q.length-1?"Restart":"Next →"}</button></div></div>`;$("#score").textContent=score;$("#acc").textContent=Math.round(score/answered*100)+"%";$("#next").onclick=()=>{if(pos===Q.length-1){order.sort(()=>Math.random()-.5);pos=0;score=answered=0;}else pos++;render();};}
order.sort(()=>Math.random()-.5);render();</script><nav class="study-site-nav" aria-label="Study site navigation"><a href="index.html">← Day2 Home</a><a href="../index.html">Exam 3 Main</a></nav></body></html>
