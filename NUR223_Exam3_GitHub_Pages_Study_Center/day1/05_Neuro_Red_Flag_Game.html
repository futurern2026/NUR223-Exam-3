<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neuro Red Flag Game</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f2f7;color:#25212a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}header{background:#43245f;color:#fff;padding:18px;position:sticky;top:0;z-index:5}.wrap,main{max-width:900px;margin:auto}h1{margin:0 0 5px}.sub{opacity:.9;font-size:13px}main{padding:14px}.card,.panel{background:#fff;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 3px 14px #0001}button{border:1px solid #d3ccd8;background:#fff;border-radius:9px;padding:11px;margin:5px;font-size:15px}button:hover{background:#f1eaf5}.primary{background:#43245f;color:#fff}.correct{background:#e5f4e8!important;border-color:#559164!important}.wrong{background:#fde8e8!important;border-color:#b95a5a!important}.feedback{margin-top:12px;padding:12px;border-radius:9px;background:#f3eef6;line-height:1.5}.hidden{display:none}.score{font-weight:750}.choice{display:block;width:100%;text-align:left}.big{font-size:22px;font-weight:750;line-height:1.4}.tag{font-size:12px;font-weight:800;text-transform:uppercase;color:#76518d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.drop{min-height:120px;border:2px dashed #c9bfd0;border-radius:12px;padding:10px}.item{background:#fff;border:1px solid #d8d0dd;border-radius:9px;padding:10px;margin:7px 0;cursor:pointer}.selected{outline:3px solid #8b68a0}.order{padding:10px;border:1px solid #ddd;border-radius:9px;margin:7px 0;background:#fff}.small{font-size:12px;color:#666}a{color:#43245f}</style><style id="study-site-nav-css">.study-site-nav{position:fixed;right:14px;bottom:14px;z-index:99999;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.study-site-nav a{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;text-decoration:none;background:#172033;color:#fff!important;border:1px solid #ffffff38;border-radius:999px;padding:9px 12px;font-size:13px;font-weight:800;box-shadow:0 4px 14px #0003}.study-site-nav a:first-child{background:#3448c5}@media(max-width:520px){.study-site-nav{left:10px;right:10px;bottom:10px}.study-site-nav a{flex:1;text-align:center}}</style></head><body><header><div class="wrap"><h1>Neuro Red Flag Game</h1><div class="sub">Expected vs concerning vs emergency patterns</div></div></header><main><div class="panel score" id="score"></div><div id="game"></div><button class="primary" onclick="next()">Next</button></main><script>const Q=[{"topic": "Concussion", "q": "After a concussion, the client has a mild headache that is unchanged and remains alert. Classify this finding.", "o": ["Expected/monitor", "Concerning change", "Emergency pattern"], "a": 0, "r": "Headache can occur with mild TBI. The stem does not establish worsening or neurologic decline."}, {"topic": "Concussion", "q": "After a concussion, the headache is worsening and the client has repeated vomiting. Classify this pattern.", "o": ["Expected/monitor only", "Concerning—prompt evaluation", "Normal postictal recovery"], "a": 1, "r": "Worsening headache and repeated vomiting are danger signs after concussion."}, {"topic": "ICP", "q": "A neurologic client develops new restlessness and confusion but remains arousable with reactive pupils. Classify the finding.", "o": ["Early/worsening ICP concern", "Late herniation pattern", "Normal recovery"], "a": 0, "r": "LOC change, restlessness, and confusion can be early/worsening increased-ICP findings."}, {"topic": "ICP", "q": "A client with severe increased ICP becomes unresponsive with a fixed pupil, posturing, and irregular respirations. Classify the pattern.", "o": ["Mild expected change", "Late/ominous emergency pattern", "Normal concussion"], "a": 1, "r": "The severity cues establish late deterioration and possible herniation."}, {"topic": "ICP", "q": "BP becomes 178/64, HR 48, respirations irregular in a client with severe increased ICP. Classify the pattern.", "o": ["Expected/monitor", "Cushing's triad—late emergency sign", "Postictal fatigue"], "a": 1, "r": "Widening pulse pressure, bradycardia, and irregular respirations are Cushing's triad."}, {"topic": "Seizure", "q": "A generalized seizure lasts 90 seconds and the client begins to recover afterward. Classify it.", "o": ["Status epilepticus", "Does not meet the ≥5-minute status definition", "Herniation"], "a": 1, "r": "The PowerPoint defines status as ≥5 minutes or repeated seizures without recovery."}, {"topic": "Seizure", "q": "A seizure reaches 5 minutes without stopping. Classify it.", "o": ["Expected seizure recovery", "Status epilepticus—emergency", "Aura"], "a": 1, "r": "Five minutes meets the status epilepticus threshold."}, {"topic": "VP shunt", "q": "A child with a shunt develops fever and redness over the shunt tract. Classify the finding.", "o": ["Expected", "Concerning for infection", "Evidence of improved drainage"], "a": 1, "r": "Fever with redness/tenderness is concerning for shunt infection."}];let i=0,s=0,a=0;const g=document.getElementById('game'),sc=document.getElementById('score');
function render(){let q=Q[i];g.innerHTML=`<div class="card"><div class="tag">${q.topic}</div><div class="big">${q.q}</div><div id="opts">${q.o.map((x,j)=>`<button class="choice" data-i="${j}">${x}</button>`).join('')}</div><div id="fb"></div></div>`;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>ans(b,+b.dataset.i,q));upd()}
function ans(b,j,q){if(document.querySelector('#fb').innerHTML)return;a++;document.querySelectorAll('.choice').forEach((x,k)=>{x.disabled=true;if(k===q.a)x.classList.add('correct')});if(j===q.a){s++;b.classList.add('correct')}else b.classList.add('wrong');document.querySelector('#fb').innerHTML=`<div class="feedback"><b>${j===q.a?'Correct':'Review'}</b><br>${q.r}</div>`;upd()}
function upd(){sc.textContent=`Score: ${s}/${a} · Item ${i+1}/${Q.length}`}function next(){i=(i+1)%Q.length;render()}render();</script><nav class="study-site-nav" aria-label="Study site navigation"><a href="index.html">← Day1 Home</a><a href="../index.html">Exam 3 Main</a></nav></body></html>
