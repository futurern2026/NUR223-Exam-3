<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Name That Condition</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f2f7;color:#25212a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}header{background:#43245f;color:#fff;padding:18px;position:sticky;top:0;z-index:5}.wrap,main{max-width:900px;margin:auto}h1{margin:0 0 5px}.sub{opacity:.9;font-size:13px}main{padding:14px}.card,.panel{background:#fff;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 3px 14px #0001}button{border:1px solid #d3ccd8;background:#fff;border-radius:9px;padding:11px;margin:5px;font-size:15px}button:hover{background:#f1eaf5}.primary{background:#43245f;color:#fff}.correct{background:#e5f4e8!important;border-color:#559164!important}.wrong{background:#fde8e8!important;border-color:#b95a5a!important}.feedback{margin-top:12px;padding:12px;border-radius:9px;background:#f3eef6;line-height:1.5}.hidden{display:none}.score{font-weight:750}.choice{display:block;width:100%;text-align:left}.big{font-size:22px;font-weight:750;line-height:1.4}.tag{font-size:12px;font-weight:800;text-transform:uppercase;color:#76518d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.drop{min-height:120px;border:2px dashed #c9bfd0;border-radius:12px;padding:10px}.item{background:#fff;border:1px solid #d8d0dd;border-radius:9px;padding:10px;margin:7px 0;cursor:pointer}.selected{outline:3px solid #8b68a0}.order{padding:10px;border:1px solid #ddd;border-radius:9px;margin:7px 0;background:#fff}.small{font-size:12px;color:#666}a{color:#43245f}</style><style id="study-site-nav-css">.study-site-nav{position:fixed;right:14px;bottom:14px;z-index:99999;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.study-site-nav a{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;text-decoration:none;background:#172033;color:#fff!important;border:1px solid #ffffff38;border-radius:999px;padding:9px 12px;font-size:13px;font-weight:800;box-shadow:0 4px 14px #0003}.study-site-nav a:first-child{background:#3448c5}@media(max-width:520px){.study-site-nav{left:10px;right:10px;bottom:10px}.study-site-nav a{flex:1;text-align:center}}</style></head><body>
<header><div class="wrap"><h1>Name That Condition</h1><div class="sub">Multiple-choice mystery patient game — fewer clues earn more points</div></div></header>
<main><div class="panel score" id="score"></div><div id="game"></div></main>
<script>
const Q=[{"topic": "Hydrocephalus", "clues": ["Infant with rapidly increasing head circumference", "Fontanel is tense and scalp veins are prominent", "Eyes deviate downward"], "options": ["Hydrocephalus", "Concussion", "Status epilepticus", "Brain tumor"], "answer": 0, "why": "Increasing head circumference, a tense fontanel, prominent scalp veins, and sunset eyes fit infant hydrocephalus."}, {"topic": "VP Shunt", "clues": ["Child has a VP shunt", "New headache and repeated vomiting", "Neurologic responsiveness is declining; no fever or redness"], "options": ["VP shunt infection", "VP shunt obstruction", "Postictal state", "Concussion"], "answer": 1, "why": "Return of hydrocephalus manifestations with vomiting, headache, and neurologic decline supports shunt obstruction."}, {"topic": "VP Shunt", "clues": ["Child has a VP shunt", "Fever develops", "Redness and tenderness are present along the shunt tract"], "options": ["VP shunt obstruction", "Cerebral edema", "VP shunt infection", "Absence seizure"], "answer": 2, "why": "Fever plus redness or tenderness along the shunt supports shunt infection."}, {"topic": "TBI", "clues": ["Client recently sustained a head injury", "Headache, dizziness, nausea, and a foggy feeling are present", "The client reports difficulty with memory and concentration"], "options": ["Concussion", "Status epilepticus", "Hydrocephalus", "Shunt infection"], "answer": 0, "why": "The PowerPoint lists headache, dizziness, nausea, confusion/foggy feeling, and memory/concentration problems with concussion or mild TBI."}, {"topic": "Increased ICP", "clues": ["Neurologic client becomes newly restless and confused", "Headache and vomiting develop", "Level of consciousness is beginning to decline"], "options": ["Early/worsening increased ICP", "Cushing's triad", "Postictal recovery", "Atonic seizure"], "answer": 0, "why": "LOC change, restlessness/confusion, headache, and nausea/vomiting are early or worsening increased-ICP findings."}, {"topic": "Increased ICP", "clues": ["Client has severe increased ICP", "Systolic pressure rises and pulse pressure widens while heart rate slows", "Respirations become irregular"], "options": ["Concussion", "Cushing's triad", "Aura", "VP shunt obstruction"], "answer": 1, "why": "Increased systolic BP/widened pulse pressure, bradycardia, and irregular respirations make up Cushing's triad."}, {"topic": "Increased ICP", "clues": ["Known severe increased ICP", "Level of consciousness rapidly declines", "A fixed pupil, posturing, and respiratory deterioration develop"], "options": ["Brain herniation", "Mild concussion", "Postictal phase", "Focal seizure"], "answer": 0, "why": "Rapid LOC decline with pupil changes, posturing, and respiratory deterioration is the PowerPoint's herniation warning pattern."}, {"topic": "Brain Tumor", "clues": ["Progressive headache and nausea/vomiting", "New focal weakness develops", "The client develops a seizure and cognitive change"], "options": ["Brain tumor neurologic effects", "Simple postictal recovery", "VP shunt infection", "Atonic seizure"], "answer": 0, "why": "Brain tumors can cause increased-ICP-type symptoms, focal deficits, seizures, and cognitive or personality changes."}, {"topic": "Seizures", "clues": ["Generalized seizure is ongoing", "Activity has continued for 5 minutes", "The client has not recovered"], "options": ["Aura", "Postictal phase", "Status epilepticus", "Absence seizure"], "answer": 2, "why": "A seizure lasting at least 5 minutes or repeated seizures without recovery meets the lecture definition of status epilepticus."}, {"topic": "Seizures", "clues": ["Seizure activity has stopped", "Client is confused and fatigued", "Alertness gradually improves during recovery"], "options": ["Postictal phase", "Ictal phase", "Status epilepticus", "Prodromal phase"], "answer": 0, "why": "The postictal phase is the recovery period after seizure activity and can include confusion and fatigue."}, {"topic": "Seizures", "clues": ["Client experiences a warning associated with seizure onset", "The experience occurs before the obvious seizure manifestations", "It belongs to the early ictal portion of the seizure sequence"], "options": ["Postictal phase", "Aura", "Cushing's triad", "Secondary brain injury"], "answer": 1, "why": "The PowerPoint places aura in the early ictal phase."}, {"topic": "Seizures", "clues": ["Seizure causes a sudden loss of muscle tone", "The abrupt change creates a major injury risk", "There is no description of prolonged tonic-clonic activity"], "options": ["Myoclonic seizure", "Atonic seizure", "Status epilepticus", "Absence seizure"], "answer": 1, "why": "An atonic seizure involves sudden loss of muscle tone and creates a fall or injury risk."}, {"topic": "Seizures", "clues": ["Seizure consists of brief sudden muscle contractions", "The movements are short jerks", "Awareness findings are not the defining clue"], "options": ["Atonic seizure", "Myoclonic seizure", "Absence seizure", "Postictal phase"], "answer": 1, "why": "The assigned seizure reading reinforces myoclonic seizures as brief muscle contractions or jerks."}];let i=0,shown=1,pts=0,answered=false;
const g=document.getElementById('game'),sc=document.getElementById('score');
function render(){
 answered=false;let q=Q[i];sc.textContent=`Points: ${pts} · Mystery ${i+1}/${Q.length}`;
 g.innerHTML=`<div class="card"><div class="tag">${q.topic}</div><div class="big">Name that condition</div>
 ${q.clues.slice(0,shown).map((x,n)=>`<p><b>Clue ${n+1}:</b> ${x}</p>`).join('')}
 <div id="choices">${q.options.map((x,n)=>`<button class="choice" data-a="${n}">${x}</button>`).join('')}</div>
 ${shown<q.clues.length?'<button id="more" onclick="more()">Reveal Another Clue</button>':''}
 <div id="fb"></div></div>`;
 document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>answer(+b.dataset.a,b));
}
function answer(n,b){
 if(answered)return;answered=true;let q=Q[i];
 document.querySelectorAll('[data-a]').forEach((x,k)=>{x.disabled=true;if(k===q.answer)x.classList.add('correct')});
 let ok=n===q.answer;if(ok){pts+=4-shown;b.classList.add('correct')}else b.classList.add('wrong');
 let more=document.getElementById('more');if(more)more.disabled=true;
 document.getElementById('fb').innerHTML=`<div class="feedback"><b>${ok?'Correct!':'Correct answer: '+q.options[q.answer]}</b><br>${q.why}<br><br><span class="small">${ok?'You earned '+(4-shown)+' point'+((4-shown)===1?'':'s')+'.':'No points this round—use the explanation to lock in the clue pattern.'}</span><br><button class="primary" onclick="next()">Next Mystery</button></div>`;
 sc.textContent=`Points: ${pts} · Mystery ${i+1}/${Q.length}`;
}
function more(){if(answered)return;shown++;render()}
function next(){i=(i+1)%Q.length;shown=1;render()}
render();
</script><nav class="study-site-nav" aria-label="Study site navigation"><a href="index.html">← Day1 Home</a><a href="../index.html">Exam 3 Main</a></nav></body></html>
