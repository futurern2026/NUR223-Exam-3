<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neuro Numbers Challenge</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f2f7;color:#25212a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}header{background:#43245f;color:#fff;padding:18px;position:sticky;top:0;z-index:5}.wrap,main{max-width:900px;margin:auto}h1{margin:0 0 5px}.sub{opacity:.9;font-size:13px}main{padding:14px}.card,.panel{background:#fff;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 3px 14px #0001}button{border:1px solid #d3ccd8;background:#fff;border-radius:9px;padding:11px;margin:5px;font-size:15px}button:hover{background:#f1eaf5}.primary{background:#43245f;color:#fff}.correct{background:#e5f4e8!important;border-color:#559164!important}.wrong{background:#fde8e8!important;border-color:#b95a5a!important}.feedback{margin-top:12px;padding:12px;border-radius:9px;background:#f3eef6;line-height:1.5}.hidden{display:none}.score{font-weight:750}.choice{display:block;width:100%;text-align:left}.big{font-size:22px;font-weight:750;line-height:1.4}.tag{font-size:12px;font-weight:800;text-transform:uppercase;color:#76518d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.drop{min-height:120px;border:2px dashed #c9bfd0;border-radius:12px;padding:10px}.item{background:#fff;border:1px solid #d8d0dd;border-radius:9px;padding:10px;margin:7px 0;cursor:pointer}.selected{outline:3px solid #8b68a0}.order{padding:10px;border:1px solid #ddd;border-radius:9px;margin:7px 0;background:#fff}.small{font-size:12px;color:#666}a{color:#43245f}</style><style id="study-site-nav-css">.study-site-nav{position:fixed;right:14px;bottom:14px;z-index:99999;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.study-site-nav a{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;text-decoration:none;background:#172033;color:#fff!important;border:1px solid #ffffff38;border-radius:999px;padding:9px 12px;font-size:13px;font-weight:800;box-shadow:0 4px 14px #0003}.study-site-nav a:first-child{background:#3448c5}@media(max-width:520px){.study-site-nav{left:10px;right:10px;bottom:10px}.study-site-nav a{flex:1;text-align:center}}</style></head><body><header><div class="wrap"><h1>Neuro Numbers Challenge</h1><div class="sub">MAP, CPP, GCS, and interpretation</div></div></header><main><div class="panel score" id="score"></div><div id="game"></div><button class="primary" onclick="next()">Next</button></main><script>const Q=[{"topic": "MAP", "q": "BP 120/60 mm Hg. Calculate MAP.", "o": ["80 mm Hg", "60 mm Hg", "90 mm Hg", "120 mm Hg"], "a": 0, "r": "MAP = (120 + 2×60) ÷ 3 = 80."}, {"topic": "MAP", "q": "BP 150/72 mm Hg. Calculate MAP.", "o": ["98 mm Hg", "72 mm Hg", "111 mm Hg", "78 mm Hg"], "a": 0, "r": "MAP = (150 + 144) ÷ 3 = 98."}, {"topic": "CPP", "q": "MAP 92 mm Hg and ICP 18 mm Hg. Calculate CPP.", "o": ["74 mm Hg", "110 mm Hg", "92 mm Hg", "18 mm Hg"], "a": 0, "r": "CPP = MAP − ICP = 74."}, {"topic": "CPP", "q": "MAP stays 90 mm Hg while ICP rises from 15 to 25 mm Hg. What happens to CPP?", "o": ["CPP decreases", "CPP increases", "CPP stays unchanged", "CPP becomes equal to MAP"], "a": 0, "r": "CPP = MAP − ICP. With MAP unchanged, rising ICP lowers CPP."}, {"topic": "CPP", "q": "ICP remains 18 mm Hg while MAP falls from 95 to 75 mm Hg. What happens to CPP?", "o": ["CPP decreases", "CPP increases", "CPP stays unchanged", "ICP automatically becomes zero"], "a": 0, "r": "Falling MAP lowers CPP when ICP is unchanged."}, {"topic": "GCS", "q": "A GCS of 14 falls in which ATI severity range?", "o": ["Mild", "Moderate", "Severe", "Brain death"], "a": 0, "r": "ATI categorizes 13–15 as mild, 9–12 moderate, and <8 severe."}, {"topic": "GCS", "q": "A GCS falls from 14 to 11. What is the most important interpretation?", "o": ["Neurologic status has deteriorated", "The client improved", "The score is unchanged clinically", "The trend can be ignored"], "a": 0, "r": "The downward trend itself is significant and 11 falls in the moderate range."}];let i=0,s=0,a=0;const g=document.getElementById('game'),sc=document.getElementById('score');
function render(){let q=Q[i];g.innerHTML=`<div class="card"><div class="tag">${q.topic}</div><div class="big">${q.q}</div><div id="opts">${q.o.map((x,j)=>`<button class="choice" data-i="${j}">${x}</button>`).join('')}</div><div id="fb"></div></div>`;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>ans(b,+b.dataset.i,q));upd()}
function ans(b,j,q){if(document.querySelector('#fb').innerHTML)return;a++;document.querySelectorAll('.choice').forEach((x,k)=>{x.disabled=true;if(k===q.a)x.classList.add('correct')});if(j===q.a){s++;b.classList.add('correct')}else b.classList.add('wrong');document.querySelector('#fb').innerHTML=`<div class="feedback"><b>${j===q.a?'Correct':'Review'}</b><br>${q.r}</div>`;upd()}
function upd(){sc.textContent=`Score: ${s}/${a} · Item ${i+1}/${Q.length}`}function next(){i=(i+1)%Q.length;render()}render();</script><nav class="study-site-nav" aria-label="Study site navigation"><a href="index.html">← Day1 Home</a><a href="../index.html">Exam 3 Main</a></nav></body></html>
